name: Database Upgrade

on:
  workflow_call:
    inputs:
      release_sha:
        description: Exact canonical release candidate; validated by Cut release
        required: true
        type: string
      source_sha:
        description: Exact protected source and workflow commit
        required: true
        type: string
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-upgrade-${{ inputs.release_sha && format('candidate-{0}-{1}', github.run_id, github.run_attempt) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify Database Inputs${{ inputs.release_sha && format(' [{0}]', inputs.release_sha) || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      database: ${{ steps.decision.outputs.database }}
      migrations: ${{ steps.decision.outputs.migrations }}

    steps:
      - name: Checkout release candidate for identity verification
        if: inputs.release_sha != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify explicit release candidate
        if: inputs.release_sha != ''
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: node scripts/release-ci-gate.mjs --verify-inputs

      - name: Detect affected database surfaces
        if: inputs.release_sha == '' && github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            database:
              - '.github/workflows/database-upgrade.yml'
              - 'backend/package.json'
              - 'backend/package-lock.json'
              - 'backend/prisma.config.ts'
              - 'backend/prisma/**'
              - 'backend/src/config/database.ts'
              - 'backend/src/config/databaseUtils.ts'
              - 'backend/src/observability.ts'
              - 'backend/src/routes/goals.ts'
              - 'backend/src/routes/metrics.ts'
              - 'backend/src/routes/user.ts'
              - 'backend/src/routes/imports.ts'
              - 'backend/src/services/calorie*.ts'
              - 'backend/src/services/goal*.ts'
              - 'backend/src/services/watch*.ts'
              - 'backend/src/services/clientOperation*.ts'
              - 'backend/src/services/sync*.ts'
              - 'backend/src/services/import*.ts'
              - 'backend/src/services/loseItImport.ts'
              - 'backend/src/services/metricProgress.ts'
              - 'backend/src/services/materializedWeightTrend.ts'
              - 'backend/src/services/weightTrend*.ts'
              - 'backend/src/utils/date.ts'
              - 'backend/src/utils/goal*.ts'
              - 'backend/src/utils/units.ts'
              - 'backend/tsconfig.json'
              - 'deploy/backup/**'
              - 'scripts/postgres-*.mjs'
              - 'shared/weightTrend*.ts'
              - 'shared/goal*.ts'
              - 'shared/calorie*.ts'
            migrations:
              - '.github/workflows/database-upgrade.yml'
              - 'backend/prisma/migrations/**'
              - 'scripts/postgres-rollback-smoke.mjs'
              - 'scripts/postgres-rollback-smoke.test.mjs'

      - name: Select database execution
        id: decision
        shell: bash
        env:
          DATABASE_CHANGED: ${{ inputs.release_sha != '' || github.event_name != 'pull_request' || steps.filter.outputs.database == 'true' }}
          MIGRATIONS_CHANGED: ${{ inputs.release_sha == '' && (github.event_name != 'pull_request' || steps.filter.outputs.migrations == 'true') }}
        run: |
          echo "database=${DATABASE_CHANGED}" >> "${GITHUB_OUTPUT}"
          echo "migrations=${MIGRATIONS_CHANGED}" >> "${GITHUB_OUTPUT}"

  populated-upgrade:
    name: Populated Postgres Upgrade${{ inputs.release_sha && format(' [{0}]', inputs.release_sha) || '' }}
    needs: changes
    if: needs.changes.outputs.database == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: calibrate
          POSTGRES_PASSWORD: calibrate
          POSTGRES_DB: calibrate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U calibrate -d calibrate"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://calibrate:calibrate@localhost:5432/calibrate?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci --no-audit --fund=false

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Validate upgrade-smoke helpers
        run: node --test scripts/postgres-populated-upgrade-smoke.test.mjs

      - name: Upgrade populated schema from 0020 through current
        run: node scripts/postgres-populated-upgrade-smoke.mjs

      - name: Serialize concurrent weight-trend materialization
        run: node scripts/postgres-weight-trend-concurrency-smoke.mjs
      - name: Verify goal pace continuity and concurrent saves
        run: node scripts/postgres-goal-pace-smoke.mjs

  release-upgrade-rollback:
    name: v0.14.0 Upgrade and Encrypted Rollback
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CALIBRATE_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout candidate C with immutable base tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_sha || github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci --no-audit --fund=false

      - name: Validate rollback rehearsal helpers
        run: npm run test:db:rollback:unit

      - name: Upgrade from v0.14.0, restore, and re-upgrade
        run: npm run test:db:rollback
