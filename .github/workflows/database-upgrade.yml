name: Database Upgrade

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-upgrade-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify Database Inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      database: ${{ steps.decision.outputs.database }}

    steps:
      - name: Detect affected database surfaces
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            database:
              - '.github/workflows/database-upgrade.yml'
              - 'package.json'
              - 'backend/package.json'
              - 'backend/package-lock.json'
              - 'backend/prisma.config.ts'
              - 'backend/prisma/**'
              - 'backend/src/config/database.ts'
              - 'backend/src/config/databaseUtils.ts'
              - 'backend/src/observability.ts'
              - 'backend/src/services/materializedWeightTrend.ts'
              - 'backend/src/services/weightTrend*.ts'
              - 'backend/src/utils/date.ts'
              - 'backend/tsconfig.json'
              - 'deploy/backup/**'
              - 'scripts/postgres-*.mjs'
              - 'scripts/release-acceptance.mjs'
              - 'shared/weightTrend*.ts'

      - name: Select database execution
        id: decision
        shell: bash
        env:
          DATABASE_CHANGED: ${{ github.event_name != 'pull_request' || steps.filter.outputs.database == 'true' }}
        run: echo "database=${DATABASE_CHANGED}" >> "${GITHUB_OUTPUT}"

  populated-upgrade:
    name: Populated Postgres Upgrade
    needs: changes
    if: needs.changes.outputs.database == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: calibrate
          POSTGRES_PASSWORD: calibrate
          POSTGRES_DB: calibrate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U calibrate -d calibrate"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://calibrate:calibrate@localhost:5432/calibrate?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci --no-audit --fund=false

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Validate upgrade-smoke helpers
        run: node --test scripts/postgres-populated-upgrade-smoke.test.mjs

      - name: Upgrade populated schema from 0020 through current
        run: node scripts/postgres-populated-upgrade-smoke.mjs

      - name: Serialize concurrent weight-trend materialization
        run: node scripts/postgres-weight-trend-concurrency-smoke.mjs
  release-upgrade-rollback:
    name: v0.14.0 Upgrade and Encrypted Rollback
    needs: changes
    if: needs.changes.outputs.database == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CALIBRATE_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout candidate C with immutable base tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci --no-audit --fund=false

      - name: Validate rollback rehearsal helpers
        run: npm run test:db:rollback:unit

      - name: Upgrade from v0.14.0, restore, and re-upgrade
        id: rollback_rehearsal
        run: npm run test:db:rollback

      - name: Record candidate-bound rollback acceptance summary
        if: always()
        run: >-
          node scripts/release-acceptance.mjs hosted-result
          --workflow database-upgrade
          --gate hosted-database-upgrade-rollback
          --candidate "${{ github.event.pull_request.head.sha || github.sha }}"
          --outcome "${{ steps.rollback_rehearsal.outcome }}"
          --output .codex-screenshots/release-acceptance/postgres-rollback-smoke.json

      - name: Upload candidate-bound rollback acceptance summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-rollback-smoke-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: .codex-screenshots/release-acceptance/postgres-rollback-smoke.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Upload sanitized rollback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-rollback-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: .codex-screenshots/postgres-rollback-smoke/result.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
