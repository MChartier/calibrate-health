name: Publish prepared release

on:
  workflow_call:
    inputs:
      release_commit:
        description: Exact validated release commit that is now an ancestor of master
        required: true
        type: string
      release_branch:
        description: Release branch name matching release/vMAJOR.MINOR.PATCH
        required: true
        type: string
    secrets:
      EXPO_TOKEN:
        required: true
    outputs:
      release_tag:
        description: Immutable stable release tag
        value: ${{ jobs.tag_release.outputs.release_tag }}
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact validated release commit to recover or republish
        required: true
        type: string
      release_branch:
        description: Original release/vMAJOR.MINOR.PATCH branch name
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-prepared-release-${{ inputs.release_commit }}
  cancel-in-progress: false

jobs:
  tag_release:
    name: Verify and tag prepared release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      native_release_tag: ${{ steps.release.outputs.native_release_tag }}
      native_release_ready: ${{ steps.release.outputs.native_release_ready }}

    steps:
      - name: Checkout exact prepared release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve and verify prepared release
        id: release
        shell: bash
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          RELEASE_BRANCH: ${{ inputs.release_branch }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_commit must be a full lowercase Git commit SHA." >&2
            exit 1
          fi
          if [[ ! "${RELEASE_BRANCH}" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release_branch must match release/vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "${RELEASE_COMMIT}" ]]; then
            echo "Checkout does not match prepared release commit ${RELEASE_COMMIT}." >&2
            exit 1
          fi

          git fetch origin master --tags
          if ! git merge-base --is-ancestor "${RELEASE_COMMIT}" origin/master; then
            echo "Prepared release commit ${RELEASE_COMMIT} is not on origin/master." >&2
            exit 1
          fi
          node scripts/release-config.mjs check
          TAG="$(node scripts/release-config.mjs tag)"
          NATIVE_RELEASE_TAG="$(node -p "require('./shared/release.json').android.mobile.native_release_tag")"
          EXPECTED_BRANCH="release/${TAG}"
          if [[ "${RELEASE_BRANCH}" != "${EXPECTED_BRANCH}" ]]; then
            echo "Release branch ${RELEASE_BRANCH} does not match manifest tag ${TAG}." >&2
            exit 1
          fi
          if [[ ! "${NATIVE_RELEASE_TAG}" =~ ^native-v[0-9]+\.[0-9]+\.[0-9]+$ && ! "${NATIVE_RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Native release tag ${NATIVE_RELEASE_TAG} must match native-vMAJOR.MINOR.PATCH (or the legacy vMAJOR.MINOR.PATCH format for a prepared historical release)." >&2
            exit 1
          fi
          NATIVE_RELEASE_READY=false
          if git show-ref --tags --verify --quiet "refs/tags/${NATIVE_RELEASE_TAG}"; then
            NATIVE_RELEASE_COMMIT="$(git rev-parse "${NATIVE_RELEASE_TAG}^{commit}")"
            if ! git merge-base --is-ancestor "${NATIVE_RELEASE_COMMIT}" "${RELEASE_COMMIT}"; then
              echo "Native release tag ${NATIVE_RELEASE_TAG} is not an ancestor of ${RELEASE_COMMIT}." >&2
              exit 1
            fi
            NATIVE_RELEASE_READY=true
          fi

          CREATE_TAG=true
          if git show-ref --tags --verify --quiet "refs/tags/${TAG}"; then
            TAG_COMMIT="$(git rev-list -n 1 "${TAG}")"
            if [[ "${TAG_COMMIT}" != "${RELEASE_COMMIT}" ]]; then
              echo "Existing tag ${TAG} points to ${TAG_COMMIT}, not prepared commit ${RELEASE_COMMIT}." >&2
              exit 1
            fi
            CREATE_TAG=false
          else
            LATEST_TAG="$(git tag --list --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
            if [[ -n "${LATEST_TAG}" ]]; then
              node scripts/release-config.mjs tag --latest-tag "${LATEST_TAG}" >/dev/null
            fi
          fi

          {
            echo "release_tag=${TAG}"
            echo "native_release_tag=${NATIVE_RELEASE_TAG}"
            echo "native_release_ready=${NATIVE_RELEASE_READY}"
            echo "create_tag=${CREATE_TAG}"
          } >> "${GITHUB_OUTPUT}"

      - name: Create and push annotated release tag
        if: steps.release.outputs.create_tag == 'true'
        shell: bash
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${RELEASE_TAG}" -m "Release ${RELEASE_TAG}" "${RELEASE_COMMIT}"
          git push origin "${RELEASE_TAG}"

      - name: Summarize immutable release
        shell: bash
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          RELEASE_BRANCH: ${{ inputs.release_branch }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          NATIVE_RELEASE_READY: ${{ steps.release.outputs.native_release_ready }}
          NATIVE_RELEASE_TAG: ${{ steps.release.outputs.native_release_tag }}
        run: |
          {
            echo "## Publishing ${RELEASE_TAG}"
            echo
            echo "- Prepared branch: \`${RELEASE_BRANCH}\`"
            echo "- Immutable source: \`${RELEASE_COMMIT}\`"
            echo "- Source tag: \`${RELEASE_TAG}\`"
            echo "- Image: \`ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/calibratehealth:${RELEASE_TAG}\`"
            echo "- Moving image: \`ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/calibratehealth:latest\`"
            if [[ "${NATIVE_RELEASE_READY}" == "true" ]]; then
              echo "- OTA: publish internal after image publication, then await production approval"
            else
              echo "- OTA: skipped until native build tag \`${NATIVE_RELEASE_TAG}\` is published"
            fi
            echo
            echo "If a post-merge stage fails, rerun Publish prepared release for \`${RELEASE_TAG}\`."
          } >> "${GITHUB_STEP_SUMMARY}"

  build_release_image:
    name: Build validated release image
    needs: tag_release
    uses: ./.github/workflows/container.yml
    with:
      release_tag: ${{ needs.tag_release.outputs.release_tag }}
      publish_latest: true

  publish_ota:
    name: Publish released Expo OTA update
    needs: [tag_release, build_release_image]
    if: needs.tag_release.outputs.native_release_ready == 'true'
    uses: ./.github/workflows/expo-ota-update.yml
    with:
      source_ref: ${{ inputs.release_commit }}
      native_build_ref: ${{ needs.tag_release.outputs.native_release_tag }}
      message: Release ${{ needs.tag_release.outputs.release_tag }}
    secrets: inherit
