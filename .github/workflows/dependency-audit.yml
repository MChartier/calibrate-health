name: Dependency Audit

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '30 13 * * 1'

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify Dependency Inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      audit_matrix: ${{ steps.matrix.outputs.audit_matrix }}
      has_audit: ${{ steps.matrix.outputs.has_audit }}

    steps:
      - name: Detect affected dependency surfaces
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            root:
              - '.github/workflows/dependency-audit.yml'
              - 'package.json'
              - 'package-lock.json'
              - 'scripts/dependency-advisory-exceptions.mjs'
              - 'scripts/release-config.mjs'
            backend:
              - '.github/workflows/dependency-audit.yml'
              - 'backend/package.json'
              - 'backend/package-lock.json'

      - name: Select audit workspaces
        id: matrix
        shell: bash
        env:
          ROOT_CHANGED: ${{ github.event_name != 'pull_request' || steps.filter.outputs.root == 'true' }}
          BACKEND_CHANGED: ${{ github.event_name != 'pull_request' || steps.filter.outputs.backend == 'true' }}
        run: |
          case "${ROOT_CHANGED}:${BACKEND_CHANGED}" in
            true:true)
              matrix='{"include":[{"workspace":"Root and Mobile","directory":".","evidence":"root","lockfile":"package-lock.json","node":"22.13.0"},{"workspace":"Backend","directory":"backend","evidence":"backend","lockfile":"backend/package-lock.json","node":"20"}]}'
              ;;
            true:false)
              matrix='{"include":[{"workspace":"Root and Mobile","directory":".","evidence":"root","lockfile":"package-lock.json","node":"22.13.0"}]}'
              ;;
            false:true)
              matrix='{"include":[{"workspace":"Backend","directory":"backend","evidence":"backend","lockfile":"backend/package-lock.json","node":"20"}]}'
              ;;
            *)
              matrix='{"include":[]}'
              ;;
          esac
          echo "audit_matrix=${matrix}" >> "${GITHUB_OUTPUT}"
          if [ "${matrix}" = '{"include":[]}' ]; then
            echo "has_audit=false" >> "${GITHUB_OUTPUT}"
          else
            echo "has_audit=true" >> "${GITHUB_OUTPUT}"
          fi

  production-audit:
    name: ${{ matrix.workspace }} Production Audit
    needs: changes
    if: needs.changes.outputs.has_audit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.audit_matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ${{ matrix.lockfile }}

      - name: Install production dependency graph
        run: npm ci --omit=dev --no-audit --fund=false
        working-directory: ${{ matrix.directory }}

      - name: Audit backend high and critical production findings
        if: matrix.directory != '.'
        run: npm audit --omit=dev --audit-level=high
        working-directory: ${{ matrix.directory }}

      - name: Audit root and mobile high and critical production findings
        if: matrix.directory == '.'
        run: npm run audit:production

      - name: Validate time-bounded dependency exceptions
        if: matrix.directory == '.'
        run: npm run audit:exceptions:check
