name: Dependency Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '30 13 * * 1'

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-audit:
    name: ${{ matrix.workspace }} Production Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: Root and Mobile
            directory: .
            node: '22.13.0'
            audit_args: '--omit=dev'
          - workspace: Backend
            directory: backend
            node: '20'
            audit_args: '--omit=dev'
          - workspace: Locked EAS CLI
            directory: tools/eas-cli
            node: '22.14.0'
            audit_args: ''

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}

      - name: Report high and critical dependency findings
        run: npm audit --package-lock-only --audit-level=high ${{ matrix.audit_args }}
        working-directory: ${{ matrix.directory }}
