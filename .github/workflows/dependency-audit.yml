name: Dependency Audit

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '30 13 * * 1'

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  production-audit:
    name: ${{ matrix.workspace }} Production Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: Root and Mobile
            directory: .
            evidence: root
            lockfile: package-lock.json
            node: 22.13.0
          - workspace: Backend
            directory: backend
            evidence: backend
            lockfile: backend/package-lock.json
            node: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ${{ matrix.lockfile }}

      - name: Install production dependency graph
        run: npm ci --omit=dev --no-audit --fund=false
        working-directory: ${{ matrix.directory }}

      - name: Audit backend high and critical production findings
        if: matrix.directory != '.'
        run: npm audit --omit=dev --audit-level=high
        working-directory: ${{ matrix.directory }}

      - name: Audit root and mobile high and critical production findings
        if: matrix.directory == '.'
        run: npm run audit:production

      - name: Validate time-bounded dependency exceptions
        if: matrix.directory == '.'
        run: npm run audit:exceptions:check

      - name: Record candidate-bound dependency-audit summary
        if: always()
        run: >-
          node scripts/release-acceptance.mjs hosted-result
          --workflow dependency-audit
          --gate hosted-dependency-audit
          --candidate "${{ github.event.pull_request.head.sha || github.sha }}"
          --outcome "${{ job.status }}"
          --job "production-audit-${{ matrix.evidence }}"
          --output .codex-screenshots/release-acceptance/dependency-audit-${{ matrix.evidence }}.json

      - name: Upload candidate-bound dependency-audit summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-${{ matrix.evidence }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .codex-screenshots/release-acceptance/dependency-audit-${{ matrix.evidence }}.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
