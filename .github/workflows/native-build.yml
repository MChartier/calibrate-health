# Builds stay credential-free until prebuild and exact protected-source checks finish.
name: Build paired native release
on:
  workflow_call:
    inputs:
      source_commit:
        required: true
        type: string
    secrets:
      CALIBRATE_ANDROID_UPLOAD_KEYSTORE_BASE64:
        required: false
      CALIBRATE_ANDROID_SIGNING_STORE_PASSWORD:
        required: false
      CALIBRATE_ANDROID_SIGNING_KEY_ALIAS:
        required: false
      CALIBRATE_ANDROID_SIGNING_KEY_PASSWORD:
        required: false
permissions:
  contents: read
env:
  ANDROID_BUILD_TOOLS_VERSION: '36.0.0'
  BUNDLETOOL_VERSION: '1.18.3'
  BUNDLETOOL_SHA256: a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29
jobs:
  build-internal:
    name: Build paired production-channel artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: native-release-signing
    permissions:
      contents: read
    outputs:
      phone_aab_sha256: ${{ steps.artifact-hashes.outputs.phone_aab_sha256 }}
      watch_aab_sha256: ${{ steps.artifact-hashes.outputs.watch_aab_sha256 }}
    env:
      EXPO_NO_METRO_WORKSPACE_ROOT: '1'
      EXPO_PUBLIC_CALIBRATE_SERVER_URL: https://calibratehealth.app
      EXPO_PUBLIC_EAS_PROJECT_ID: fda8f8c5-e646-47ac-82fb-35003c9cbec7
      EXPO_UPDATES_CHANNEL: production
      NODE_ENV: production
      SOURCE_COMMIT: ${{ inputs.source_commit }}

    steps:
      - name: Checkout exact reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.source_commit }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools

      - name: Activate reviewed Android command-line tools
        shell: bash
        run: |
          set -euo pipefail
          test -x "$ANDROID_HOME/cmdline-tools/15859902/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/15859902/bin" >> "$GITHUB_PATH"

      - name: Provision pinned artifact inspection tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" platform-tools >/dev/null
          BUNDLETOOL_JAR="${RUNNER_TEMP}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          curl --fail --location --retry 3 \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar" \
            --output "${BUNDLETOOL_JAR}"
          echo "${BUNDLETOOL_SHA256}  ${BUNDLETOOL_JAR}" | sha256sum --check
          echo "BUNDLETOOL_JAR=${BUNDLETOOL_JAR}" >> "${GITHUB_ENV}"

      - name: Install native release dependencies
        run: npm ci --no-audit --fund=false

      - name: Generate and verify credential-free native Gradle state
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "${RUNNER_TEMP}/calibrate-android-upload.keystore"
          node scripts/native-release-build.mjs prepare

      - name: Verify protected workflow and canonical release before signing
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: >-
          node scripts/release-config.mjs verify-current-release-workflow
          --repository-root "${GITHUB_WORKSPACE}"
          --workflow-sha "${WORKFLOW_SHA}"
          --release-commit "${SOURCE_COMMIT}"

      - name: Require native signing configuration
        shell: bash
        env:
          KEY_ALIAS: ${{ secrets.CALIBRATE_ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CALIBRATE_ANDROID_SIGNING_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.CALIBRATE_ANDROID_SIGNING_STORE_PASSWORD }}
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.CALIBRATE_ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${UPLOAD_KEYSTORE_BASE64}" ]] || missing+=(CALIBRATE_ANDROID_UPLOAD_KEYSTORE_BASE64)
          [[ -n "${STORE_PASSWORD}" ]] || missing+=(CALIBRATE_ANDROID_SIGNING_STORE_PASSWORD)
          [[ -n "${KEY_ALIAS}" ]] || missing+=(CALIBRATE_ANDROID_SIGNING_KEY_ALIAS)
          [[ -n "${KEY_PASSWORD}" ]] || missing+=(CALIBRATE_ANDROID_SIGNING_KEY_PASSWORD)
          if (( ${#missing[@]} > 0 )); then
            printf 'Configure these native-release-signing environment secrets before building: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Materialize shared Android upload signing
        shell: bash
        env:
          KEY_ALIAS: ${{ secrets.CALIBRATE_ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CALIBRATE_ANDROID_SIGNING_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.CALIBRATE_ANDROID_SIGNING_STORE_PASSWORD }}
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.CALIBRATE_ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          STORE_FILE="${RUNNER_TEMP}/calibrate-android-upload.keystore"
          printf '%s' "${UPLOAD_KEYSTORE_BASE64}" | base64 --decode > "${STORE_FILE}"
          chmod 600 "${STORE_FILE}"
          test -s "${STORE_FILE}"
          {
            echo "CALIBRATE_ANDROID_SIGNING_STORE_FILE=${STORE_FILE}"
            echo "CALIBRATE_ANDROID_SIGNING_STORE_PASSWORD=${STORE_PASSWORD}"
            echo "CALIBRATE_ANDROID_SIGNING_KEY_ALIAS=${KEY_ALIAS}"
            echo "CALIBRATE_ANDROID_SIGNING_KEY_PASSWORD=${KEY_PASSWORD}"
          } >> "${GITHUB_ENV}"

      - name: Build signed phone and Wear APKs and AABs once
        run: node scripts/native-release-build.mjs build-prepared

      - name: Remove signing material before artifact verification
        if: always()
        shell: bash
        run: |
          rm -f "${RUNNER_TEMP}/calibrate-android-upload.keystore"
          {
            echo 'CALIBRATE_ANDROID_SIGNING_STORE_FILE='
            echo 'CALIBRATE_ANDROID_SIGNING_STORE_PASSWORD='
            echo 'CALIBRATE_ANDROID_SIGNING_KEY_ALIAS='
            echo 'CALIBRATE_ANDROID_SIGNING_KEY_PASSWORD='
          } >> "${GITHUB_ENV}"

      - name: Verify exact paired artifacts and bind AAB hashes
        id: artifact-hashes
        shell: bash
        run: |
          set -euo pipefail
          VERIFICATION_FILE="${RUNNER_TEMP}/native-play-artifact-verification.json"
          node scripts/native-play-release.mjs verify-artifacts \
            --source-commit "${SOURCE_COMMIT}" > "${VERIFICATION_FILE}"
          PHONE_AAB_SHA256="$(jq --exit-status --raw-output \
            '.artifacts | map(select(.id == "phone-aab")) | select(length == 1) | .[0].sha256 | select(test("^[0-9a-f]{64}$"))' \
            "${VERIFICATION_FILE}")"
          WATCH_AAB_SHA256="$(jq --exit-status --raw-output \
            '.artifacts | map(select(.id == "watch-aab")) | select(length == 1) | .[0].sha256 | select(test("^[0-9a-f]{64}$"))' \
            "${VERIFICATION_FILE}")"
          echo "phone_aab_sha256=${PHONE_AAB_SHA256}" >> "${GITHUB_OUTPUT}"
          echo "watch_aab_sha256=${WATCH_AAB_SHA256}" >> "${GITHUB_OUTPUT}"

      - name: Capture verified native runtime and artifact identities
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: node scripts/native-release-artifacts.mjs capture "${SOURCE_COMMIT}" "${WORKFLOW_SHA}"

      - name: Upload paired native release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-play-release-${{ inputs.source_commit }}
          path: |
            mobile/android/app/build/outputs/apk/release/app-release.apk
            mobile/android/app/build/outputs/bundle/release/app-release.aab
            wear/app/build/outputs/apk/release/app-release.apk
            wear/app/build/outputs/bundle/release/app-release.aab
            build/native-release-provenance.json
            native-metadata.json
          if-no-files-found: error
          retention-days: 30

  attest:
    name: Attest native build metadata without signing or Expo credentials
    needs: build-internal
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          path: .release-tooling
          sparse-checkout: |
            scripts
            tools
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-play-release-${{ inputs.source_commit }}
          path: ${{ runner.temp }}/native-build
      - name: Verify current protected workflow before attestation
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = refs/heads/master
          ROOT="${RUNNER_TEMP}/native-attestation-authority"
          git init --quiet --template='' "${ROOT}"
          git -C "${ROOT}" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          node .release-tooling/scripts/release-config.mjs verify-current-release-workflow --repository-root "${ROOT}" --workflow-sha "${WORKFLOW_SHA}" --release-commit "${SOURCE_COMMIT}"
          jq -e --arg source "${SOURCE_COMMIT}" --arg workflow "${WORKFLOW_SHA}" '.source_commit == $source and .workflow_sha == $workflow' "${RUNNER_TEMP}/native-build/native-metadata.json"
      - name: Attest exact native build metadata
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
        with:
          subject-path: ${{ runner.temp }}/native-build/native-metadata.json
          push-to-registry: false
          create-storage-record: false
