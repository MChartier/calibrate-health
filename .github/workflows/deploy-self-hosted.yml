name: Deploy self-hosted server

on:
  workflow_call:
    inputs:
      image_ref:
        description: Exact GHCR image reference ending in @sha256:<digest>
        required: true
        type: string
      release_tag:
        description: Expected server release vMAJOR.MINOR.PATCH
        required: true
        type: string
      release_commit:
        description: Canonical release commit for the protected Cut release authority check
        required: false
        type: string
  workflow_dispatch:
    inputs:
      image_ref:
        description: Published digest from the failed deployment (no rebuild needed)
        required: true
        type: string
      release_tag:
        description: Expected server release vMAJOR.MINOR.PATCH
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: vars.SELF_HOSTED_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: self-hosted-testing
    # Serialize the shared WireGuard peer as well as the target stack. Never cancel migrations.
    concurrency:
      group: self-hosted-testing-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout deployment tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ job.workflow_sha }}
          persist-credentials: false

      - name: Install WireGuard tools if missing
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v wg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends wireguard-tools
          fi

      - name: Verify current protected workflow authority before deployment credentials
        shell: bash
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_NO_REPLACE_OBJECTS: '1'
        run: |
          set -euo pipefail
          VERIFY_ROOT="${RUNNER_TEMP}/calibrate-deployment-authority"
          if [[ "${GITHUB_REF}" != "refs/heads/master" || ! "${WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ || -e "${VERIFY_ROOT}" ]]; then
            echo "Deployment requires protected-master workflow code and a fresh authority directory." >&2
            exit 1
          fi
          git init --quiet --template='' "${VERIFY_ROOT}"
          git -C "${VERIFY_ROOT}" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          RELEASE_ARGS=()
          if [[ -n "${RELEASE_COMMIT}" ]]; then
            RELEASE_ARGS=(--release-commit "${RELEASE_COMMIT}")
          fi
          node scripts/release-config.mjs verify-current-release-workflow \
            --repository-root "${VERIFY_ROOT}" \
            --workflow-sha "${WORKFLOW_SHA}" \
            "${RELEASE_ARGS[@]}"

      - name: Deploy published digest over WireGuard and SSH
        env:
          DEPLOY_IMAGE_REF: ${{ inputs.image_ref }}
          DEPLOY_RELEASE_TAG: ${{ inputs.release_tag }}
          DEPLOY_IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/calibratehealth
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
          DEPLOY_WG_ADDRESS: ${{ vars.DEPLOY_WG_ADDRESS }}
          DEPLOY_WG_ENDPOINT: ${{ vars.DEPLOY_WG_ENDPOINT }}
          DEPLOY_WG_PUBLIC_KEY: ${{ vars.DEPLOY_WG_PUBLIC_KEY }}
          DEPLOY_WG_PRIVATE_KEY: ${{ secrets.DEPLOY_WG_PRIVATE_KEY }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: node deploy/scripts/connect-and-deploy.mjs

      - name: Remove tunnel after cancellation or failure
        if: always()
        shell: bash
        run: |
          if sudo ip link show calibrate-ci >/dev/null 2>&1; then
            sudo ip link delete calibrate-ci
          fi
