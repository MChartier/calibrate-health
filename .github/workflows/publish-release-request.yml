name: Publish prepared release

run-name: Request prepared release ${{ inputs.release_commit }}

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Durable GitHub Release record ID (preferred; leave legacy commit/branch empty)
        required: false
        type: string
      recovery_operation:
        description: Resume remaining stages or explicitly abandon a reconciled release
        required: true
        default: resume
        type: choice
        options:
          - resume
          - reconcile
          - abandon
      confirm_play_console_clean:
        description: If native submission remains, Play has no unrelated pending changes and other Console/API edits are paused
        required: false
        default: false
        type: boolean
      release_commit:
        description: Exact validated release commit to recover or republish
        required: false
        type: string
      release_branch:
        description: Original release/vMAJOR.MINOR.PATCH branch name
        required: false
        type: string
      reconciliation:
        description: "For reconcile only: JSON evidence described in docs/native-store-release.md"
        required: false
        type: string

permissions:
  contents: read

jobs:
  request:
    name: Submit read-only prepared release request
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require protected master and exact inputs
        shell: bash
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          RECOVERY_OPERATION: ${{ inputs.recovery_operation }}
          CONFIRM_PLAY_CONSOLE_CLEAN: ${{ inputs.confirm_play_console_clean }}
          RELEASE_BRANCH: ${{ inputs.release_branch }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          RECONCILIATION: ${{ inputs.reconciliation }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/master" ]]; then
            echo "Prepared release requests must run from protected master; received ${GITHUB_REF}." >&2
            exit 1
          fi
          if [[ -n "${RELEASE_ID}" ]]; then
            [[ "${RELEASE_ID}" =~ ^[1-9][0-9]*$ ]]
            [[ -z "${RELEASE_COMMIT}" && -z "${RELEASE_BRANCH}" ]]
          else
            [[ "${RECOVERY_OPERATION}" == resume && -z "${RECONCILIATION}" ]]
            [[ "${RELEASE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
            [[ "${RELEASE_BRANCH}" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          fi

      - name: Create bound request artifact
        shell: bash
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          RECOVERY_OPERATION: ${{ inputs.recovery_operation }}
          CONFIRM_PLAY_CONSOLE_CLEAN: ${{ inputs.confirm_play_console_clean }}
          RELEASE_BRANCH: ${{ inputs.release_branch }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          REQUEST_RUN_ATTEMPT: ${{ github.run_attempt }}
          REQUEST_RUN_ID: ${{ github.run_id }}
          RECONCILIATION: ${{ inputs.reconciliation }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/calibrate-release-request"
          jq -n \
            --arg head_branch "${GITHUB_REF_NAME}" \
            --arg head_sha "${GITHUB_SHA}" \
            --arg operation publish-prepared-release \
            --arg release_id "${RELEASE_ID}" \
            --arg reconciliation "${RECONCILIATION}" \
            --arg recovery_operation "${RECOVERY_OPERATION}" \
            --argjson confirm_play_console_clean "${CONFIRM_PLAY_CONSOLE_CLEAN}" \
            --arg release_branch "${RELEASE_BRANCH}" \
            --arg release_commit "${RELEASE_COMMIT}" \
            --arg repository "${REPOSITORY}" \
            --arg repository_id "${REPOSITORY_ID}" \
            --arg request_run_attempt "${REQUEST_RUN_ATTEMPT}" \
            --arg request_run_id "${REQUEST_RUN_ID}" \
            '{schema_version:1, operation:$operation, repository:$repository, repository_id:$repository_id, request_run_id:$request_run_id, request_run_attempt:$request_run_attempt, head_branch:$head_branch, head_sha:$head_sha, inputs:(if $release_id != "" then {release_id:$release_id, recovery_operation:$recovery_operation, confirm_play_console_clean:$confirm_play_console_clean, reconciliation:$reconciliation} else {release_branch:$release_branch, release_commit:$release_commit} end)}' \
            > "${RUNNER_TEMP}/calibrate-release-request/request.json"

      - name: Upload fixed prepared release request
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: publish-prepared-release-request
          path: ${{ runner.temp }}/calibrate-release-request/request.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7
