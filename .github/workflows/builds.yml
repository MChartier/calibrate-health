name: Builds

on:
  pull_request:
  workflow_dispatch:
    inputs:
      validation_scope:
        description: Expensive release validation to run in addition to the normal build checks.
        required: true
        default: web
        type: choice
        options:
          - web
          - native
          - web-and-native
          - configuration-only
      run_native_upgrade:
        description: Also rehearse a same-signer phone and Wear package upgrade.
        required: true
        default: false
        type: boolean
      native_upgrade_baseline:
        description: Full Git SHA required only when the native upgrade rehearsal is selected.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: builds-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify Build Inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release_config: ${{ steps.decision.outputs.release_config }}
      backend: ${{ steps.decision.outputs.backend }}
      web: ${{ steps.decision.outputs.web }}
      wear: ${{ steps.decision.outputs.wear }}
      native_runtime: ${{ steps.decision.outputs.native_runtime }}
      native_package: ${{ steps.decision.outputs.native_package }}
      web_release: ${{ steps.decision.outputs.web_release }}
      native_release: ${{ steps.decision.outputs.native_release }}
      native_upgrade: ${{ steps.decision.outputs.native_upgrade }}

    steps:
      - name: Detect affected build surfaces
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          filters: |
            release_config:
              - '.github/native-release-tag-allowed-signers'
              - '.github/native-play-attestation-trusted-workflow-shas'
              - '.github/release-image-attestation-trusted-workflow-shas'
              - 'tools/eas-cli/**'
              - '.github/workflows/**'
              - 'backend/package.json'
              - 'backend/package-lock.json'
              - 'deploy/**'
              - 'docs/openapi/**'
              - 'docs/release-acceptance.md'
              - 'mobile/app.config.js'
              - 'mobile/app.json'
              - 'mobile/eas.json'
              - 'mobile/package.json'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/api-client/src/generated/**'
              - 'playwright.ux.config.ts'
              - 'quality/**'
              - 'scripts/**'
              - 'shared/client-diagnostic-versions.json'
              - 'shared/release.json'
              - 'wear/**'
            backend:
              - 'backend/**'
              - 'shared/**'
            web:
              - 'e2e/expo-web/fixtures.ts'
              - 'e2e/expo-web/release-smoke.spec.ts'
              - 'mobile/app/**'
              - 'mobile/assets/**'
              - 'mobile/public/**'
              - 'mobile/src/**'
              - 'mobile/app.config.js'
              - 'mobile/app.json'
              - 'mobile/babel.config.js'
              - 'mobile/index.js'
              - 'mobile/metro.config.js'
              - 'mobile/modules/**'
              - 'mobile/package.json'
              - 'mobile/tsconfig.json'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/api-client/**'
              - 'playwright.expo-web.config.ts'
              - 'scripts/expo-cli-environment.mjs'
              - 'scripts/expo-web-build.mjs'
              - 'scripts/expo-web-playwright.mjs'
              - 'scripts/expo-web-release.mjs'
              - 'scripts/expo-web-release.test.mjs'
              - 'scripts/expo-web-static-server.mjs'
              - 'scripts/expo-web-static-server.test.mjs'
              - 'shared/**'
            wear:
              - 'wear/**'
            native_runtime:
              - 'mobile/app/**'
              - 'mobile/assets/**'
              - 'mobile/src/**'
              - 'mobile/app.config.js'
              - 'mobile/app.json'
              - 'mobile/babel.config.js'
              - 'mobile/index.js'
              - 'mobile/metro.config.js'
              - 'mobile/modules/**'
              - 'mobile/package.json'
              - 'package-lock.json'
              - 'packages/api-client/**'
              - 'scripts/xcode-uuid-compatibility.test.mjs'
              - 'shared/**'
            native_package:
              - 'mobile/app.config.js'
              - 'mobile/app.json'
              - 'mobile/eas.json'
              - 'mobile/assets/**'
              - 'mobile/modules/**'
              - 'mobile/package.json'
              - 'mobile/plugins/**'
              - 'package-lock.json'
      - name: Detect changes outside generated release mirrors
        if: github.event_name == 'pull_request'
        id: release_mirror_filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          predicate-quantifier: every
          filters: |
            non_release_mirror:
              - '**'
              - '!backend/package-lock.json'
              - '!backend/package.json'
              - '!docs/openapi/v1.yaml'
              - '!package-lock.json'
              - '!package.json'
              - '!packages/api-client/src/generated/v1.ts'
              - '!shared/client-diagnostic-versions.json'
              - '!shared/release.json'

      - name: Validate manual native upgrade baseline
        if: github.event_name == 'workflow_dispatch' && inputs.run_native_upgrade
        shell: bash
        env:
          NATIVE_UPGRADE_BASELINE: ${{ inputs.native_upgrade_baseline }}
        run: |
          if [[ ! "${NATIVE_UPGRADE_BASELINE}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "native_upgrade_baseline must be a lowercase full Git SHA." >&2
            exit 1
          fi

      - name: Select build surfaces
        id: decision
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          RELEASE_CONFIG_CHANGED: ${{ steps.filter.outputs.release_config == 'true' }}
          BACKEND_CHANGED: ${{ steps.filter.outputs.backend == 'true' }}
          WEB_CHANGED: ${{ steps.filter.outputs.web == 'true' }}
          WEAR_CHANGED: ${{ steps.filter.outputs.wear == 'true' }}
          NATIVE_RUNTIME_CHANGED: ${{ steps.filter.outputs.native_runtime == 'true' }}
          NATIVE_PACKAGE_CHANGED: ${{ steps.filter.outputs.native_package == 'true' }}
          NON_RELEASE_MIRROR_CHANGED: ${{ steps.release_mirror_filter.outputs.non_release_mirror == 'true' }}
          MANUAL_VALIDATION_SCOPE: ${{ inputs.validation_scope || 'configuration-only' }}
          MANUAL_NATIVE_UPGRADE: ${{ inputs.run_native_upgrade || false }}
        run: |
          release_config=false
          backend=false
          web=false
          wear=false
          native_runtime=false
          native_package=false
          web_release=false
          native_release=false
          native_upgrade=false

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            release_config=true
            case "${MANUAL_VALIDATION_SCOPE}" in
              web)
                web=true
                web_release=true
                ;;
              native)
                wear=true
                native_runtime=true
                native_package=true
                native_release=true
                ;;
              web-and-native)
                web=true
                wear=true
                native_runtime=true
                native_package=true
                web_release=true
                native_release=true
                ;;
              configuration-only)
                ;;
              *)
                echo "Unknown manual validation scope: ${MANUAL_VALIDATION_SCOPE}" >&2
                exit 1
                ;;
            esac
            if [[ "${MANUAL_NATIVE_UPGRADE}" == "true" ]]; then
              native_upgrade=true
            fi
          else
            release_config=${RELEASE_CONFIG_CHANGED}
            if [[ "${HEAD_REF}" == release/v* && "${NON_RELEASE_MIRROR_CHANGED}" != "true" ]]; then
              echo "Generated version-only release PR: platform build fan-out is intentionally suppressed."
            else
              backend=${BACKEND_CHANGED}
              web=${WEB_CHANGED}
              wear=${WEAR_CHANGED}
              native_runtime=${NATIVE_RUNTIME_CHANGED}
              native_package=${NATIVE_PACKAGE_CHANGED}
            fi
          fi

          echo "release_config=${release_config}" >> "${GITHUB_OUTPUT}"
          echo "backend=${backend}" >> "${GITHUB_OUTPUT}"
          echo "web=${web}" >> "${GITHUB_OUTPUT}"
          echo "wear=${wear}" >> "${GITHUB_OUTPUT}"
          echo "native_runtime=${native_runtime}" >> "${GITHUB_OUTPUT}"
          echo "native_package=${native_package}" >> "${GITHUB_OUTPUT}"
          echo "web_release=${web_release}" >> "${GITHUB_OUTPUT}"
          echo "native_release=${native_release}" >> "${GITHUB_OUTPUT}"
          echo "native_upgrade=${native_upgrade}" >> "${GITHUB_OUTPUT}"

  release-config:
    name: Release Configuration
    needs: changes
    if: needs.changes.outputs.release_config == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Validate versions and quality-gate tests
        run: |
          npm run release:check
          npm run test:release
          npm run test:operations
          npm run test:native-release
          npm run test:wear:emulator:unit
          npm run test:deploy

  backend-build:
    name: Backend Build
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install deps
        run: npm ci --no-audit --fund=false

      - name: Build backend
        run: npm run build

  expo-web-build:
    name: Expo Web Build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup reviewed bundle Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: npm.cmd ci --no-audit --fund=false

      - name: Build and validate Expo web
        run: |
          npm.cmd run build:expo-web
          npm.cmd run test:expo-web:release

  web-critical-smoke:
    name: Web Critical Smoke
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: windows-latest
    timeout-minutes: 10

    env:
      CI: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm.cmd ci --no-audit --fund=false

      - name: Install pinned Playwright Chromium
        run: node node_modules/@playwright/test/cli.js install chromium

      - name: Exercise critical production Web journeys on desktop and phone
        run: npm.cmd run test:expo-web:smoke

  exported-web-e2e:
    name: Full Exported Web and PWA End-to-End
    needs: changes
    if: github.event_name == 'workflow_dispatch' && needs.changes.outputs.web_release == 'true'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout candidate C
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup reviewed Web E2E Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm.cmd ci --no-audit --fund=false

      - name: Install bundled pinned Playwright Chromium
        run: node node_modules/@playwright/test/cli.js install chromium

      - name: Run full exported Web and PWA suite
        run: npm.cmd run test:expo-web
  data-state-acceptance:
    name: Six-State Data-Backed Route Acceptance
    needs: changes
    if: github.event_name == 'workflow_dispatch' && needs.changes.outputs.web_release == 'true'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout candidate C
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup reviewed data-state Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm.cmd ci --no-audit --fund=false

      - name: Install bundled pinned Playwright Chromium
        run: node node_modules/@playwright/test/cli.js install chromium

      - name: Run six-state route acceptance matrix
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/launch-24-data-state-acceptance.json
        run: npm.cmd run test:data-states
  ux-regression:
    name: UX Accessibility and Visual Regression
    needs: changes
    if: github.event_name == 'workflow_dispatch' && needs.changes.outputs.web_release == 'true'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup reviewed UX Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Initialize sanitized UX evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force '.codex-screenshots/expo-web-ux-results' | Out-Null
          Set-Content -LiteralPath '.codex-screenshots/expo-web-ux-results/workflow-started.json' -Encoding utf8 -Value '{"schema_version":1,"scope":"ux-regression"}'

      - name: Install dependencies
        run: npm.cmd ci --no-audit --fund=false

      - name: Install pinned Playwright Chromium
        run: node node_modules/@playwright/test/cli.js install chromium

      - name: Enforce accessibility and visual regression gates
        run: npm.cmd run test:ux

      - name: Upload sanitized UX evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: .codex-screenshots/expo-web-ux-results
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  native-metro-bundle:
    name: ${{ matrix.platform }} Runtime Bundle
    needs: changes
    if: needs.changes.outputs.native_runtime == 'true' || needs.changes.outputs.native_package == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        platform: [android, ios]

    env:
      CI: "1"
      EXPO_NO_METRO_WORKSPACE_ROOT: "1"
      NODE_ENV: production
      NODE_PATH: ${{ github.workspace }}/mobile/node_modules

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --fund=false

      - name: Test installed mobile build tools
        run: npm run test:mobile-build-tools

      - name: Export the ${{ matrix.platform }} Metro bundle
        working-directory: mobile
        run: node ../node_modules/expo/bin/cli export --platform "${{ matrix.platform }}" --output-dir "${RUNNER_TEMP}/calibrate-${{ matrix.platform }}-export"

  mobile-build:
    name: Mobile Build
    needs: changes
    if: needs.changes.outputs.native_package == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902

      - name: Activate reviewed Android command-line tools
        shell: bash
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/15859902/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/15859902/bin" >> "$GITHUB_PATH"

      - name: Install deps
        run: npm ci --no-audit --fund=false

      - name: Type-check mobile
        run: npm --prefix mobile run typecheck

      - name: Prebuild Android
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      - name: Build Android debug
        id: android_debug_build
        working-directory: mobile/android
        run: ./gradlew assembleDebug -PreactNativeArchitectures=x86_64

      - name: Share Android debug APK with emulator E2E
        if: needs.changes.outputs.native_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk-${{ github.event.pull_request.head.sha || github.sha }}
          path: mobile/android/app/build/outputs/apk/debug
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  ios-build:
    name: iOS Build
    needs: changes
    if: needs.changes.outputs.native_package == 'true'
    runs-on: macos-latest
    timeout-minutes: 35

    env:
      CI: "1"
      EXPO_NO_METRO_WORKSPACE_ROOT: "1"
      NODE_ENV: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --fund=false

      - name: Type-check mobile
        run: npm --prefix mobile run typecheck

      - name: Prebuild iOS
        run: npm --prefix mobile run prebuild:ios

      - name: Install CocoaPods dependencies
        working-directory: mobile/ios
        run: pod install

      - name: Build iOS Simulator app
        working-directory: mobile/ios
        run: >-
          xcodebuild
          -workspace calibrate.xcworkspace
          -scheme calibrate
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "${RUNNER_TEMP}/calibrate-ios-derived-data"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build

  wear-build:
    name: Wear Build and JVM Tests
    needs: changes
    if: needs.changes.outputs.wear == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902

      - name: Activate reviewed Android command-line tools
        shell: bash
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/15859902/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/15859902/bin" >> "$GITHUB_PATH"

      - name: Create shared phone and Wear debug keystore
        shell: bash
        run: |
          mkdir -p mobile/android/app
          keytool -genkeypair -noprompt \
            -keystore mobile/android/app/debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Validate Wear source, resources, and tests
        working-directory: wear
        run: ./gradlew assembleDebug testDebugUnitTest --no-daemon --console=plain

  android-emulator-e2e:
    name: Android Emulator End-to-End
    needs: [changes, mobile-build]
    if: github.event_name == 'workflow_dispatch' && needs.changes.outputs.native_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANDROID_ADB_SERIAL: emulator-5554
      CALIBRATE_ANDROID_APK: .ci-artifacts/android-debug/app-debug.apk
      CALIBRATE_DISPOSABLE_SIGNING: "true"
      CALIBRATE_HOSTED_EVIDENCE_OUTPUT: .codex-screenshots/native-hosted/android.json
      CALIBRATE_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      AUTO_LOGIN_TEST_USER: "true"
      CALIBRATE_E2E_API_URL: http://127.0.0.1:3000
      DATABASE_URL: postgresql://calibrate:calibrate@127.0.0.1:5432/calibrate?schema=public
      EXPO_NO_METRO_WORKSPACE_ROOT: "1"
      EXPO_PUBLIC_CALIBRATE_AUTO_LOGIN_TEST_USER: "true"
      EXPO_PUBLIC_CALIBRATE_SERVER_URL: http://localhost:3000
      FOOD_DATA_PROVIDER: usda
      NATIVE_PUSH_MODE: disabled
      NODE_ENV: development
      PORT: "3000"
      SESSION_SECRET: android-emulator-e2e-only-session-secret-000000000000000000000000
      USDA_API_KEY: DEMO_KEY

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: calibrate
          POSTGRES_PASSWORD: calibrate
          POSTGRES_USER: calibrate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U calibrate -d calibrate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Initialize sanitized Android evidence for candidate C
        run: >-
          node scripts/hosted-native-evidence.mjs init
          --lane android
          --source-commit "$CALIBRATE_SOURCE_COMMIT"
          --output "$CALIBRATE_HOSTED_EVIDENCE_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902

      - name: Activate reviewed Android command-line tools
        shell: bash
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/15859902/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/15859902/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install host and backend dependencies
        run: |
          npm ci --no-audit --fund=false
          npm --prefix backend ci --no-audit --fund=false

      - name: Prepare deterministic backend fixture
        shell: bash
        run: |
          npm --prefix backend run build
          npm --prefix backend run db:migrate
          npm --prefix backend run db:seed
          mkdir -p "$RUNNER_TEMP/calibrate-native"
          nohup npm --prefix backend start > "$RUNNER_TEMP/calibrate-native/backend.log" 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/api/v1/healthz > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Backend fixture did not become ready." >&2
          exit 1


      - name: Download reviewed Android debug APK
        uses: actions/download-artifact@v4
        with:
          name: android-debug-apk-${{ github.event.pull_request.head.sha || github.sha }}
          path: .ci-artifacts/android-debug

      - name: Run Android online, offline, process-death, and replay E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-port: 5554
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: node scripts/hosted-android-e2e.mjs


      - name: Upload sanitized Android emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: .codex-screenshots/native-hosted/android.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  wear-release-emulator-smoke:
    name: Wear Release Emulator Smoke
    needs: changes
    if: github.event_name == 'workflow_dispatch' && needs.changes.outputs.native_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CALIBRATE_ANDROID_SIGNING_KEY_ALIAS: calibrate-hosted-emulator
      CALIBRATE_ANDROID_SIGNING_KEY_PASSWORD: hosted-emulator-only-password
      CALIBRATE_ANDROID_SIGNING_STORE_FILE: ${{ github.workspace }}/.ci-signing/native-emulator.p12
      CALIBRATE_ANDROID_SIGNING_STORE_PASSWORD: hosted-emulator-only-password
      CALIBRATE_DISPOSABLE_SIGNING: "true"
      CALIBRATE_HOSTED_EVIDENCE_OUTPUT: .codex-screenshots/native-hosted/wear.json
      CALIBRATE_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      WEAR_ADB_SERIAL: emulator-5554
      WEAR_APK: wear/app/build/outputs/apk/release/app-release.apk
      WEAR_BUILD_TYPE: release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Initialize sanitized Wear evidence for candidate C
        run: >-
          node scripts/hosted-native-evidence.mjs init
          --lane wear
          --source-commit "$CALIBRATE_SOURCE_COMMIT"
          --output "$CALIBRATE_HOSTED_EVIDENCE_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902

      - name: Activate reviewed Android command-line tools
        shell: bash
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/15859902/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/15859902/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Create disposable hosted-emulator signing keys
        shell: bash
        run: |
          mkdir -p .ci-signing
          keytool -genkeypair -noprompt \
            -storetype PKCS12 \
            -keystore "$CALIBRATE_ANDROID_SIGNING_STORE_FILE" \
            -storepass "$CALIBRATE_ANDROID_SIGNING_STORE_PASSWORD" \
            -keypass "$CALIBRATE_ANDROID_SIGNING_KEY_PASSWORD" \
            -alias "$CALIBRATE_ANDROID_SIGNING_KEY_ALIAS" \
            -keyalg RSA \
            -keysize 3072 \
            -validity 1 \
            -dname "CN=Calibrate Hosted Emulator,OU=CI,O=Calibrate,C=US"
          mkdir -p mobile/android/app
          keytool -genkeypair -noprompt \
            -keystore mobile/android/app/debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build non-debuggable Wear release APK
        working-directory: wear
        run: ./gradlew :app:assembleRelease -PcalibrateWearServerUrl=https://calibratehealth.app --no-daemon --console=plain

      - name: Exercise Wear release shell, Tile, permissions, scaling, touch targets, and crash state
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35-ext15
          target: android-wear
          arch: x86_64
          profile: wearos_large_round
          emulator-port: 5554
          emulator-boot-timeout: 600
          # Hosted Wear 5.1 renders Compose blank with Lavapipe; its reviewed passing renderer is SwiftShader.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -append-userspace-opt androidboot.setupwizard_mode=DISABLED
          disable-animations: true
          script: |
            npm run test:wear:emulator
            adb -s "$WEAR_ADB_SERIAL" uninstall app.calibratehealth.mobile
            ./wear/gradlew -p wear :app:connectedDebugAndroidTest -PcalibrateWearServerUrl=https://calibratehealth.app -PcalibrateWearDebugServerUrl=http://10.0.2.2:3000 --no-daemon --console=plain


      - name: Upload sanitized Wear release emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wear-release-emulator-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: .codex-screenshots/native-hosted/wear.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  native-package-upgrade:
    name: Native Two-Emulator Package Upgrade
    needs: changes
    if: github.event_name == 'workflow_dispatch' && needs.changes.outputs.native_upgrade == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      CALIBRATE_DISPOSABLE_SIGNING: "true"
      CALIBRATE_HOSTED_EVIDENCE_OUTPUT: .codex-screenshots/native-hosted/upgrade.json
      CALIBRATE_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      NATIVE_UPGRADE_BASELINE: ${{ github.event.pull_request.base.sha || inputs.native_upgrade_baseline }}

    steps:
      - name: Checkout exact pull-request candidate with baseline history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Initialize sanitized upgrade evidence for candidate C
        run: >-
          node scripts/hosted-native-evidence.mjs init
          --lane upgrade
          --source-commit "$CALIBRATE_SOURCE_COMMIT"
          --output "$CALIBRATE_HOSTED_EVIDENCE_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902

      - name: Activate reviewed Android command-line tools
        shell: bash
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/15859902/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/15859902/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prepare fixed Wear API 35 AVD
        run: node scripts/hosted-native-emulators.mjs prepare-wear

      - name: Build disposable-signed baseline and candidate, then upgrade in place
        id: native_upgrade
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-port: 5554
          emulator-boot-timeout: 600
          cores: 2
          ram-size: 1536M
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            node scripts/hosted-native-emulators.mjs start-wear
            node scripts/hosted-native-emulators.mjs wait-wear
            mkdir -p .codex-screenshots/native-emulator
            npm run test:native:upgrade -- --baseline "$NATIVE_UPGRADE_BASELINE" --candidate "$CALIBRATE_SOURCE_COMMIT" --baseline-version-code 1000000 --candidate-version-code 1000001 --phone-serial emulator-5554 --wear-serial emulator-5556 --server-url https://calibratehealth.app --output .codex-screenshots/native-emulator/native-upgrade.json --execute --package-only > "$RUNNER_TEMP/native-upgrade-console.log"
            echo "Hosted package-only native upgrade passed."

      - name: Stop secondary Wear emulator
        if: always()
        run: node scripts/hosted-native-emulators.mjs stop-wear


      - name: Upload sanitized two-emulator upgrade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-package-upgrade-${{ github.run_id }}-${{ github.run_attempt }}
          path: .codex-screenshots/native-hosted/upgrade.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
