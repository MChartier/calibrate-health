name: Builds

on:
  pull_request:
  workflow_dispatch:
    inputs:
      native_upgrade_baseline:
        description: Full Git SHA to use as the native package upgrade baseline.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: builds-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify Build Inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.decision.outputs.backend }}
      web: ${{ steps.decision.outputs.web }}
      wear: ${{ steps.decision.outputs.wear }}
      native_runtime: ${{ steps.decision.outputs.native_runtime }}
      native_package: ${{ steps.decision.outputs.native_package }}

    steps:
      - name: Detect affected build surfaces
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - '.github/workflows/builds.yml'
              - 'backend/**'
              - 'quality/performance-budgets.json'
              - 'scripts/performance-budgets.mjs'
              - 'shared/**'
            web:
              - '.github/workflows/builds.yml'
              - 'e2e/expo-web/**'
              - 'mobile/app/**'
              - 'mobile/assets/**'
              - 'mobile/public/**'
              - 'mobile/src/**'
              - 'mobile/app.config.js'
              - 'mobile/app.json'
              - 'mobile/babel.config.js'
              - 'mobile/index.js'
              - 'mobile/metro.config.js'
              - 'mobile/modules/**'
              - 'mobile/package.json'
              - 'mobile/tsconfig.json'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/api-client/**'
              - 'playwright.expo-web.config.ts'
              - 'playwright.ux.config.ts'
              - 'quality/performance-budgets.json'
              - 'scripts/expo-cli-environment.mjs'
              - 'scripts/expo-web-*.mjs'
              - 'scripts/performance-budgets.mjs'
              - 'scripts/release-acceptance.mjs'
              - 'scripts/ux-gates.mjs'
              - 'shared/**'
            wear:
              - '.github/workflows/builds.yml'
              - 'wear/**'
              - 'scripts/hosted-native-evidence.mjs'
              - 'scripts/release-acceptance.mjs'
              - 'scripts/wear-emulator-smoke.mjs'
              - 'shared/release.json'
            native_runtime:
              - '.github/workflows/builds.yml'
              - 'mobile/app/**'
              - 'mobile/assets/**'
              - 'mobile/src/**'
              - 'mobile/app.config.js'
              - 'mobile/app.json'
              - 'mobile/babel.config.js'
              - 'mobile/index.js'
              - 'mobile/metro.config.js'
              - 'mobile/modules/**'
              - 'mobile/package.json'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/api-client/**'
              - 'scripts/xcode-uuid-compatibility.test.mjs'
              - 'shared/**'
            native_package:
              - '.github/workflows/builds.yml'
              - 'wear/**'
              - 'mobile/app.config.js'
              - 'mobile/app.json'
              - 'mobile/babel.config.js'
              - 'mobile/eas.json'
              - 'mobile/index.js'
              - 'mobile/metro.config.js'
              - 'mobile/assets/adaptive-icon.png'
              - 'mobile/assets/icon.png'
              - 'mobile/assets/notification-icon.png'
              - 'mobile/modules/**'
              - 'mobile/package.json'
              - 'mobile/plugins/**'
              - 'package-lock.json'
              - 'scripts/android-e2e.mjs'
              - 'scripts/hosted-android-e2e.mjs'
              - 'scripts/hosted-native-emulators.mjs'
              - 'scripts/hosted-native-evidence.mjs'
              - 'scripts/native-release-build.mjs'
              - 'scripts/native-upgrade-rehearsal.mjs'
              - 'scripts/release-acceptance.mjs'
              - 'scripts/wear-emulator-smoke.mjs'
              - 'shared/release.json'

      - name: Validate manual native upgrade baseline
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          NATIVE_UPGRADE_BASELINE: ${{ inputs.native_upgrade_baseline }}
        run: |
          if [[ ! "${NATIVE_UPGRADE_BASELINE}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "native_upgrade_baseline must be a lowercase full Git SHA." >&2
            exit 1
          fi

      - name: Select build surfaces
        id: decision
        shell: bash
        env:
          BACKEND_CHANGED: ${{ github.event_name != 'pull_request' || steps.filter.outputs.backend == 'true' }}
          WEB_CHANGED: ${{ github.event_name != 'pull_request' || steps.filter.outputs.web == 'true' }}
          WEAR_CHANGED: ${{ github.event_name != 'pull_request' || steps.filter.outputs.wear == 'true' }}
          NATIVE_RUNTIME_CHANGED: ${{ github.event_name != 'pull_request' || steps.filter.outputs.native_runtime == 'true' }}
          NATIVE_PACKAGE_CHANGED: ${{ github.event_name != 'pull_request' || steps.filter.outputs.native_package == 'true' }}
        run: |
          echo "backend=${BACKEND_CHANGED}" >> "${GITHUB_OUTPUT}"
          echo "web=${WEB_CHANGED}" >> "${GITHUB_OUTPUT}"
          echo "wear=${WEAR_CHANGED}" >> "${GITHUB_OUTPUT}"
          echo "native_runtime=${NATIVE_RUNTIME_CHANGED}" >> "${GITHUB_OUTPUT}"
          echo "native_package=${NATIVE_PACKAGE_CHANGED}" >> "${GITHUB_OUTPUT}"

  release-config:
    name: Release Configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate versions and quality-gate tests
        run: |
          npm run release:check
          npm run test:release
          npm run test:operations
          npm run test:native-release
          npm run test:wear:emulator:unit
          npm run test:deploy

  backend-build:
    name: Backend Build
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install deps
        run: npm ci --no-audit --fund=false

      - name: Build backend
        run: npm run build


  performance-regression:
    name: Deterministic Performance Regression
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: windows-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup reviewed benchmark Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install deps
        run: npm.cmd ci --no-audit --fund=false

      - name: Enforce deterministic API and recompute performance budget
        run: npm.cmd run performance:regression

  expo-web-build:
    name: Expo Web Build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup reviewed bundle Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: npm.cmd ci --no-audit --fund=false

      - name: Build and validate Expo web
        run: |
          npm.cmd run build:expo-web
          npm.cmd run test:expo-web:release
          npm.cmd run performance:bundle
          npm.cmd run test:performance:web

  exported-web-e2e:
    name: Full Exported Web and PWA End-to-End
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout candidate C
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup reviewed Web E2E Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm.cmd ci --no-audit --fund=false

      - name: Install bundled pinned Playwright Chromium
        run: node node_modules/@playwright/test/cli.js install chromium

      - name: Run full exported Web and PWA suite
        id: exported_web_e2e
        run: npm.cmd run test:expo-web

      - name: Record sanitized candidate-bound Web result
        if: always()
        run: >-
          node scripts/release-acceptance.mjs hosted-result
          --workflow builds
          --gate hosted-exported-web-e2e
          --candidate "${{ github.event.pull_request.head.sha || github.sha }}"
          --outcome "${{ steps.exported_web_e2e.outcome }}"
          --output .codex-screenshots/release-acceptance/exported-web-e2e.json

      - name: Upload sanitized exported Web evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exported-web-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: .codex-screenshots/release-acceptance/exported-web-e2e.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
  data-state-acceptance:
    name: Six-State Data-Backed Route Acceptance
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout candidate C
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup reviewed data-state Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm.cmd ci --no-audit --fund=false

      - name: Install bundled pinned Playwright Chromium
        run: node node_modules/@playwright/test/cli.js install chromium

      - name: Run six-state route acceptance matrix
        id: data_state_matrix
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/launch-24-data-state-acceptance.json
        run: npm.cmd run test:data-states

      - name: Record sanitized candidate-bound data-state result
        if: always()
        run: >-
          node scripts/release-acceptance.mjs hosted-result
          --workflow builds
          --gate hosted-data-state-matrix
          --candidate "${{ github.event.pull_request.head.sha || github.sha }}"
          --outcome "${{ steps.data_state_matrix.outcome }}"
          --output .codex-screenshots/release-acceptance/data-state.json

      - name: Upload sanitized data-state acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-24-data-state-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: .codex-screenshots/release-acceptance/data-state.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
  ux-regression:
    name: UX Accessibility and Visual Regression
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup reviewed UX Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Initialize sanitized UX evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force '.codex-screenshots/expo-web-ux-results' | Out-Null
          Set-Content -LiteralPath '.codex-screenshots/expo-web-ux-results/workflow-started.json' -Encoding utf8 -Value '{"schema_version":1,"scope":"ux-regression"}'

      - name: Install dependencies
        run: npm.cmd ci --no-audit --fund=false

      - name: Install pinned Playwright Chromium
        run: node node_modules/@playwright/test/cli.js install chromium

      - name: Enforce accessibility and visual regression gates
        id: ux_gate
        run: npm.cmd run test:ux

      - name: Record sanitized candidate-bound UX result
        if: always()
        run: >-
          node scripts/release-acceptance.mjs hosted-result
          --workflow builds
          --gate hosted-ux-regression
          --candidate "${{ github.event.pull_request.head.sha || github.sha }}"
          --outcome "${{ steps.ux_gate.outcome }}"
          --output .codex-screenshots/expo-web-ux-results/release-acceptance.json

      - name: Upload sanitized UX evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: .codex-screenshots/expo-web-ux-results
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Upload durable sanitized UX summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-regression-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: .codex-screenshots/expo-web-ux-results/release-acceptance.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  native-metro-bundle:
    name: Android Runtime Bundle
    needs: changes
    if: needs.changes.outputs.native_runtime == 'true' || needs.changes.outputs.native_package == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CI: "1"
      EXPO_NO_METRO_WORKSPACE_ROOT: "1"
      NODE_ENV: production
      NODE_PATH: ${{ github.workspace }}/mobile/node_modules

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --fund=false

      - name: Test installed mobile build tools
        run: npm run test:mobile-build-tools

      - name: Export the Android Metro bundle
        working-directory: mobile
        run: node ../node_modules/expo/bin/cli export --platform android --output-dir "${RUNNER_TEMP}/calibrate-android-export"

  mobile-build:
    name: Mobile Build
    needs: changes
    if: needs.changes.outputs.native_package == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902

      - name: Activate reviewed Android command-line tools
        shell: bash
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/15859902/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/15859902/bin" >> "$GITHUB_PATH"

      - name: Install deps
        run: npm ci --no-audit --fund=false

      - name: Type-check mobile
        run: npm --prefix mobile run typecheck

      - name: Prebuild Android
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      - name: Build Android debug
        id: android_debug_build
        working-directory: mobile/android
        run: ./gradlew assembleDebug -PreactNativeArchitectures=x86_64

      - name: Record candidate C beside the transient debug artifact
        if: always()
        run: >-
          node scripts/hosted-native-evidence.mjs init
          --lane android
          --source-commit "${{ github.event.pull_request.head.sha || github.sha }}"
          --output mobile/android/app/build/outputs/apk/debug/release-acceptance.json

      - name: Share Android debug APK with emulator E2E
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk-${{ github.event.pull_request.head.sha || github.sha }}
          path: mobile/android/app/build/outputs/apk/debug
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  wear-build:
    name: Wear Build and JVM Tests
    needs: changes
    if: needs.changes.outputs.wear == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902

      - name: Activate reviewed Android command-line tools
        shell: bash
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/15859902/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/15859902/bin" >> "$GITHUB_PATH"

      - name: Create shared phone and Wear debug keystore
        shell: bash
        run: |
          mkdir -p mobile/android/app
          keytool -genkeypair -noprompt \
            -keystore mobile/android/app/debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Validate Wear source, resources, and tests
        working-directory: wear
        run: ./gradlew assembleDebug testDebugUnitTest --no-daemon --console=plain

  android-emulator-e2e:
    name: Android Emulator End-to-End
    needs: [changes, mobile-build]
    if: needs.changes.outputs.native_package == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANDROID_ADB_SERIAL: emulator-5554
      CALIBRATE_ANDROID_APK: .ci-artifacts/android-debug/app-debug.apk
      CALIBRATE_DISPOSABLE_SIGNING: "true"
      CALIBRATE_HOSTED_EVIDENCE_OUTPUT: .codex-screenshots/native-hosted/android.json
      CALIBRATE_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      AUTO_LOGIN_TEST_USER: "true"
      CALIBRATE_E2E_API_URL: http://127.0.0.1:3000
      DATABASE_URL: postgresql://calibrate:calibrate@127.0.0.1:5432/calibrate?schema=public
      EXPO_NO_METRO_WORKSPACE_ROOT: "1"
      EXPO_PUBLIC_CALIBRATE_AUTO_LOGIN_TEST_USER: "true"
      EXPO_PUBLIC_CALIBRATE_SERVER_URL: http://localhost:3000
      FOOD_DATA_PROVIDER: usda
      NATIVE_PUSH_MODE: disabled
      NODE_ENV: development
      PORT: "3000"
      SESSION_SECRET: android-emulator-e2e-only-session-secret-000000000000000000000000
      USDA_API_KEY: DEMO_KEY

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: calibrate
          POSTGRES_PASSWORD: calibrate
          POSTGRES_USER: calibrate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U calibrate -d calibrate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Initialize sanitized Android evidence for candidate C
        run: >-
          node scripts/hosted-native-evidence.mjs init
          --lane android
          --source-commit "$CALIBRATE_SOURCE_COMMIT"
          --output "$CALIBRATE_HOSTED_EVIDENCE_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902

      - name: Activate reviewed Android command-line tools
        shell: bash
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/15859902/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/15859902/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install host and backend dependencies
        run: |
          npm ci --no-audit --fund=false
          npm --prefix backend ci --no-audit --fund=false

      - name: Prepare deterministic backend fixture
        shell: bash
        run: |
          npm --prefix backend run build
          npm --prefix backend run db:migrate
          npm --prefix backend run db:seed
          mkdir -p "$RUNNER_TEMP/calibrate-native"
          nohup npm --prefix backend start > "$RUNNER_TEMP/calibrate-native/backend.log" 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/api/v1/healthz > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Backend fixture did not become ready." >&2
          exit 1


      - name: Download reviewed Android debug APK
        uses: actions/download-artifact@v4
        with:
          name: android-debug-apk-${{ github.event.pull_request.head.sha || github.sha }}
          path: .ci-artifacts/android-debug

      - name: Run Android online, offline, process-death, and replay E2E
        id: android_e2e
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-port: 5554
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: node scripts/hosted-android-e2e.mjs


      - name: Record candidate-bound Android acceptance summary
        if: always()
        run: >-
          node scripts/release-acceptance.mjs hosted-result
          --workflow builds
          --gate hosted-android-emulator-e2e
          --candidate "${{ github.event.pull_request.head.sha || github.sha }}"
          --outcome "${{ steps.android_e2e.outcome }}"
          --output .codex-screenshots/release-acceptance/android-emulator-e2e.json

      - name: Upload candidate-bound Android acceptance summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-e2e-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: .codex-screenshots/release-acceptance/android-emulator-e2e.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      - name: Upload sanitized Android emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: .codex-screenshots/native-hosted/android.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  wear-release-emulator-smoke:
    name: Wear Release Emulator Smoke
    needs: changes
    if: needs.changes.outputs.wear == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CALIBRATE_ANDROID_SIGNING_KEY_ALIAS: calibrate-hosted-emulator
      CALIBRATE_ANDROID_SIGNING_KEY_PASSWORD: hosted-emulator-only-password
      CALIBRATE_ANDROID_SIGNING_STORE_FILE: ${{ github.workspace }}/.ci-signing/native-emulator.p12
      CALIBRATE_ANDROID_SIGNING_STORE_PASSWORD: hosted-emulator-only-password
      CALIBRATE_DISPOSABLE_SIGNING: "true"
      CALIBRATE_HOSTED_EVIDENCE_OUTPUT: .codex-screenshots/native-hosted/wear.json
      CALIBRATE_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      WEAR_ADB_SERIAL: emulator-5554
      WEAR_APK: wear/app/build/outputs/apk/release/app-release.apk
      WEAR_BUILD_TYPE: release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Initialize sanitized Wear evidence for candidate C
        run: >-
          node scripts/hosted-native-evidence.mjs init
          --lane wear
          --source-commit "$CALIBRATE_SOURCE_COMMIT"
          --output "$CALIBRATE_HOSTED_EVIDENCE_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902

      - name: Activate reviewed Android command-line tools
        shell: bash
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/15859902/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/15859902/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Create disposable hosted-emulator signing keys
        shell: bash
        run: |
          mkdir -p .ci-signing
          keytool -genkeypair -noprompt \
            -storetype PKCS12 \
            -keystore "$CALIBRATE_ANDROID_SIGNING_STORE_FILE" \
            -storepass "$CALIBRATE_ANDROID_SIGNING_STORE_PASSWORD" \
            -keypass "$CALIBRATE_ANDROID_SIGNING_KEY_PASSWORD" \
            -alias "$CALIBRATE_ANDROID_SIGNING_KEY_ALIAS" \
            -keyalg RSA \
            -keysize 3072 \
            -validity 1 \
            -dname "CN=Calibrate Hosted Emulator,OU=CI,O=Calibrate,C=US"
          mkdir -p mobile/android/app
          keytool -genkeypair -noprompt \
            -keystore mobile/android/app/debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build non-debuggable Wear release APK
        working-directory: wear
        run: ./gradlew :app:assembleRelease -PcalibrateWearServerUrl=https://calibratehealth.app --no-daemon --console=plain

      - name: Exercise Wear release shell, Tile, permissions, scaling, touch targets, and crash state
        id: wear_smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35-ext15
          target: android-wear
          arch: x86_64
          profile: wearos_large_round
          emulator-port: 5554
          emulator-boot-timeout: 600
          # Hosted Wear 5.1 renders Compose blank with Lavapipe; its reviewed passing renderer is SwiftShader.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -append-userspace-opt androidboot.setupwizard_mode=DISABLED
          disable-animations: true
          script: |
            npm run test:wear:emulator
            adb -s "$WEAR_ADB_SERIAL" uninstall app.calibratehealth.mobile
            ./wear/gradlew -p wear :app:connectedDebugAndroidTest -PcalibrateWearServerUrl=https://calibratehealth.app -PcalibrateWearDebugServerUrl=http://10.0.2.2:3000 --no-daemon --console=plain


      - name: Record candidate-bound Wear acceptance summary
        if: always()
        run: >-
          node scripts/release-acceptance.mjs hosted-result
          --workflow builds
          --gate hosted-wear-release-emulator-smoke
          --candidate "${{ github.event.pull_request.head.sha || github.sha }}"
          --outcome "${{ steps.wear_smoke.outcome }}"
          --output .codex-screenshots/release-acceptance/wear-release-emulator-smoke.json

      - name: Upload candidate-bound Wear acceptance summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wear-release-emulator-smoke-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: .codex-screenshots/release-acceptance/wear-release-emulator-smoke.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      - name: Upload sanitized Wear release emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wear-release-emulator-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: .codex-screenshots/native-hosted/wear.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  native-package-upgrade:
    name: Native Two-Emulator Package Upgrade
    needs: changes
    if: needs.changes.outputs.native_package == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      CALIBRATE_DISPOSABLE_SIGNING: "true"
      CALIBRATE_HOSTED_EVIDENCE_OUTPUT: .codex-screenshots/native-hosted/upgrade.json
      CALIBRATE_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      NATIVE_UPGRADE_BASELINE: ${{ github.event.pull_request.base.sha || inputs.native_upgrade_baseline }}

    steps:
      - name: Checkout exact pull-request candidate with baseline history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Initialize sanitized upgrade evidence for candidate C
        run: >-
          node scripts/hosted-native-evidence.mjs init
          --lane upgrade
          --source-commit "$CALIBRATE_SOURCE_COMMIT"
          --output "$CALIBRATE_HOSTED_EVIDENCE_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902

      - name: Activate reviewed Android command-line tools
        shell: bash
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/15859902/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/15859902/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prepare fixed Wear API 35 AVD
        run: node scripts/hosted-native-emulators.mjs prepare-wear

      - name: Build disposable-signed baseline and candidate, then upgrade in place
        id: native_upgrade
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-port: 5554
          emulator-boot-timeout: 600
          cores: 2
          ram-size: 1536M
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            node scripts/hosted-native-emulators.mjs start-wear
            node scripts/hosted-native-emulators.mjs wait-wear
            mkdir -p .codex-screenshots/native-emulator
            npm run test:native:upgrade -- --baseline "$NATIVE_UPGRADE_BASELINE" --candidate "$CALIBRATE_SOURCE_COMMIT" --baseline-version-code 1000000 --candidate-version-code 1000001 --phone-serial emulator-5554 --wear-serial emulator-5556 --server-url https://calibratehealth.app --output .codex-screenshots/native-emulator/native-upgrade.json --execute --package-only > "$RUNNER_TEMP/native-upgrade-console.log"
            echo "Hosted package-only native upgrade passed."

      - name: Stop secondary Wear emulator
        if: always()
        run: node scripts/hosted-native-emulators.mjs stop-wear


      - name: Record candidate-bound native-upgrade acceptance summary
        if: always()
        run: >-
          node scripts/release-acceptance.mjs hosted-result
          --workflow builds
          --gate hosted-native-package-upgrade
          --candidate "${{ github.event.pull_request.head.sha || github.sha }}"
          --outcome "${{ steps.native_upgrade.outcome }}"
          --output .codex-screenshots/release-acceptance/native-package-upgrade.json

      - name: Upload candidate-bound native-upgrade acceptance summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-package-upgrade-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: .codex-screenshots/release-acceptance/native-package-upgrade.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      - name: Upload sanitized two-emulator upgrade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-package-upgrade-${{ github.run_id }}-${{ github.run_attempt }}
          path: .codex-screenshots/native-hosted/upgrade.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
