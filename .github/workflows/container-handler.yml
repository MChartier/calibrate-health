name: Handle release image request

on:
  workflow_run:
    workflows:
      - Build Release Image
    types:
      - completed
    branches:
      - master

permissions:
  actions: read
  attestations: write
  contents: read
  id-token: write

concurrency:
  group: calibrate-server-release-publication
  cancel-in-progress: false
  queue: max

jobs:
  verify_request:
    name: Verify protected image request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      publish_latest: ${{ steps.verify.outputs.publish_latest }}
      release_commit: ${{ steps.verify.outputs.release_commit }}
      release_tag: ${{ steps.verify.outputs.release_tag }}

    steps:
      - name: Require current protected master handler
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          if [[ ! "${WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Handler workflow SHA must be a full lowercase commit." >&2
            exit 1
          fi
          CURRENT_MASTER_SHA="$(curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/master" |
            jq -er '.object.sha | select(test("^[0-9a-f]{40}$"))')"
          if [[ "${CURRENT_MASTER_SHA}" != "${WORKFLOW_SHA}" ]]; then
            echo "This handler is from stale ${WORKFLOW_SHA}; current protected master is ${CURRENT_MASTER_SHA}. Dispatch a new request." >&2
            exit 1
          fi

      - name: Check out protected request verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ job.workflow_sha }}
          path: .release-tooling
          persist-credentials: false

      - name: Verify exact protected request run
        shell: bash
        run: >-
          node .release-tooling/scripts/release-handler-event.mjs verify
          --event-file "${GITHUB_EVENT_PATH}"
          --workflow-path .github/workflows/container-request.yml
          --repository "${{ github.repository }}"
          --repository-id "${{ github.repository_id }}"
          --handler-ref "${{ github.ref }}"
          --handler-sha "${{ job.workflow_sha }}"

      - name: Download exact image request artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build-release-image-request
          path: ${{ runner.temp }}/calibrate-release-request
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Verify bound image request
        id: verify
        shell: bash
        env:
          REQUEST_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          REQUEST_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REQUEST_REPOSITORY: ${{ github.event.workflow_run.repository.full_name }}
          REQUEST_REPOSITORY_ID: ${{ github.event.workflow_run.repository.id }}
          REQUEST_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          REQUEST_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          node .release-tooling/scripts/release-request.mjs verify \
            --artifact-directory "${RUNNER_TEMP}/calibrate-release-request" \
            --operation build-release-image \
            --repository "${REQUEST_REPOSITORY}" \
            --repository-id "${REQUEST_REPOSITORY_ID}" \
            --run-id "${REQUEST_RUN_ID}" \
            --run-attempt "${REQUEST_RUN_ATTEMPT}" \
            --head-branch "${REQUEST_HEAD_BRANCH}" \
            --head-sha "${REQUEST_HEAD_SHA}" \
            --github-output "${GITHUB_OUTPUT}"

  run_release:
    name: Run protected image publication
    needs: verify_request
    permissions:
      attestations: write
      contents: read
      id-token: write
    uses: ./.github/workflows/container.yml
    with:
      publish_latest: ${{ fromJSON(needs.verify_request.outputs.publish_latest) }}
      release_commit: ${{ needs.verify_request.outputs.release_commit }}
      release_tag: ${{ needs.verify_request.outputs.release_tag }}
