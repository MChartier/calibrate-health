name: Recover release
on:
  workflow_dispatch:
    inputs:
      request: { description: 'Explicit expo-release recovery request JSON', required: true, type: string }
permissions: { contents: read }
jobs:
  request:
    uses: MChartier/expo-release-template/.github/workflows/release-request.yml@fcff5bff477e1ed324bd1efbdb0d576c09af8742
    with: { request: '${{ inputs.request }}' }
