name: Recover release
on:
  workflow_dispatch:
    inputs:
      request: { description: 'Explicit expo-release recovery request JSON', required: true, type: string }
permissions: { contents: read }
jobs:
  request:
    uses: MChartier/expo-release-template/.github/workflows/release-request.yml@6ae5cf3eaa680ae9911743387a2bd4791349570c
    with: { request: '${{ inputs.request }}' }
