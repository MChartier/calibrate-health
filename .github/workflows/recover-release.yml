# Recovery consumes the original durable record; it never allocates versions or rebuilds accepted native binaries.
name: Recover recorded release
on:
  workflow_call:
    inputs:
      release_id:
        required: true
        type: string
      operation:
        required: true
        type: string
      confirm_play_console_clean:
        required: false
        default: false
        type: boolean
      reconciliation:
        required: false
        default: ""
        type: string
    secrets:
      EXPO_TOKEN:
        required: false
      DEPLOY_WG_ENDPOINT:
        required: true
      DEPLOY_WG_PRIVATE_KEY:
        required: true
      DEPLOY_TOKEN:
        required: true
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    # Recovery reads an unfinished draft, which GitHub exposes only with push access.
    permissions:
      contents: write
      actions: read
    outputs:
      source_commit: ${{ steps.recovery.outputs.source_commit }}
      release_branch: ${{ steps.recovery.outputs.release_branch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts
      - name: Require current protected recovery code
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          test "${GITHUB_REF}" = refs/heads/master
          node scripts/release-config.mjs verify-current-release-workflow --repository-root "${GITHUB_WORKSPACE}" --workflow-sha "${WORKFLOW_SHA}"
      - name: Read remaining stages and the original prepared source
        if: inputs.operation == 'resume'
        id: recovery
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          CONFIRM_PLAY_CONSOLE_CLEAN: ${{ inputs.confirm_play_console_clean }}
        run: node scripts/release-orchestrator.mjs recover "${RELEASE_ID}"
  resume:
    needs: inspect
    if: inputs.operation == 'resume'
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
      packages: write
    uses: ./.github/workflows/release-components.yml
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      DEPLOY_WG_ENDPOINT: ${{ secrets.DEPLOY_WG_ENDPOINT }}
      DEPLOY_WG_PRIVATE_KEY: ${{ secrets.DEPLOY_WG_PRIVATE_KEY }}
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
    with:
      release_id: ${{ inputs.release_id }}
      release_commit: ${{ needs.inspect.outputs.source_commit }}
      release_branch: ${{ needs.inspect.outputs.release_branch }}
      recovery: true
  abandon:
    needs: inspect
    if: inputs.operation == 'abandon'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts
      - name: Preserve completed stages and retire this release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: node scripts/release-orchestrator.mjs abandon "${RELEASE_ID}"
  reconcile:
    needs: inspect
    if: inputs.operation == 'reconcile'
    runs-on: ubuntu-latest
    environment: play-internal
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |-
            scripts
            tools/eas-cli
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0
      - name: Install locked provider client without credentials
        run: npm ci --prefix tools/eas-cli --ignore-scripts --no-audit --fund=false
      - name: Reconcile exact provider results without resubmitting
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          RELEASE_ID: ${{ inputs.release_id }}
          RECONCILIATION: ${{ inputs.reconciliation }}
        run: node scripts/release-reconcile.mjs "${RELEASE_ID}" "${GITHUB_WORKSPACE}"
