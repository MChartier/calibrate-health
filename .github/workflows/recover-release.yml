name: Recover release
on:
  workflow_dispatch:
    inputs:
      request: { description: 'Explicit expo-release recovery request JSON', required: true, type: string }
permissions: { contents: read }
jobs:
  request:
    uses: MChartier/expo-release-template/.github/workflows/release-request.yml@cb56f92f927486c0d4fe233e97f271d8ba958739
    with: { request: '${{ inputs.request }}' }
