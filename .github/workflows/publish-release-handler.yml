name: Handle prepared release request

on:
  workflow_run:
    workflows:
      - Publish prepared release
    types:
      - completed
    branches:
      - master

permissions:
  actions: read
  attestations: write
  contents: read
  id-token: write

concurrency:
  group: calibrate-server-release-publication
  cancel-in-progress: false
  queue: max

jobs:
  verify_request:
    name: Verify protected prepared release request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      release_branch: ${{ steps.verify.outputs.release_branch }}
      release_commit: ${{ steps.verify.outputs.release_commit }}
      release_id: ${{ steps.verify.outputs.release_id }}
      recovery_operation: ${{ steps.verify.outputs.recovery_operation }}
      confirm_play_console_clean: ${{ steps.verify.outputs.confirm_play_console_clean }}
      reconciliation: ${{ steps.verify.outputs.reconciliation }}

    steps:
      - name: Require current protected master handler
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          if [[ ! "${WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Handler workflow SHA must be a full lowercase commit." >&2
            exit 1
          fi
          CURRENT_MASTER_SHA="$(curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/master" |
            jq -er '.object.sha | select(test("^[0-9a-f]{40}$"))')"
          if [[ "${CURRENT_MASTER_SHA}" != "${WORKFLOW_SHA}" ]]; then
            echo "This handler is from stale ${WORKFLOW_SHA}; current protected master is ${CURRENT_MASTER_SHA}. Dispatch a new request." >&2
            exit 1
          fi

      - name: Check out protected request verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ job.workflow_sha }}
          path: .release-tooling
          persist-credentials: false

      - name: Verify exact protected request run
        shell: bash
        run: >-
          node .release-tooling/scripts/release-handler-event.mjs verify --event-file "${GITHUB_EVENT_PATH}" --workflow-path .github/workflows/publish-release-request.yml --repository "${{ github.repository }}" --repository-id "${{ github.repository_id }}" --handler-ref "${{ github.ref }}" --handler-sha "${{ job.workflow_sha }}"

      - name: Download exact prepared release request artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: publish-prepared-release-request
          path: ${{ runner.temp }}/calibrate-release-request
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Verify bound prepared release request
        id: verify
        shell: bash
        env:
          REQUEST_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          REQUEST_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REQUEST_REPOSITORY: ${{ github.event.workflow_run.repository.full_name }}
          REQUEST_REPOSITORY_ID: ${{ github.event.workflow_run.repository.id }}
          REQUEST_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          REQUEST_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          node .release-tooling/scripts/release-request.mjs verify \
            --artifact-directory "${RUNNER_TEMP}/calibrate-release-request" \
            --operation publish-prepared-release \
            --repository "${REQUEST_REPOSITORY}" \
            --repository-id "${REQUEST_REPOSITORY_ID}" \
            --run-id "${REQUEST_RUN_ID}" \
            --run-attempt "${REQUEST_RUN_ATTEMPT}" \
            --head-branch "${REQUEST_HEAD_BRANCH}" \
            --head-sha "${REQUEST_HEAD_SHA}" \
            --github-output "${GITHUB_OUTPUT}"

  run_release:
    if: needs.verify_request.outputs.release_id == ''
    name: Run protected prepared release
    needs: verify_request
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
      packages: write
    uses: ./.github/workflows/publish-release.yml
    with:
      release_branch: ${{ needs.verify_request.outputs.release_branch }}
      release_commit: ${{ needs.verify_request.outputs.release_commit }}

  deploy_legacy:
    name: Verify recovered legacy server deployment
    needs: [verify_request, run_release]
    if: needs.run_release.result == 'success'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-self-hosted.yml
    secrets:
      DEPLOY_WG_ENDPOINT: ${{ secrets.DEPLOY_WG_ENDPOINT }}
      DEPLOY_WG_PRIVATE_KEY: ${{ secrets.DEPLOY_WG_PRIVATE_KEY }}
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
    with:
      release_commit: ${{ needs.verify_request.outputs.release_commit }}
  recover_record:
    needs: verify_request
    if: needs.verify_request.outputs.release_id != ''
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
      packages: write
    uses: ./.github/workflows/recover-release.yml
    secrets:
      DEPLOY_WG_ENDPOINT: ${{ secrets.DEPLOY_WG_ENDPOINT }}
      DEPLOY_WG_PRIVATE_KEY: ${{ secrets.DEPLOY_WG_PRIVATE_KEY }}
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    with:
      release_id: ${{ needs.verify_request.outputs.release_id }}
      operation: ${{ needs.verify_request.outputs.recovery_operation }}
      confirm_play_console_clean: ${{ needs.verify_request.outputs.confirm_play_console_clean == 'true' }}
      reconciliation: ${{ needs.verify_request.outputs.reconciliation }}
