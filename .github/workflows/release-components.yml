# One publication graph. Store processing is deliberately outside the OTA dependency chain.
name: Publish selected release components
on:
  workflow_call:
    inputs:
      release_id:
        required: true
        type: string
      release_commit:
        required: true
        type: string
      release_branch:
        required: false
        type: string
      recovery:
        required: false
        default: false
        type: boolean
    secrets:
      EXPO_TOKEN:
        required: false
      DEPLOY_WG_ENDPOINT:
        required: true
      DEPLOY_WG_PRIVATE_KEY:
        required: true
      DEPLOY_TOKEN:
        required: true
      CALIBRATE_ANDROID_UPLOAD_KEYSTORE_BASE64:
        required: false
      CALIBRATE_ANDROID_SIGNING_STORE_PASSWORD:
        required: false
      CALIBRATE_ANDROID_SIGNING_KEY_ALIAS:
        required: false
      CALIBRATE_ANDROID_SIGNING_KEY_PASSWORD:
        required: false
permissions:
  contents: read
jobs:
  state:
    name: Bind exact publication source and remaining components
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      server: ${{ steps.state.outputs.server }}
      native: ${{ steps.state.outputs.native }}
      ota_internal: ${{ steps.state.outputs.ota_internal }}
      ota_production: ${{ steps.state.outputs.ota_production }}
      image_complete: ${{ steps.state.outputs.image_complete }}
      native_build_complete: ${{ steps.state.outputs.native_build_complete }}
      producing_run_id: ${{ steps.state.outputs.producing_run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ job.workflow_sha }}
          # Recovery must prove ancestry of retained sources older than current master.
          fetch-depth: 0
          persist-credentials: false
      - name: Bind release source and inspect checkpoints
        id: state
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          RELEASE_BRANCH: ${{ inputs.release_branch }}
        run: node scripts/release-orchestrator.mjs bind "${RELEASE_ID}" "${RELEASE_COMMIT}" "${RELEASE_BRANCH}"
  server_image:
    needs: state
    if: needs.state.outputs.server == 'true' && needs.state.outputs.image_complete != 'true'
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
      packages: write
    uses: ./.github/workflows/publish-release.yml
    with:
      release_commit: ${{ inputs.release_commit }}
      release_branch: ${{ inputs.release_branch }}
  record_image:
    needs: [ state, server_image ]
    if: needs.server_image.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts
            tools
      - name: Record completed image publication
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_IMAGE_REF: ${{ needs.server_image.outputs.image_ref }}
        run: node scripts/release-orchestrator.mjs mark "${RELEASE_ID}" image succeeded
  deployment_intent:
    needs: [ state, server_image, record_image ]
    if: ${{ !cancelled() && needs.state.outputs.server == 'true' && (needs.state.outputs.image_complete == 'true' || needs.record_image.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts
            tools
      - name: Reserve one deployment request
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: node scripts/release-orchestrator.mjs mark "${RELEASE_ID}" deploy started
  deploy:
    name: Deploy changed server and require application health
    needs: deployment_intent
    if: ${{ !cancelled() && needs.deployment_intent.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-self-hosted.yml
    secrets:
      DEPLOY_WG_ENDPOINT: ${{ secrets.DEPLOY_WG_ENDPOINT }}
      DEPLOY_WG_PRIVATE_KEY: ${{ secrets.DEPLOY_WG_PRIVATE_KEY }}
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
    with:
      release_commit: ${{ inputs.release_commit }}
  record_deploy:
    needs: deploy
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts
            tools
      - name: Record successful deployment and health
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: node scripts/release-orchestrator.mjs mark "${RELEASE_ID}" deploy succeeded
  native_build:
    needs: state
    if: needs.state.outputs.native == 'true' && needs.state.outputs.native_build_complete != 'true' && !inputs.recovery
    permissions:
      contents: read
      actions: read
      attestations: write
      id-token: write
    uses: ./.github/workflows/native-build.yml
    secrets:
      CALIBRATE_ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.CALIBRATE_ANDROID_UPLOAD_KEYSTORE_BASE64 }}
      CALIBRATE_ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.CALIBRATE_ANDROID_SIGNING_STORE_PASSWORD }}
      CALIBRATE_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.CALIBRATE_ANDROID_SIGNING_KEY_ALIAS }}
      CALIBRATE_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.CALIBRATE_ANDROID_SIGNING_KEY_PASSWORD }}
    with:
      source_commit: ${{ inputs.release_commit }}
  retain_native:
    needs: [ state, native_build ]
    # Recover an attested Actions artifact if interruption preceded durable Release retention.
    if: ${{ !cancelled() && needs.state.result == 'success' && (needs.native_build.result == 'success' || (inputs.recovery && needs.state.outputs.native == 'true' && needs.state.outputs.native_build_complete != 'true')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ job.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            scripts
            tools
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-play-release-${{ inputs.release_commit }}
          path: ${{ runner.temp }}/native-build
          run-id: ${{ needs.state.outputs.producing_run_id }}
          github-token: ${{ github.token }}
      - name: Retain exact attested native binaries
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          git fetch --force --no-tags origin '+refs/heads/master:refs/remotes/origin/master'
          node scripts/native-release-artifacts.mjs retain "${RELEASE_ID}" "${RUNNER_TEMP}/native-build" "${GITHUB_WORKSPACE}"
  queue_phone:
    needs: [ state, record_deploy, retain_native ]
    if: ${{ !cancelled() && needs.state.outputs.native == 'true' && (needs.state.outputs.server != 'true' || needs.record_deploy.result == 'success') && (needs.state.outputs.native_build_complete == 'true' || needs.retain_native.result == 'success') }}
    permissions:
      contents: write
      actions: read
      attestations: read
    uses: ./.github/workflows/native-submit.yml
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    with:
      release_id: ${{ inputs.release_id }}
      source_commit: ${{ inputs.release_commit }}
      operation: queue-phone
      retry_failed: ${{ inputs.recovery }}
  ota:
    name: Publish OTA after selected deployment and native handoff
    needs: [ state, record_deploy, queue_phone ]
    if: ${{ !cancelled() && (needs.state.outputs.ota_internal == 'true' || needs.state.outputs.ota_production == 'true') && (needs.state.outputs.server != 'true' || needs.record_deploy.result == 'success') && (needs.state.outputs.native != 'true' || needs.queue_phone.result == 'success') }}
    permissions:
      contents: write
      actions: read
      attestations: write
      id-token: write
    uses: ./.github/workflows/expo-ota-update.yml
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    with:
      source_ref: ${{ inputs.release_commit }}
      release_record_id: ${{ inputs.release_id }}
      publish_internal: ${{ needs.state.outputs.ota_internal == 'true' }}
      publish_production: ${{ needs.state.outputs.ota_production == 'true' }}
      message: Release ${{ inputs.release_id }}
  finish_native:
    name: Finish phone upload, then submit Wear independently of OTA
    needs: queue_phone
    if: ${{ !cancelled() && needs.queue_phone.result == 'success' }}
    permissions:
      contents: write
      actions: read
      attestations: read
    uses: ./.github/workflows/native-submit.yml
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    with:
      release_id: ${{ inputs.release_id }}
      source_commit: ${{ inputs.release_commit }}
      operation: finish
      retry_failed: ${{ inputs.recovery }}
  finish:
    name: Report all component outcomes and retain unfinished releases
    needs: [ state, record_image, record_deploy, retain_native, ota, finish_native ]
    if: ${{ always() && needs.state.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts
            tools
      - name: Finalize only a fully completed release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: node scripts/release-orchestrator.mjs finish "${RELEASE_ID}"
