# The outer release/promotion workflows serialize Play edits across this entire paired submission.
name: Submit retained native artifacts
on:
  workflow_call:
    inputs:
      release_id:
        required: true
        type: string
      source_commit:
        required: true
        type: string
      operation:
        description: queue-phone returns after handoff; finish waits for phone and then submits Wear
        required: true
        type: string
      retry_failed:
        required: false
        default: false
        type: boolean
    secrets:
      EXPO_TOKEN:
        required: true
permissions:
  contents: read
jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    environment: play-internal
    permissions:
      contents: write
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ job.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: .release-tooling
          sparse-checkout: |
            scripts
            tools/eas-cli
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0
      - name: Install locked EAS tooling without publishing credentials or install scripts
        run: npm ci --prefix .release-tooling/tools/eas-cli --ignore-scripts --no-audit --fund=false
      - name: Verify current protected workflow before native publication
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = refs/heads/master
          ROOT="${RUNNER_TEMP}/native-submit-authority"
          git init --quiet --template='' "${ROOT}"
          git -C "${ROOT}" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          node .release-tooling/scripts/release-config.mjs verify-current-release-workflow --repository-root "${ROOT}" --workflow-sha "${WORKFLOW_SHA}" --release-commit "${SOURCE_COMMIT}"
          git -C .release-tooling fetch --force --no-tags origin '+refs/heads/master:refs/remotes/origin/master'
      - name: Restore and verify the exact attested AABs before Expo authentication
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: >-
          node .release-tooling/scripts/native-release-artifacts.mjs restore "${RELEASE_ID}" "${RUNNER_TEMP}/native-build" "${GITHUB_WORKSPACE}/.release-tooling"
      - name: Queue or monitor the serialized EAS submissions
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          OPERATION: ${{ inputs.operation }}
          RETRY_FAILED_SUBMISSION: ${{ inputs.retry_failed }}
        run: >-
          node .release-tooling/scripts/native-eas-submit.mjs "${OPERATION}" "${RELEASE_ID}" "${RUNNER_TEMP}/native-build" "${GITHUB_WORKSPACE}/.release-tooling"
