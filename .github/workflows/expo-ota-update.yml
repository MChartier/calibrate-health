name: Publish Expo OTA Update

on:
  workflow_call:
    secrets:
      EXPO_TOKEN:
        required: true
    inputs:
      release_record_id:
        description: Optional release checkpoint association; manual OTA stays client-only
        required: false
        type: string
      publish_internal:
        required: false
        default: true
        type: boolean
      publish_production:
        required: false
        default: true
        type: boolean
      source_ref:
        description: Exact released commit to publish
        required: true
        type: string
      message:
        description: Short operator-facing description of this OTA update
        required: true
        type: string
  workflow_dispatch:
    inputs:
      publish_internal:
        description: Publish the internal channel
        required: false
        default: true
        type: boolean
      publish_production:
        description: Publish production after its approval
        required: false
        default: true
        type: boolean
      source_ref:
        description: Exact full master commit to publish
        required: true
        type: string
      message:
        description: Short operator-facing description of this OTA update
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: expo-ota-master
  queue: max
  cancel-in-progress: false

jobs:
  inspect-retained-exports:
    name: Inspect retained OTA exports with draft release access
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # GitHub requires push access to read drafts. Keep it away from source verification and exports.
    permissions:
      contents: write
      actions: read
    outputs:
      internal_retained: ${{ steps.retained.outputs.internal_retained }}
      production_retained: ${{ steps.retained.outputs.production_retained }}
    steps:
      - name: Require protected workflow before inspecting release state
        run: test "${GITHUB_REF}" = refs/heads/master
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0
      - name: Inspect retained OTA exports
        id: retained
        if: ${{ inputs.release_record_id != '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_record_id }}
        run: node scripts/expo-ota-store.mjs inspect "${RELEASE_ID}"

  preflight-release-target:
    name: Verify exact protected OTA source before Expo credentials
    needs: inspect-retained-exports
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      source_commit: ${{ steps.release-target.outputs.source_commit }}
      internal_retained: ${{ needs.inspect-retained-exports.outputs.internal_retained }}
      production_retained: ${{ needs.inspect-retained-exports.outputs.production_retained }}

    steps:
      - name: Require an exact protected master source
        shell: bash
        env:
          OTA_SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/master" ]]; then
            echo "OTA updates must be dispatched from the master branch; received ${GITHUB_REF}." >&2
            exit 1
          fi
          if [[ ! "${OTA_SOURCE_REF}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_ref must be a full lowercase Git commit SHA." >&2
            exit 1
          fi

      # Checkout may use the ephemeral contents-read token, but never persists it for source-owned commands.
      - name: Checkout exact OTA source with ephemeral read-only auth
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.source_ref }}

      - name: Checkout reviewed source verifier only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          path: .release-tooling
          persist-credentials: false
          ref: ${{ job.workflow_sha }}
          sparse-checkout: |-
            scripts
          sparse-checkout-cone-mode: true

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0

      - name: Verify exact origin source ancestry
        id: release-target
        shell: bash
        env:
          OTA_SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_GLOBAL=/dev/null
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_NO_REPLACE_OBJECTS=1
          test "$(git --no-replace-objects rev-parse --verify 'HEAD^{commit}')" = "${OTA_SOURCE_REF}"
          git --no-replace-objects fetch --no-tags --force origin \
            '+refs/heads/master:refs/remotes/origin/master'
          TRUST_SET_COMMIT="$(git --no-replace-objects rev-parse --verify 'refs/remotes/origin/master^{commit}')"
          if [[ ! "${TRUST_SET_COMMIT}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Current protected master did not resolve to a full Git commit SHA." >&2
            exit 1
          fi
          if ! git --no-replace-objects merge-base --is-ancestor \
            "${OTA_SOURCE_REF}" "${TRUST_SET_COMMIT}"; then
            echo "OTA source ${OTA_SOURCE_REF} is not on current protected master." >&2
            exit 1
          fi

          echo "source_commit=${OTA_SOURCE_REF}" >> "${GITHUB_OUTPUT}"

  resolve-internal-environment:
    name: Resolve internal public EAS environment
    needs: preflight-release-target
    if: ${{ !cancelled() && inputs.publish_internal && needs.preflight-release-target.result == 'success' && needs.preflight-release-target.outputs.internal_retained != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview
    env:
      EAS_ENVIRONMENT: preview
      EXPO_PUBLIC_EAS_PROJECT_ID: fda8f8c5-e646-47ac-82fb-35003c9cbec7
      EXPO_UPDATES_CHANNEL: internal
      OTA_SOURCE_REF: ${{ needs.preflight-release-target.outputs.source_commit }}

    steps:
      - name: Require current protected workflow authority before Expo authentication
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.preflight-release-target.outputs.source_commit }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_GLOBAL=/dev/null
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_NO_REPLACE_OBJECTS=1
          if [[ "${GITHUB_REF}" != "refs/heads/master" || ! "${WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "OTA publication requires an exact protected-master workflow commit." >&2
            exit 1
          fi

          VERIFY_ROOT="${RUNNER_TEMP}/calibrate-ota-workflow-authority"
          TOOL_ROOT="${RUNNER_TEMP}/calibrate-ota-authority-tooling"
          if [[ -e "${VERIFY_ROOT}" || -e "${TOOL_ROOT}" ]]; then
            echo "OTA workflow authority directories must not preexist." >&2
            exit 1
          fi
          git init --quiet --template='' "${VERIFY_ROOT}"
          git -C "${VERIFY_ROOT}" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "${VERIFY_ROOT}" --no-replace-objects fetch --force --no-tags origin \
            '+refs/heads/master:refs/remotes/origin/master'
          mkdir -p "${TOOL_ROOT}/scripts"
          git -C "${VERIFY_ROOT}" --no-replace-objects show \
            "${WORKFLOW_SHA}:scripts/release-config.mjs" > "${TOOL_ROOT}/scripts/release-config.mjs"
          git -C "${VERIFY_ROOT}" --no-replace-objects show \
            "${WORKFLOW_SHA}:scripts/native-tag-attestation.mjs" > "${TOOL_ROOT}/scripts/native-tag-attestation.mjs"
          node "${TOOL_ROOT}/scripts/release-config.mjs" verify-current-release-workflow \
            --repository-root "${VERIFY_ROOT}" \
            --workflow-sha "${WORKFLOW_SHA}" \
            --release-commit "${RELEASE_COMMIT}"

      - name: Checkout reviewed OTA publisher tooling only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          path: .release-tooling
          persist-credentials: false
          ref: ${{ job.workflow_sha }}
          sparse-checkout: |
            /scripts/expo-ota-artifact.mjs
            /scripts/expo-ota-publish.mjs
            /scripts/release-record.mjs
            /scripts/expo-runtime.mjs
            /scripts/zip-entry.mjs
            /scripts/native-tag-attestation.mjs
            /scripts/release-config.mjs
            /tools/eas-cli/
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: .release-tooling/tools/eas-cli/package-lock.json

      - name: Install locked EAS CLI before Expo authentication
        run: npm ci --prefix .release-tooling/tools/eas-cli --include=dev --no-audit --fund=false

      - name: Prepare fixed source-free environment project
        shell: bash
        run: >-
          node .release-tooling/scripts/expo-ota-artifact.mjs prepare-environment-project --output-dir "${RUNNER_TEMP}/calibrate-eas-environment-project" --project-id "${EXPO_PUBLIC_EAS_PROJECT_ID}"

      - name: Recheck current protected workflow authority immediately before Expo token
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.preflight-release-target.outputs.source_commit }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_GLOBAL=/dev/null
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_NO_REPLACE_OBJECTS=1
          node .release-tooling/scripts/release-config.mjs verify-current-release-workflow \
            --repository-root "${RUNNER_TEMP}/calibrate-ota-workflow-authority" \
            --workflow-sha "${WORKFLOW_SHA}" \
            --release-commit "${RELEASE_COMMIT}"

      - name: Read internal EAS environment
        working-directory: ${{ runner.temp }}/calibrate-eas-environment-project
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${EXPO_TOKEN}" ]]; then
            echo "Configure the EXPO_TOKEN repository secret before publishing an OTA update." >&2
            exit 1
          fi
          "${GITHUB_WORKSPACE}/.release-tooling/tools/eas-cli/node_modules/.bin/eas" env:pull \
            --environment "${EAS_ENVIRONMENT}" \
            --path "${RUNNER_TEMP}/calibrate-eas-environment.raw" \
            --non-interactive

      - name: Sanitize source-bound public environment artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/calibrate-eas-environment-artifact"
          node .release-tooling/scripts/expo-ota-artifact.mjs sanitize-environment \
            --input "${RUNNER_TEMP}/calibrate-eas-environment.raw" \
            --output "${RUNNER_TEMP}/calibrate-eas-environment-artifact/environment.json" \
            --source-commit "${OTA_SOURCE_REF}" \
            --channel "${EXPO_UPDATES_CHANNEL}" \
            --environment "${EAS_ENVIRONMENT}" \
            --project-id "${EXPO_PUBLIC_EAS_PROJECT_ID}"
          rm -f "${RUNNER_TEMP}/calibrate-eas-environment.raw"

      - name: Upload internal public environment artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: expo-ota-env-internal-${{ needs.preflight-release-target.outputs.source_commit }}
          path: ${{ runner.temp }}/calibrate-eas-environment-artifact/environment.json
          if-no-files-found: error
          retention-days: 3

  build-internal-update:
    name: Build internal Android OTA without publisher credentials
    needs: [ preflight-release-target, resolve-internal-environment ]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EAS_ENVIRONMENT: preview
      EXPO_NO_METRO_WORKSPACE_ROOT: '1'
      EXPO_PUBLIC_EAS_PROJECT_ID: fda8f8c5-e646-47ac-82fb-35003c9cbec7
      EXPO_UPDATES_CHANNEL: internal
      NODE_ENV: production
      OTA_SOURCE_REF: ${{ needs.preflight-release-target.outputs.source_commit }}

    steps:
      - name: Require master dispatch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/master" ]]; then
            echo "OTA updates must be dispatched from the master branch; received ${GITHUB_REF}." >&2
            exit 1
          fi

      - name: Checkout exact source without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.preflight-release-target.outputs.source_commit }}

      - name: Require released source
        shell: bash
        run: |
          set -euo pipefail
          export GIT_CONFIG_GLOBAL=/dev/null
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_NO_REPLACE_OBJECTS=1
          if [[ ! "${OTA_SOURCE_REF}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_ref must be a full lowercase Git commit SHA." >&2
            exit 1
          fi
          test "$(git --no-replace-objects rev-parse HEAD)" = "${OTA_SOURCE_REF}"
          git --no-replace-objects fetch --no-tags --force origin '+refs/heads/master:refs/remotes/origin/master'
          if ! git --no-replace-objects merge-base --is-ancestor "${OTA_SOURCE_REF}" origin/master; then
            echo "OTA source ${OTA_SOURCE_REF} is not on master." >&2
            exit 1
          fi

      - name: Checkout reviewed compatibility and artifact tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          path: .release-tooling
          persist-credentials: false
          ref: ${{ job.workflow_sha }}
          sparse-checkout: |
            /scripts/expo-ota-artifact.mjs
            /scripts/expo-ota-publish.mjs
            /scripts/release-record.mjs
            /scripts/expo-runtime.mjs
            /scripts/zip-entry.mjs
            /scripts/native-ota-contract.mjs
            /scripts/native-ota-update.mjs
            /scripts/native-tag-attestation.mjs
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install source dependencies without publisher credentials
        run: npm ci --include=dev --no-audit --fund=false

      - name: Download internal public environment artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: expo-ota-env-internal-${{ needs.preflight-release-target.outputs.source_commit }}
          path: ${{ runner.temp }}/calibrate-eas-environment-artifact

      - name: Verify and apply internal public environment
        shell: bash
        run: >-
          node .release-tooling/scripts/expo-ota-artifact.mjs verify-environment --environment-artifact "${RUNNER_TEMP}/calibrate-eas-environment-artifact/environment.json" --github-env "${GITHUB_ENV}" --source-commit "${OTA_SOURCE_REF}" --channel "${EXPO_UPDATES_CHANNEL}" --environment "${EAS_ENVIRONMENT}" --project-id "${EXPO_PUBLIC_EAS_PROJECT_ID}"

      - name: Export Android update with source-locked Expo CLI
        working-directory: mobile
        shell: bash
        env:
          CI: '1'
        run: |
          set -euo pipefail
          node "${GITHUB_WORKSPACE}/.release-tooling/scripts/expo-runtime.mjs" "${GITHUB_WORKSPACE}" "${RUNNER_TEMP}/calibrate-expo-runtime.json"
          "${GITHUB_WORKSPACE}/node_modules/.bin/expo" config --type public --json > "${RUNNER_TEMP}/calibrate-expo-public-config.json"
          "${GITHUB_WORKSPACE}/node_modules/.bin/expo" export \
            --platform android \
            --output-dir "${RUNNER_TEMP}/calibrate-expo-export" \
            --dump-sourcemap \
            --dump-assetmap

      - name: Package source-bound internal OTA artifact
        shell: bash
        run: >-
          node .release-tooling/scripts/expo-ota-artifact.mjs package-update --input-dir "${RUNNER_TEMP}/calibrate-expo-export" --output-dir "${RUNNER_TEMP}/calibrate-expo-update-artifact" --public-config "${RUNNER_TEMP}/calibrate-expo-public-config.json" --runtime-file "${RUNNER_TEMP}/calibrate-expo-runtime.json" --package-lock "${GITHUB_WORKSPACE}/package-lock.json" --environment-artifact "${RUNNER_TEMP}/calibrate-eas-environment-artifact/environment.json" --source-commit "${OTA_SOURCE_REF}" --channel "${EXPO_UPDATES_CHANNEL}" --environment "${EAS_ENVIRONMENT}" --project-id "${EXPO_PUBLIC_EAS_PROJECT_ID}"

      - name: Upload source-bound internal OTA artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: expo-ota-android-internal-${{ needs.preflight-release-target.outputs.source_commit }}
          path: ${{ runner.temp }}/calibrate-expo-update-artifact
          if-no-files-found: error
          retention-days: 3
    if: ${{ !cancelled() && needs.preflight-release-target.result == 'success' && needs.resolve-internal-environment.result == 'success' }}

  publish-internal:
    name: Publish pre-exported Android OTA to internal
    permissions:
      contents: write
      actions: read
      attestations: read
    needs:
      - preflight-release-target
      - build-internal-update
      - retain-internal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview
    env:
      EAS_ENVIRONMENT: preview
      EXPO_PUBLIC_EAS_PROJECT_ID: fda8f8c5-e646-47ac-82fb-35003c9cbec7
      EXPO_UPDATES_CHANNEL: internal
      OTA_MESSAGE: ${{ inputs.message }}
      OTA_SOURCE_REF: ${{ needs.preflight-release-target.outputs.source_commit }}

    steps:
      - name: Require current protected workflow authority before Expo authentication
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.preflight-release-target.outputs.source_commit }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_GLOBAL=/dev/null
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_NO_REPLACE_OBJECTS=1
          if [[ "${GITHUB_REF}" != "refs/heads/master" || ! "${WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "OTA publication requires an exact protected-master workflow commit." >&2
            exit 1
          fi

          VERIFY_ROOT="${RUNNER_TEMP}/calibrate-ota-workflow-authority"
          TOOL_ROOT="${RUNNER_TEMP}/calibrate-ota-authority-tooling"
          if [[ -e "${VERIFY_ROOT}" || -e "${TOOL_ROOT}" ]]; then
            echo "OTA workflow authority directories must not preexist." >&2
            exit 1
          fi
          git init --quiet --template='' "${VERIFY_ROOT}"
          git -C "${VERIFY_ROOT}" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "${VERIFY_ROOT}" --no-replace-objects fetch --force --no-tags origin \
            '+refs/heads/master:refs/remotes/origin/master'
          mkdir -p "${TOOL_ROOT}/scripts"
          git -C "${VERIFY_ROOT}" --no-replace-objects show \
            "${WORKFLOW_SHA}:scripts/release-config.mjs" > "${TOOL_ROOT}/scripts/release-config.mjs"
          git -C "${VERIFY_ROOT}" --no-replace-objects show \
            "${WORKFLOW_SHA}:scripts/native-tag-attestation.mjs" > "${TOOL_ROOT}/scripts/native-tag-attestation.mjs"
          node "${TOOL_ROOT}/scripts/release-config.mjs" verify-current-release-workflow \
            --repository-root "${VERIFY_ROOT}" \
            --workflow-sha "${WORKFLOW_SHA}" \
            --release-commit "${RELEASE_COMMIT}"

      - name: Checkout reviewed OTA publisher tooling only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          path: .release-tooling
          persist-credentials: false
          ref: ${{ job.workflow_sha }}
          sparse-checkout: |-
            /scripts/
            /tools/eas-cli/
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: .release-tooling/tools/eas-cli/package-lock.json

      - name: Install locked EAS CLI before Expo authentication
        run: npm ci --prefix .release-tooling/tools/eas-cli --include=dev --no-audit --fund=false

      - name: Download source-bound internal OTA artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: expo-ota-android-internal-${{ needs.preflight-release-target.outputs.source_commit }}
          path: ${{ runner.temp }}/calibrate-expo-update-artifact
        if: ${{ inputs.release_record_id == '' }}
      - name: Restore exact retained OTA export
        if: ${{ inputs.release_record_id != '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_record_id }}
        run: |-
          git -C .release-tooling fetch --force --no-tags origin '+refs/heads/master:refs/remotes/origin/master'
          node .release-tooling/scripts/expo-ota-store.mjs restore "${RELEASE_ID}" internal "${RUNNER_TEMP}/calibrate-expo-update-artifact" "${GITHUB_WORKSPACE}/.release-tooling"

      - name: Verify inert artifact and prepare fixed publisher project
        shell: bash
        run: >-
          node .release-tooling/scripts/expo-ota-artifact.mjs prepare-publisher --artifact-root "${RUNNER_TEMP}/calibrate-expo-update-artifact" --output-dir "${RUNNER_TEMP}/calibrate-expo-publisher" --source-commit "${OTA_SOURCE_REF}" --channel "${EXPO_UPDATES_CHANNEL}" --environment "${EAS_ENVIRONMENT}" --project-id "${EXPO_PUBLIC_EAS_PROJECT_ID}"

      - name: Recheck current protected workflow authority immediately before Expo token
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.preflight-release-target.outputs.source_commit }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_GLOBAL=/dev/null
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_NO_REPLACE_OBJECTS=1
          node .release-tooling/scripts/release-config.mjs verify-current-release-workflow \
            --repository-root "${RUNNER_TEMP}/calibrate-ota-workflow-authority" \
            --workflow-sha "${WORKFLOW_SHA}" \
            --release-commit "${RELEASE_COMMIT}"

      - name: Publish pre-exported Android update to internal
        working-directory: ${{ runner.temp }}/calibrate-expo-publisher
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_RECORD_ID: ${{ inputs.release_record_id }}
        run: >-
          node "${GITHUB_WORKSPACE}/.release-tooling/scripts/expo-ota-publish.mjs" "${RUNNER_TEMP}/calibrate-expo-update-artifact" "${GITHUB_WORKSPACE}/.release-tooling"
    if: ${{ !cancelled() && inputs.publish_internal && needs.preflight-release-target.result == 'success' && (needs.preflight-release-target.outputs.internal_retained == 'true' || (needs.build-internal-update.result == 'success' && (inputs.release_record_id == '' || needs.retain-internal.result == 'success'))) }}

  approve-production:
    name: Approve production OTA
    needs: [ preflight-release-target, publish-internal ]
    if: ${{ !cancelled() && inputs.publish_production && needs.preflight-release-target.result == 'success' && (!inputs.publish_internal || needs.publish-internal.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    permissions:
      contents: read
      actions: read
    steps:
      - name: Approve the same released source for production
        run: echo "Production publication approved after internal publication."

  resolve-production-environment:
    name: Resolve production public EAS environment
    needs: [ preflight-release-target, approve-production ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Production stages start only after the existing production approval.
    env:
      EAS_ENVIRONMENT: production
      EXPO_PUBLIC_EAS_PROJECT_ID: fda8f8c5-e646-47ac-82fb-35003c9cbec7
      EXPO_UPDATES_CHANNEL: production
      OTA_SOURCE_REF: ${{ needs.preflight-release-target.outputs.source_commit }}

    steps:
      - name: Require current protected workflow authority before Expo authentication
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.preflight-release-target.outputs.source_commit }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_GLOBAL=/dev/null
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_NO_REPLACE_OBJECTS=1
          if [[ "${GITHUB_REF}" != "refs/heads/master" || ! "${WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "OTA publication requires an exact protected-master workflow commit." >&2
            exit 1
          fi

          VERIFY_ROOT="${RUNNER_TEMP}/calibrate-ota-workflow-authority"
          TOOL_ROOT="${RUNNER_TEMP}/calibrate-ota-authority-tooling"
          if [[ -e "${VERIFY_ROOT}" || -e "${TOOL_ROOT}" ]]; then
            echo "OTA workflow authority directories must not preexist." >&2
            exit 1
          fi
          git init --quiet --template='' "${VERIFY_ROOT}"
          git -C "${VERIFY_ROOT}" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "${VERIFY_ROOT}" --no-replace-objects fetch --force --no-tags origin \
            '+refs/heads/master:refs/remotes/origin/master'
          mkdir -p "${TOOL_ROOT}/scripts"
          git -C "${VERIFY_ROOT}" --no-replace-objects show \
            "${WORKFLOW_SHA}:scripts/release-config.mjs" > "${TOOL_ROOT}/scripts/release-config.mjs"
          git -C "${VERIFY_ROOT}" --no-replace-objects show \
            "${WORKFLOW_SHA}:scripts/native-tag-attestation.mjs" > "${TOOL_ROOT}/scripts/native-tag-attestation.mjs"
          node "${TOOL_ROOT}/scripts/release-config.mjs" verify-current-release-workflow \
            --repository-root "${VERIFY_ROOT}" \
            --workflow-sha "${WORKFLOW_SHA}" \
            --release-commit "${RELEASE_COMMIT}"

      - name: Checkout reviewed OTA publisher tooling only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          path: .release-tooling
          persist-credentials: false
          ref: ${{ job.workflow_sha }}
          sparse-checkout: |
            /scripts/expo-ota-artifact.mjs
            /scripts/expo-ota-publish.mjs
            /scripts/release-record.mjs
            /scripts/expo-runtime.mjs
            /scripts/zip-entry.mjs
            /scripts/native-tag-attestation.mjs
            /scripts/release-config.mjs
            /tools/eas-cli/
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: .release-tooling/tools/eas-cli/package-lock.json

      - name: Install locked EAS CLI before Expo authentication
        run: npm ci --prefix .release-tooling/tools/eas-cli --include=dev --no-audit --fund=false

      - name: Prepare fixed source-free environment project
        shell: bash
        run: >-
          node .release-tooling/scripts/expo-ota-artifact.mjs prepare-environment-project --output-dir "${RUNNER_TEMP}/calibrate-eas-environment-project" --project-id "${EXPO_PUBLIC_EAS_PROJECT_ID}"

      - name: Recheck current protected workflow authority immediately before Expo token
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.preflight-release-target.outputs.source_commit }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_GLOBAL=/dev/null
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_NO_REPLACE_OBJECTS=1
          node .release-tooling/scripts/release-config.mjs verify-current-release-workflow \
            --repository-root "${RUNNER_TEMP}/calibrate-ota-workflow-authority" \
            --workflow-sha "${WORKFLOW_SHA}" \
            --release-commit "${RELEASE_COMMIT}"

      - name: Read production EAS environment
        working-directory: ${{ runner.temp }}/calibrate-eas-environment-project
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${EXPO_TOKEN}" ]]; then
            echo "Configure the EXPO_TOKEN repository secret before publishing an OTA update." >&2
            exit 1
          fi
          "${GITHUB_WORKSPACE}/.release-tooling/tools/eas-cli/node_modules/.bin/eas" env:pull \
            --environment "${EAS_ENVIRONMENT}" \
            --path "${RUNNER_TEMP}/calibrate-eas-environment.raw" \
            --non-interactive

      - name: Sanitize source-bound public environment artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/calibrate-eas-environment-artifact"
          node .release-tooling/scripts/expo-ota-artifact.mjs sanitize-environment \
            --input "${RUNNER_TEMP}/calibrate-eas-environment.raw" \
            --output "${RUNNER_TEMP}/calibrate-eas-environment-artifact/environment.json" \
            --source-commit "${OTA_SOURCE_REF}" \
            --channel "${EXPO_UPDATES_CHANNEL}" \
            --environment "${EAS_ENVIRONMENT}" \
            --project-id "${EXPO_PUBLIC_EAS_PROJECT_ID}"
          rm -f "${RUNNER_TEMP}/calibrate-eas-environment.raw"

      - name: Upload production public environment artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: expo-ota-env-production-${{ needs.preflight-release-target.outputs.source_commit }}
          path: ${{ runner.temp }}/calibrate-eas-environment-artifact/environment.json
          if-no-files-found: error
          retention-days: 3
    if: ${{ !cancelled() && inputs.publish_production && needs.preflight-release-target.result == 'success' && needs.preflight-release-target.outputs.production_retained != 'true' && needs.approve-production.result == 'success' }}

  build-production-update:
    name: Build production Android OTA without publisher credentials
    needs: [ preflight-release-target, resolve-production-environment ]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EAS_ENVIRONMENT: production
      EXPO_NO_METRO_WORKSPACE_ROOT: '1'
      EXPO_PUBLIC_EAS_PROJECT_ID: fda8f8c5-e646-47ac-82fb-35003c9cbec7
      EXPO_UPDATES_CHANNEL: production
      NODE_ENV: production
      OTA_SOURCE_REF: ${{ needs.preflight-release-target.outputs.source_commit }}

    steps:
      - name: Require master dispatch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/master" ]]; then
            echo "OTA updates must be dispatched from the master branch; received ${GITHUB_REF}." >&2
            exit 1
          fi

      - name: Checkout exact source without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.preflight-release-target.outputs.source_commit }}

      - name: Require released source
        shell: bash
        run: |
          set -euo pipefail
          export GIT_CONFIG_GLOBAL=/dev/null
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_NO_REPLACE_OBJECTS=1
          if [[ ! "${OTA_SOURCE_REF}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_ref must be a full lowercase Git commit SHA." >&2
            exit 1
          fi
          test "$(git --no-replace-objects rev-parse HEAD)" = "${OTA_SOURCE_REF}"
          git --no-replace-objects fetch --no-tags --force origin '+refs/heads/master:refs/remotes/origin/master'
          if ! git --no-replace-objects merge-base --is-ancestor "${OTA_SOURCE_REF}" origin/master; then
            echo "OTA source ${OTA_SOURCE_REF} is not on master." >&2
            exit 1
          fi

      - name: Checkout reviewed compatibility and artifact tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          path: .release-tooling
          persist-credentials: false
          ref: ${{ job.workflow_sha }}
          sparse-checkout: |
            /scripts/expo-ota-artifact.mjs
            /scripts/expo-ota-publish.mjs
            /scripts/release-record.mjs
            /scripts/expo-runtime.mjs
            /scripts/zip-entry.mjs
            /scripts/native-ota-contract.mjs
            /scripts/native-ota-update.mjs
            /scripts/native-tag-attestation.mjs
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install source dependencies without publisher credentials
        run: npm ci --include=dev --no-audit --fund=false

      - name: Download production public environment artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: expo-ota-env-production-${{ needs.preflight-release-target.outputs.source_commit }}
          path: ${{ runner.temp }}/calibrate-eas-environment-artifact

      - name: Verify and apply production public environment
        shell: bash
        run: >-
          node .release-tooling/scripts/expo-ota-artifact.mjs verify-environment --environment-artifact "${RUNNER_TEMP}/calibrate-eas-environment-artifact/environment.json" --github-env "${GITHUB_ENV}" --source-commit "${OTA_SOURCE_REF}" --channel "${EXPO_UPDATES_CHANNEL}" --environment "${EAS_ENVIRONMENT}" --project-id "${EXPO_PUBLIC_EAS_PROJECT_ID}"

      - name: Export Android update with source-locked Expo CLI
        working-directory: mobile
        shell: bash
        env:
          CI: '1'
        run: |
          set -euo pipefail
          node "${GITHUB_WORKSPACE}/.release-tooling/scripts/expo-runtime.mjs" "${GITHUB_WORKSPACE}" "${RUNNER_TEMP}/calibrate-expo-runtime.json"
          "${GITHUB_WORKSPACE}/node_modules/.bin/expo" config --type public --json > "${RUNNER_TEMP}/calibrate-expo-public-config.json"
          "${GITHUB_WORKSPACE}/node_modules/.bin/expo" export \
            --platform android \
            --output-dir "${RUNNER_TEMP}/calibrate-expo-export" \
            --dump-sourcemap \
            --dump-assetmap

      - name: Package source-bound production OTA artifact
        shell: bash
        run: >-
          node .release-tooling/scripts/expo-ota-artifact.mjs package-update --input-dir "${RUNNER_TEMP}/calibrate-expo-export" --output-dir "${RUNNER_TEMP}/calibrate-expo-update-artifact" --public-config "${RUNNER_TEMP}/calibrate-expo-public-config.json" --runtime-file "${RUNNER_TEMP}/calibrate-expo-runtime.json" --package-lock "${GITHUB_WORKSPACE}/package-lock.json" --environment-artifact "${RUNNER_TEMP}/calibrate-eas-environment-artifact/environment.json" --source-commit "${OTA_SOURCE_REF}" --channel "${EXPO_UPDATES_CHANNEL}" --environment "${EAS_ENVIRONMENT}" --project-id "${EXPO_PUBLIC_EAS_PROJECT_ID}"

      - name: Upload source-bound production OTA artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: expo-ota-android-production-${{ needs.preflight-release-target.outputs.source_commit }}
          path: ${{ runner.temp }}/calibrate-expo-update-artifact
          if-no-files-found: error
          retention-days: 3
    if: ${{ !cancelled() && needs.preflight-release-target.result == 'success' && needs.resolve-production-environment.result == 'success' }}

  publish-production:
    name: Publish pre-exported Android OTA to production
    permissions:
      contents: write
      actions: read
      attestations: read
    needs:
      - preflight-release-target
      - build-production-update
      - retain-production
      - approve-production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Source export finishes before this clean publisher receives the Expo token.
    env:
      EAS_ENVIRONMENT: production
      EXPO_PUBLIC_EAS_PROJECT_ID: fda8f8c5-e646-47ac-82fb-35003c9cbec7
      EXPO_UPDATES_CHANNEL: production
      OTA_MESSAGE: ${{ inputs.message }}
      OTA_SOURCE_REF: ${{ needs.preflight-release-target.outputs.source_commit }}

    steps:
      - name: Require current protected workflow authority before Expo authentication
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.preflight-release-target.outputs.source_commit }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_GLOBAL=/dev/null
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_NO_REPLACE_OBJECTS=1
          if [[ "${GITHUB_REF}" != "refs/heads/master" || ! "${WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "OTA publication requires an exact protected-master workflow commit." >&2
            exit 1
          fi

          VERIFY_ROOT="${RUNNER_TEMP}/calibrate-ota-workflow-authority"
          TOOL_ROOT="${RUNNER_TEMP}/calibrate-ota-authority-tooling"
          if [[ -e "${VERIFY_ROOT}" || -e "${TOOL_ROOT}" ]]; then
            echo "OTA workflow authority directories must not preexist." >&2
            exit 1
          fi
          git init --quiet --template='' "${VERIFY_ROOT}"
          git -C "${VERIFY_ROOT}" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "${VERIFY_ROOT}" --no-replace-objects fetch --force --no-tags origin \
            '+refs/heads/master:refs/remotes/origin/master'
          mkdir -p "${TOOL_ROOT}/scripts"
          git -C "${VERIFY_ROOT}" --no-replace-objects show \
            "${WORKFLOW_SHA}:scripts/release-config.mjs" > "${TOOL_ROOT}/scripts/release-config.mjs"
          git -C "${VERIFY_ROOT}" --no-replace-objects show \
            "${WORKFLOW_SHA}:scripts/native-tag-attestation.mjs" > "${TOOL_ROOT}/scripts/native-tag-attestation.mjs"
          node "${TOOL_ROOT}/scripts/release-config.mjs" verify-current-release-workflow \
            --repository-root "${VERIFY_ROOT}" \
            --workflow-sha "${WORKFLOW_SHA}" \
            --release-commit "${RELEASE_COMMIT}"

      - name: Checkout reviewed OTA publisher tooling only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          path: .release-tooling
          persist-credentials: false
          ref: ${{ job.workflow_sha }}
          sparse-checkout: |-
            /scripts/
            /tools/eas-cli/
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: .release-tooling/tools/eas-cli/package-lock.json

      - name: Install locked EAS CLI before Expo authentication
        run: npm ci --prefix .release-tooling/tools/eas-cli --include=dev --no-audit --fund=false

      - name: Download source-bound production OTA artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: expo-ota-android-production-${{ needs.preflight-release-target.outputs.source_commit }}
          path: ${{ runner.temp }}/calibrate-expo-update-artifact
        if: ${{ inputs.release_record_id == '' }}
      - name: Restore exact retained OTA export
        if: ${{ inputs.release_record_id != '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_record_id }}
        run: |-
          git -C .release-tooling fetch --force --no-tags origin '+refs/heads/master:refs/remotes/origin/master'
          node .release-tooling/scripts/expo-ota-store.mjs restore "${RELEASE_ID}" production "${RUNNER_TEMP}/calibrate-expo-update-artifact" "${GITHUB_WORKSPACE}/.release-tooling"

      - name: Verify inert artifact and prepare fixed publisher project
        shell: bash
        run: >-
          node .release-tooling/scripts/expo-ota-artifact.mjs prepare-publisher --artifact-root "${RUNNER_TEMP}/calibrate-expo-update-artifact" --output-dir "${RUNNER_TEMP}/calibrate-expo-publisher" --source-commit "${OTA_SOURCE_REF}" --channel "${EXPO_UPDATES_CHANNEL}" --environment "${EAS_ENVIRONMENT}" --project-id "${EXPO_PUBLIC_EAS_PROJECT_ID}"

      - name: Recheck current protected workflow authority immediately before Expo token
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.preflight-release-target.outputs.source_commit }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_GLOBAL=/dev/null
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_NO_REPLACE_OBJECTS=1
          node .release-tooling/scripts/release-config.mjs verify-current-release-workflow \
            --repository-root "${RUNNER_TEMP}/calibrate-ota-workflow-authority" \
            --workflow-sha "${WORKFLOW_SHA}" \
            --release-commit "${RELEASE_COMMIT}"

      - name: Publish pre-exported Android update to production
        working-directory: ${{ runner.temp }}/calibrate-expo-publisher
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_RECORD_ID: ${{ inputs.release_record_id }}
        run: >-
          node "${GITHUB_WORKSPACE}/.release-tooling/scripts/expo-ota-publish.mjs" "${RUNNER_TEMP}/calibrate-expo-update-artifact" "${GITHUB_WORKSPACE}/.release-tooling"
    if: ${{ !cancelled() && inputs.publish_production && needs.preflight-release-target.result == 'success' && (needs.preflight-release-target.outputs.production_retained == 'true' || (needs.build-production-update.result == 'success' && (inputs.release_record_id == '' || needs.retain-production.result == 'success'))) && needs.approve-production.result == 'success' }}
  retain-internal:
    name: Retain attested internal OTA export
    needs:
      - preflight-release-target
      - build-internal-update
    if: ${{ !cancelled() && inputs.release_record_id != '' && needs.preflight-release-target.result == 'success' && needs.build-internal-update.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      attestations: write
      id-token: write
    env:
      RELEASE_ID: ${{ inputs.release_record_id }}
      OTA_SOURCE_REF: ${{ needs.preflight-release-target.outputs.source_commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout: scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: expo-ota-android-internal-${{ needs.preflight-release-target.outputs.source_commit }}
          path: ${{ runner.temp }}/ota-export
      - name: Verify current authority and inert export
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |-
          node scripts/release-config.mjs verify-current-release-workflow --repository-root "${GITHUB_WORKSPACE}" --workflow-sha "${WORKFLOW_SHA}" --release-commit "${OTA_SOURCE_REF}"
          node scripts/expo-ota-artifact.mjs verify-update --artifact-root "${RUNNER_TEMP}/ota-export" --source-commit "${OTA_SOURCE_REF}" --channel internal --environment preview --project-id fda8f8c5-e646-47ac-82fb-35003c9cbec7
      - name: Attest exact export file hashes
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
        with:
          subject-path: ${{ runner.temp }}/ota-export/provenance.json
          push-to-registry: false
          create-storage-record: false
      - name: Retain export without Expo credentials
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/expo-ota-store.mjs retain "${RELEASE_ID}" internal "${RUNNER_TEMP}/ota-export" "${GITHUB_WORKSPACE}"
  retain-production:
    name: Retain attested production OTA export
    needs:
      - preflight-release-target
      - build-production-update
    if: ${{ !cancelled() && inputs.release_record_id != '' && needs.preflight-release-target.result == 'success' && needs.build-production-update.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      attestations: write
      id-token: write
    env:
      RELEASE_ID: ${{ inputs.release_record_id }}
      OTA_SOURCE_REF: ${{ needs.preflight-release-target.outputs.source_commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout: scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: expo-ota-android-production-${{ needs.preflight-release-target.outputs.source_commit }}
          path: ${{ runner.temp }}/ota-export
      - name: Verify current authority and inert export
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |-
          node scripts/release-config.mjs verify-current-release-workflow --repository-root "${GITHUB_WORKSPACE}" --workflow-sha "${WORKFLOW_SHA}" --release-commit "${OTA_SOURCE_REF}"
          node scripts/expo-ota-artifact.mjs verify-update --artifact-root "${RUNNER_TEMP}/ota-export" --source-commit "${OTA_SOURCE_REF}" --channel production --environment production --project-id fda8f8c5-e646-47ac-82fb-35003c9cbec7
      - name: Attest exact export file hashes
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
        with:
          subject-path: ${{ runner.temp }}/ota-export/provenance.json
          push-to-registry: false
          create-storage-record: false
      - name: Retain export without Expo credentials
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/expo-ota-store.mjs retain "${RELEASE_ID}" production "${RUNNER_TEMP}/ota-export" "${GITHUB_WORKSPACE}"
