name: Release server

run-name: Server ${{ inputs.operation }} ${{ inputs.release_tag }} from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: New release (patch/minor/major), resume prepared release, or recover image only
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - resume
          - image-only
      release_commit:
        description: Recovery only - exact full prepared release commit from the original run
        required: false
        default: ''
        type: string
      release_tag:
        description: Recovery only - exact vMAJOR.MINOR.PATCH from the original run
        required: false
        default: ''
        type: string
      publish_latest:
        description: Image-only recovery - also move latest (resume always restores latest and downstream stages)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  request:
    name: Submit read-only server release request
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require protected master
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/master" ]]; then
            echo "Server release requests must run from protected master; received ${GITHUB_REF}." >&2
            exit 1
          fi

      - name: Create bound request artifact
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          PUBLISH_LATEST: ${{ inputs.publish_latest }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          REQUEST_RUN_ATTEMPT: ${{ github.run_attempt }}
          REQUEST_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ "${PUBLISH_LATEST}" =~ ^(true|false)$ ]]
          case "${OPERATION}" in
            patch|minor|major)
              if [[ -n "${RELEASE_COMMIT}" || -n "${RELEASE_TAG}" || "${PUBLISH_LATEST}" != "false" ]]; then
                echo "New releases need only an operation. Leave recovery fields empty and publish_latest unchecked." >&2
                exit 1
              fi
              ;;
            resume|image-only)
              [[ "${RELEASE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
              [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
              if [[ "${OPERATION}" == "resume" && "${PUBLISH_LATEST}" != "false" ]]; then
                echo "publish_latest is only for image-only recovery; resume already restores the current release." >&2
                exit 1
              fi
              ;;
            *) echo "Unsupported server release operation." >&2; exit 1 ;;
          esac
          mkdir -p "${RUNNER_TEMP}/calibrate-release-request"
          jq -n \
            --arg head_branch "${GITHUB_REF_NAME}" \
            --arg head_sha "${GITHUB_SHA}" \
            --arg operation server-release \
            --arg selection "${OPERATION}" \
            --argjson publish_latest "${PUBLISH_LATEST}" \
            --arg release_commit "${RELEASE_COMMIT}" \
            --arg release_tag "${RELEASE_TAG}" \
            --arg repository "${REPOSITORY}" \
            --arg repository_id "${REPOSITORY_ID}" \
            --arg request_run_attempt "${REQUEST_RUN_ATTEMPT}" \
            --arg request_run_id "${REQUEST_RUN_ID}" \
            '{schema_version:1, operation:$operation, repository:$repository, repository_id:$repository_id, request_run_id:$request_run_id, request_run_attempt:$request_run_attempt, head_branch:$head_branch, head_sha:$head_sha, inputs:{operation:$selection, publish_latest:$publish_latest, release_commit:$release_commit, release_tag:$release_tag}}' \
            > "${RUNNER_TEMP}/calibrate-release-request/request.json"

      - name: Upload fixed server release request
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: server-release-request
          path: ${{ runner.temp }}/calibrate-release-request/request.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

      - name: Link publication progress
        shell: bash
        run: |
          {
            echo "## Server release requested"
            echo "This run recorded the request; it has not published a release."
            echo "Follow [Handle server release request](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/cut-release-handler.yml) for validation and publication."
          } >> "${GITHUB_STEP_SUMMARY}"
