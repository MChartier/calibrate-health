name: Cut release

run-name: Request ${{ inputs.bump }} release from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version component to increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

jobs:
  request:
    name: Submit read-only cut request
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require protected master
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/master" ]]; then
            echo "Cut release requests must run from protected master; received ${GITHUB_REF}." >&2
            exit 1
          fi

      - name: Create bound request artifact
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          REQUEST_RUN_ATTEMPT: ${{ github.run_attempt }}
          REQUEST_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ ! "${BUMP}" =~ ^(patch|minor|major)$ ]]; then
            echo "bump must be patch, minor, or major." >&2
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/calibrate-release-request"
          jq -n \
            --arg bump "${BUMP}" \
            --arg head_branch "${GITHUB_REF_NAME}" \
            --arg head_sha "${GITHUB_SHA}" \
            --arg operation cut-release \
            --arg repository "${REPOSITORY}" \
            --arg repository_id "${REPOSITORY_ID}" \
            --arg request_run_attempt "${REQUEST_RUN_ATTEMPT}" \
            --arg request_run_id "${REQUEST_RUN_ID}" \
            '{schema_version:1, operation:$operation, repository:$repository, repository_id:$repository_id, request_run_id:$request_run_id, request_run_attempt:$request_run_attempt, head_branch:$head_branch, head_sha:$head_sha, inputs:{bump:$bump}}' \
            > "${RUNNER_TEMP}/calibrate-release-request/request.json"

      - name: Upload fixed cut request
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cut-release-request
          path: ${{ runner.temp }}/calibrate-release-request/request.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7
