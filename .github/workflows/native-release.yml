        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ runner.temp }}/native-play-receipt.json
          push-to-registry: false
          create-storage-record: false

  publish-internal:
    name: Upload paired build to Play internal
    needs: [validate-source, build-internal, attest-play-receipt]
    if: inputs.operation == 'upload-internal'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: play-internal
    permissions:
      actions: read
      attestations: read
      contents: read
    env:
      ATTESTED_RECEIPT_SHA256: ${{ needs.attest-play-receipt.outputs.receipt_sha256 }}
      NATIVE_TAG: ${{ needs.validate-source.outputs.native_tag }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}

    steps:
      - name: Require current protected master workflow authority
        shell: bash
        env:
          READ_ONLY_GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          if [[ ! "${WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The workflow revision must be an exact full Git SHA." >&2
            exit 1
          fi
          LIVE_MASTER_SHA="$(
            curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
              --header 'Accept: application/vnd.github+json' \
              --header 'Cache-Control: no-cache' \
              --header "Authorization: Bearer ${READ_ONLY_GITHUB_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/master" |
              jq --exit-status --raw-output \
                'select(.ref == "refs/heads/master") | .object.sha | select(type == "string" and test("^[0-9a-f]{40}$"))'
          )"
          if [[ "${WORKFLOW_SHA}" != "${LIVE_MASTER_SHA}" ]]; then
            echo "This job's workflow revision ${WORKFLOW_SHA} is stale; current protected master is ${LIVE_MASTER_SHA}. Start a new run from current master." >&2
            exit 1
          fi

      - name: Checkout exact reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.source_commit }}

      - name: Checkout reviewed Publisher tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
          path: .release-tooling

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0

      - name: Setup Java for artifact inspection
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK for artifact inspection
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          cmdline-tools-version: 15859902

      - name: Provision pinned artifact inspection tools
        shell: bash
        run: |
          set -euo pipefail
          test -x "$ANDROID_HOME/cmdline-tools/15859902/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/15859902/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/15859902/bin/sdkmanager" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" platform-tools >/dev/null
          BUNDLETOOL_JAR="${RUNNER_TEMP}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          curl --fail --location --retry 3 \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar" \
            --output "${BUNDLETOOL_JAR}"
          echo "${BUNDLETOOL_SHA256}  ${BUNDLETOOL_JAR}" | sha256sum --check
          echo "BUNDLETOOL_JAR=${BUNDLETOOL_JAR}" >> "${GITHUB_ENV}"

      - name: Download exact paired native release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: native-play-release-${{ inputs.source_commit }}
          path: .

      - name: Reconstruct and reverify exact downloaded receipt
        shell: bash
        run: |
          set -euo pipefail
          node .release-tooling/scripts/native-play-release.mjs create-receipt \
            --repository-root "${GITHUB_WORKSPACE}" \
            --repository "${GITHUB_REPOSITORY}" \
            --source-commit "${SOURCE_COMMIT}" \
            --receipt-file build/native-play-receipt.json
          RECEIPT_SHA256="$(sha256sum build/native-play-receipt.json | awk '{print $1}')"
          if [[ ! "${ATTESTED_RECEIPT_SHA256}" =~ ^[0-9a-f]{64}$ || \
                "${RECEIPT_SHA256}" != "${ATTESTED_RECEIPT_SHA256}" ]]; then
            echo "Downloaded artifact receipt ${RECEIPT_SHA256} does not match independently attested receipt ${ATTESTED_RECEIPT_SHA256}." >&2
            exit 1
          fi

      - name: Install checksum-verified GitHub CLI attestation verifier
        id: gh_cli
        shell: bash
        env:
          GH_CLI_SHA256: a2c9b8497e1f85b1ad0dfcb78b5a622e098801b8e461e459e88e1ee12f018112
          GH_CLI_URL: https://github.com/cli/cli/releases/download/v2.97.0/gh_2.97.0_linux_amd64.tar.gz
        run: |
          set -euo pipefail
          GH_CLI_ARCHIVE="${RUNNER_TEMP}/gh_2.97.0_linux_amd64.tar.gz"
          GH_CLI_ROOT="${RUNNER_TEMP}/gh-cli"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "${GH_CLI_ARCHIVE}" "${GH_CLI_URL}"
          echo "${GH_CLI_SHA256}  ${GH_CLI_ARCHIVE}" | sha256sum --check --strict
          mkdir -p "${GH_CLI_ROOT}"
          tar --extract --gzip --file "${GH_CLI_ARCHIVE}" \
            --directory "${GH_CLI_ROOT}" --strip-components=2 \
            gh_2.97.0_linux_amd64/bin/gh
          GH_CLI="${GH_CLI_ROOT}/gh"
          chmod 0755 "${GH_CLI}"
          "${GH_CLI}" version
          echo "path=${GH_CLI}" >> "${GITHUB_OUTPUT}"

      - name: Verify exact native Play receipt attestation before authentication
        shell: bash
        env:
          GH_CLI: ${{ steps.gh_cli.outputs.path }}
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          RECEIPT_FILE="${GITHUB_WORKSPACE}/build/native-play-receipt.json"
          VERIFICATION_FILE="${RUNNER_TEMP}/native-play-attestation-verification.json"
          node .release-tooling/scripts/native-play-receipt.mjs trusted-workflows \
            --trust-file .github/native-play-attestation-trusted-workflow-shas \
            --current-workflow-revision "${WORKFLOW_SHA}" > /dev/null
          "${GH_CLI}" attestation verify "${RECEIPT_FILE}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/native-release.yml" \
            --signer-digest "${SOURCE_COMMIT}" \
            --source-digest "${SOURCE_COMMIT}" \
            --source-ref refs/heads/master \
            --predicate-type https://slsa.dev/provenance/v1 \
            --limit 100 \
            --deny-self-hosted-runners \
            --format json > "${VERIFICATION_FILE}"
          node .release-tooling/scripts/native-play-receipt.mjs discover-workflows \
            --repository "${GITHUB_REPOSITORY}" \
            --source-commit "${SOURCE_COMMIT}" \
            --verification-file "${VERIFICATION_FILE}" > /dev/null

      - name: Recheck current protected master immediately before credentials
        shell: bash
        env:
          READ_ONLY_GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          LIVE_MASTER_SHA="$(
            curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
              --header 'Accept: application/vnd.github+json' \
              --header 'Cache-Control: no-cache' \
              --header "Authorization: Bearer ${READ_ONLY_GITHUB_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/master" |
              jq --exit-status --raw-output \
                'select(.ref == "refs/heads/master") | .object.sha | select(type == "string" and test("^[0-9a-f]{40}$"))'
          )"
          if [[ "${SOURCE_COMMIT}" != "${WORKFLOW_SHA}" || "${WORKFLOW_SHA}" != "${LIVE_MASTER_SHA}" ]]; then
            echo "Master advanced before credentials were admitted; start a new run from current protected master ${LIVE_MASTER_SHA}." >&2
            exit 1
          fi

      - name: Require Google Play authentication
        shell: bash
        env:
          ACCESS_TOKEN: ${{ secrets.GOOGLE_PLAY_TEST_ACCESS_TOKEN }}
          SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_TEST_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -n "${SERVICE_ACCOUNT_JSON_BASE64}" ]]; then
            SERVICE_ACCOUNT_FILE="${RUNNER_TEMP}/google-play-service-account.json"
            printf '%s' "${SERVICE_ACCOUNT_JSON_BASE64}" | base64 --decode > "${SERVICE_ACCOUNT_FILE}"
            chmod 600 "${SERVICE_ACCOUNT_FILE}"
            test -s "${SERVICE_ACCOUNT_FILE}"
            echo "GOOGLE_PLAY_SERVICE_ACCOUNT_FILE=${SERVICE_ACCOUNT_FILE}" >> "${GITHUB_ENV}"
            exit 0
          fi
          if [[ -n "${ACCESS_TOKEN}" ]]; then
            echo "GOOGLE_PLAY_ACCESS_TOKEN=${ACCESS_TOKEN}" >> "${GITHUB_ENV}"
            exit 0
          fi
          echo "Configure GOOGLE_PLAY_TEST_SERVICE_ACCOUNT_JSON_BASE64 or GOOGLE_PLAY_TEST_ACCESS_TOKEN in play-internal." >&2
          exit 1

      - name: Upload phone and Wear bundles to their Play internal tracks
        shell: bash
        run: |
          set -euo pipefail
          auth_args=()
          if [[ -n "${GOOGLE_PLAY_SERVICE_ACCOUNT_FILE:-}" ]]; then
            auth_args+=(--service-account-file "${GOOGLE_PLAY_SERVICE_ACCOUNT_FILE}")
          fi
          node .release-tooling/scripts/native-play-release.mjs upload-internal \
            --repository-root "${GITHUB_WORKSPACE}" \
            --repository "${GITHUB_REPOSITORY}" \
            --source-commit "${SOURCE_COMMIT}" \
            --receipt-file build/native-play-receipt.json \
            "${auth_args[@]}"

      - name: Remove Google Play credentials
        if: always()
        shell: bash
        run: |
          rm -f "${GOOGLE_PLAY_SERVICE_ACCOUNT_FILE:-}" "${RUNNER_TEMP}/google-play-service-account.json"
          {
            echo 'GOOGLE_PLAY_ACCESS_TOKEN='
            echo 'GOOGLE_PLAY_SERVICE_ACCOUNT_FILE='
          } >> "${GITHUB_ENV}"

