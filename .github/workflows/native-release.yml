            --repository-root "${GITHUB_WORKSPACE}" \
            --tag "${NATIVE_TAG}" \
            --expected-commit "${SOURCE_COMMIT}" \
            --allowed-signers-file .release-trust/.github/native-release-tag-allowed-signers

          REMOTE_TAG="$(git ls-remote --tags --refs origin "refs/tags/${NATIVE_TAG}")"
          if [[ -z "${REMOTE_TAG}" ]]; then
            if ! git push origin "refs/tags/${NATIVE_TAG}:refs/tags/${NATIVE_TAG}"; then
              echo "Initial tag push lost a race; verifying the exact remote attestation." >&2
            fi
          elif [[ "${REMOTE_TAG}" == *$'\n'* ]]; then
            echo "Origin returned more than one exact ref for ${NATIVE_TAG}." >&2
            exit 1
          fi

          git fetch --force origin "+refs/tags/${NATIVE_TAG}:refs/tags/${NATIVE_TAG}"
          node .release-tooling/scripts/native-tag-attestation.mjs verify \
            --repository-root "${GITHUB_WORKSPACE}" \
            --tag "${NATIVE_TAG}" \
            --expected-commit "${SOURCE_COMMIT}" \
            --allowed-signers-file .release-trust/.github/native-release-tag-allowed-signers

