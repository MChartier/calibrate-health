      - name: Checkout exact Play-accepted source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ inputs.source_commit }}
          token: ${{ steps.tag-token.outputs.token }}

      - name: Checkout reviewed release safety tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
          path: .release-tooling

      - name: Checkout current native tag trust set
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: master
          fetch-depth: 1
          persist-credentials: false
          path: .release-trust

      - name: Bind current native tag trust set
