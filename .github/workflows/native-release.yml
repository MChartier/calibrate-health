name: Native Android Store Release

run-name: Native ${{ inputs.operation }} from ${{ inputs.source_commit }}

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact 40-character commit on master whose signed phone and Wear release is being published
        required: true
        type: string
      operation:
        description: Upload one paired build, promote it to closed testing, or promote the closed pair to production
        required: true
        default: upload-internal
        type: choice
        options:
          - upload-internal
          - recover-internal
          - promote-closed
          - promote-production
      confirm_play_console_clean:
        description: I verified Play has no unrelated changes ready to send and will pause Console/API edits for this run
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  ANDROID_BUILD_TOOLS_VERSION: '36.0.0'
  BUNDLETOOL_VERSION: '1.18.3'
  BUNDLETOOL_SHA256: a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29

concurrency:
  group: native-android-store-release
  queue: max
  cancel-in-progress: false

jobs:
  validate-source:
    name: Validate exact native release source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      native_tag: ${{ steps.source.outputs.native_tag }}
      native_version: ${{ steps.source.outputs.native_version }}
      phone_version_code: ${{ steps.source.outputs.phone_version_code }}
      watch_version_code: ${{ steps.source.outputs.watch_version_code }}

    steps:
      - name: Require master and an exact source commit
        shell: bash
        env:
          CONFIRM_PLAY_CONSOLE_CLEAN: ${{ inputs.confirm_play_console_clean }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/master" ]]; then
            echo "Run Native Android Store Release from master; current ref is ${GITHUB_REF}." >&2
            exit 1
          fi
          if [[ ! "${SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_commit must be an exact lowercase 40-character Git SHA." >&2
            exit 1
          fi
          if [[ "${CONFIRM_PLAY_CONSOLE_CLEAN}" != "true" ]]; then
            echo "Confirm Play Publishing overview is clear and pause Console/Publisher edits for the entire run." >&2
            exit 1
          fi

      - name: Checkout exact reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.source_commit }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0

      - name: Checkout reviewed release safety tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
          path: .release-tooling

      - name: Checkout current native tag trust set
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: master
          fetch-depth: 1
          persist-credentials: false
          path: .release-trust

      - name: Bind current native tag trust set
        id: native-trust
        shell: bash
        run: |
          set -euo pipefail
          TRUST_SET_COMMIT="$(git --no-replace-objects -C .release-trust rev-parse HEAD)"
          [[ "${TRUST_SET_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          test -s .release-trust/.github/native-release-tag-allowed-signers
          echo "commit=${TRUST_SET_COMMIT}" >> "${GITHUB_OUTPUT}"
          printf 'Native tag trust set: `%s` from current `master`.\n' "${TRUST_SET_COMMIT}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Bind source and native tag
        id: source
        shell: bash
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_COMMIT}"
          git fetch origin master --tags
          if ! git merge-base --is-ancestor "${SOURCE_COMMIT}" origin/master; then
            echo "Native release source ${SOURCE_COMMIT} is not on master." >&2
            exit 1
          fi

          PHONE_VERSION="$(node -p "require('./shared/release.json').android.mobile.version_name")"
          WEAR_VERSION="$(node -p "require('./shared/release.json').android.wear.version_name")"
          PHONE_VERSION_CODE="$(node -p "require('./shared/release.json').android.mobile.version_code")"
          WEAR_VERSION_CODE="$(node -p "require('./shared/release.json').android.wear.version_code")"
          NATIVE_TAG="$(node -p "require('./shared/release.json').android.mobile.native_release_tag")"
          EXPECTED_TAG="native-v${PHONE_VERSION}"
          if [[ "${PHONE_VERSION}" != "${WEAR_VERSION}" ]]; then
            echo "Paired Play releases require matching phone and Wear version names." >&2
            exit 1
          fi
          if [[ "${NATIVE_TAG}" != "${EXPECTED_TAG}" ]]; then
            echo "Native release tag ${NATIVE_TAG} must be ${EXPECTED_TAG}." >&2
            exit 1
          fi
          if git show-ref --tags --verify --quiet "refs/tags/${NATIVE_TAG}" && \
             [[ "$(git rev-parse "${NATIVE_TAG}^{commit}")" != "${SOURCE_COMMIT}" ]]; then
            echo "Native release tag ${NATIVE_TAG} already points at another commit." >&2
            exit 1
          fi
          echo "native_tag=${NATIVE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "native_version=${PHONE_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "phone_version_code=${PHONE_VERSION_CODE}" >> "${GITHUB_OUTPUT}"
          echo "watch_version_code=${WEAR_VERSION_CODE}" >> "${GITHUB_OUTPUT}"

      - name: Reject an existing tag without the reviewed attestation
        shell: bash
        env:
          NATIVE_TAG: ${{ steps.source.outputs.native_tag }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          REMOTE_TAG="$(git ls-remote --tags --refs origin "refs/tags/${NATIVE_TAG}")"
          if [[ -z "${REMOTE_TAG}" ]]; then
            exit 0
          fi
          if [[ "${REMOTE_TAG}" == *$'\n'* ]]; then
            echo "Origin returned more than one exact ref for ${NATIVE_TAG}." >&2
            exit 1
          fi
          read -r REMOTE_OBJECT REMOTE_REF <<< "${REMOTE_TAG}"
          if [[ ! "${REMOTE_OBJECT}" =~ ^[0-9a-f]{40}$ || "${REMOTE_REF}" != "refs/tags/${NATIVE_TAG}" ]]; then
            echo "Origin returned a malformed exact ref for ${NATIVE_TAG}." >&2
            exit 1
          fi
          git fetch --force origin "+refs/tags/${NATIVE_TAG}:refs/tags/${NATIVE_TAG}"
          node .release-tooling/scripts/native-tag-attestation.mjs verify \
            --repository-root "${GITHUB_WORKSPACE}" \
            --tag "${NATIVE_TAG}" \
            --expected-commit "${SOURCE_COMMIT}" \
            --allowed-signers-file .release-trust/.github/native-release-tag-allowed-signers

      - name: Verify protected native tag policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NATIVE_TAG: ${{ steps.source.outputs.native_tag }}
        run: >-
          node .release-tooling/scripts/native-tag-protection.mjs verify
          --repository "${GITHUB_REPOSITORY}"
          --tag "${NATIVE_TAG}"

      - name: Validate upload dependency and release policy
        if: inputs.operation == 'upload-internal'
        run: npm run release:check

      - name: Validate immutable recovery or promotion configuration
        if: inputs.operation != 'upload-internal'
        run: >-
          node .release-tooling/scripts/release-config.mjs check
          --repository-root "${GITHUB_WORKSPACE}"

      - name: Validate Play release plan
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: >-
          node .release-tooling/scripts/native-play-release.mjs plan
          --repository-root "${GITHUB_WORKSPACE}"
          --source-commit "${SOURCE_COMMIT}"

  build-internal:
    name: Build paired production-channel artifacts
    needs: validate-source
    if: inputs.operation == 'upload-internal'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: native-release-signing
    permissions:
      contents: read
    outputs:
      phone_aab_sha256: ${{ steps.artifact-hashes.outputs.phone_aab_sha256 }}
      watch_aab_sha256: ${{ steps.artifact-hashes.outputs.watch_aab_sha256 }}
    env:
      EXPO_NO_METRO_WORKSPACE_ROOT: '1'
      EXPO_PUBLIC_CALIBRATE_SERVER_URL: https://calibratehealth.app
      EXPO_PUBLIC_EAS_PROJECT_ID: fda8f8c5-e646-47ac-82fb-35003c9cbec7
      EXPO_UPDATES_CHANNEL: production
      NODE_ENV: production
      SOURCE_COMMIT: ${{ inputs.source_commit }}

    steps:
      - name: Require current protected master workflow authority
        shell: bash
        env:
          READ_ONLY_GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          if [[ ! "${WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The workflow revision must be an exact full Git SHA." >&2
            exit 1
          fi
          LIVE_MASTER_SHA="$(
            curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
              --header 'Accept: application/vnd.github+json' \
              --header 'Cache-Control: no-cache' \
              --header "Authorization: Bearer ${READ_ONLY_GITHUB_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/master" |
              jq --exit-status --raw-output \
                'select(.ref == "refs/heads/master") | .object.sha | select(type == "string" and test("^[0-9a-f]{40}$"))'
          )"
          if [[ "${WORKFLOW_SHA}" != "${LIVE_MASTER_SHA}" ]]; then
            echo "This job's workflow revision ${WORKFLOW_SHA} is stale; current protected master is ${LIVE_MASTER_SHA}. Start a new run from current master." >&2
            exit 1
          fi
          if [[ ! "${SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ || "${SOURCE_COMMIT}" != "${LIVE_MASTER_SHA}" ]]; then
            echo "upload-internal may build only the current protected master commit ${LIVE_MASTER_SHA}; received ${SOURCE_COMMIT}." >&2
            exit 1
          fi

      - name: Checkout exact reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.source_commit }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          cmdline-tools-version: 15859902

      - name: Activate reviewed Android command-line tools
        shell: bash
        run: |
          set -euo pipefail
          test -x "$ANDROID_HOME/cmdline-tools/15859902/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/15859902/bin" >> "$GITHUB_PATH"

      - name: Provision pinned artifact inspection tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" platform-tools >/dev/null
          BUNDLETOOL_JAR="${RUNNER_TEMP}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          curl --fail --location --retry 3 \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar" \
            --output "${BUNDLETOOL_JAR}"
          echo "${BUNDLETOOL_SHA256}  ${BUNDLETOOL_JAR}" | sha256sum --check
          echo "BUNDLETOOL_JAR=${BUNDLETOOL_JAR}" >> "${GITHUB_ENV}"

      - name: Install native release dependencies
        run: npm ci --no-audit --fund=false

      - name: Generate and verify credential-free native Gradle state
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "${RUNNER_TEMP}/calibrate-android-upload.keystore"
          node scripts/native-release-build.mjs prepare

      - name: Recheck current protected master immediately before credentials
        shell: bash
        env:
          READ_ONLY_GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          LIVE_MASTER_SHA="$(
            curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
              --header 'Accept: application/vnd.github+json' \
              --header 'Cache-Control: no-cache' \
              --header "Authorization: Bearer ${READ_ONLY_GITHUB_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/master" |
              jq --exit-status --raw-output \
                'select(.ref == "refs/heads/master") | .object.sha | select(type == "string" and test("^[0-9a-f]{40}$"))'
          )"
          if [[ "${WORKFLOW_SHA}" != "${LIVE_MASTER_SHA}" || "${SOURCE_COMMIT}" != "${LIVE_MASTER_SHA}" ]]; then
            echo "Master advanced before Android signing credentials were admitted; start upload-internal from current protected master ${LIVE_MASTER_SHA}." >&2
            exit 1
          fi

      - name: Require native signing configuration
        shell: bash
        env:
          KEY_ALIAS: ${{ secrets.CALIBRATE_ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CALIBRATE_ANDROID_SIGNING_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.CALIBRATE_ANDROID_SIGNING_STORE_PASSWORD }}
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.CALIBRATE_ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${UPLOAD_KEYSTORE_BASE64}" ]] || missing+=(CALIBRATE_ANDROID_UPLOAD_KEYSTORE_BASE64)
          [[ -n "${STORE_PASSWORD}" ]] || missing+=(CALIBRATE_ANDROID_SIGNING_STORE_PASSWORD)
          [[ -n "${KEY_ALIAS}" ]] || missing+=(CALIBRATE_ANDROID_SIGNING_KEY_ALIAS)
          [[ -n "${KEY_PASSWORD}" ]] || missing+=(CALIBRATE_ANDROID_SIGNING_KEY_PASSWORD)
          if (( ${#missing[@]} > 0 )); then
            printf 'Configure these native-release-signing environment secrets before building: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Materialize shared Android upload signing
        shell: bash
        env:
          KEY_ALIAS: ${{ secrets.CALIBRATE_ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CALIBRATE_ANDROID_SIGNING_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.CALIBRATE_ANDROID_SIGNING_STORE_PASSWORD }}
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.CALIBRATE_ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          STORE_FILE="${RUNNER_TEMP}/calibrate-android-upload.keystore"
          printf '%s' "${UPLOAD_KEYSTORE_BASE64}" | base64 --decode > "${STORE_FILE}"
          chmod 600 "${STORE_FILE}"
          test -s "${STORE_FILE}"
          {
            echo "CALIBRATE_ANDROID_SIGNING_STORE_FILE=${STORE_FILE}"
            echo "CALIBRATE_ANDROID_SIGNING_STORE_PASSWORD=${STORE_PASSWORD}"
            echo "CALIBRATE_ANDROID_SIGNING_KEY_ALIAS=${KEY_ALIAS}"
            echo "CALIBRATE_ANDROID_SIGNING_KEY_PASSWORD=${KEY_PASSWORD}"
          } >> "${GITHUB_ENV}"

      - name: Build signed phone and Wear APKs and AABs once
        run: node scripts/native-release-build.mjs build-prepared

      - name: Remove signing material before artifact verification
        if: always()
        shell: bash
        run: |
          rm -f "${RUNNER_TEMP}/calibrate-android-upload.keystore"
          {
            echo 'CALIBRATE_ANDROID_SIGNING_STORE_FILE='
            echo 'CALIBRATE_ANDROID_SIGNING_STORE_PASSWORD='
            echo 'CALIBRATE_ANDROID_SIGNING_KEY_ALIAS='
            echo 'CALIBRATE_ANDROID_SIGNING_KEY_PASSWORD='
          } >> "${GITHUB_ENV}"

      - name: Verify exact paired artifacts and bind AAB hashes
        id: artifact-hashes
        shell: bash
        run: |
          set -euo pipefail
          VERIFICATION_FILE="${RUNNER_TEMP}/native-play-artifact-verification.json"
          node scripts/native-play-release.mjs verify-artifacts \
            --source-commit "${SOURCE_COMMIT}" > "${VERIFICATION_FILE}"
          PHONE_AAB_SHA256="$(jq --exit-status --raw-output \
            '.artifacts | map(select(.id == "phone-aab")) | select(length == 1) | .[0].sha256 | select(test("^[0-9a-f]{64}$"))' \
            "${VERIFICATION_FILE}")"
          WATCH_AAB_SHA256="$(jq --exit-status --raw-output \
            '.artifacts | map(select(.id == "watch-aab")) | select(length == 1) | .[0].sha256 | select(test("^[0-9a-f]{64}$"))' \
            "${VERIFICATION_FILE}")"
          echo "phone_aab_sha256=${PHONE_AAB_SHA256}" >> "${GITHUB_OUTPUT}"
          echo "watch_aab_sha256=${WATCH_AAB_SHA256}" >> "${GITHUB_OUTPUT}"

      - name: Upload short-lived paired native release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-play-release-${{ inputs.source_commit }}
          path: |
            mobile/android/app/build/outputs/apk/release/app-release.apk
            mobile/android/app/build/outputs/bundle/release/app-release.aab
            wear/app/build/outputs/apk/release/app-release.apk
            wear/app/build/outputs/bundle/release/app-release.aab
            build/native-release-provenance.json
          if-no-files-found: error
          overwrite: true
          retention-days: 3

  attest-play-receipt:
    name: Attest source-free native Play artifact receipt
    needs: [validate-source, build-internal]
    if: inputs.operation == 'upload-internal'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    outputs:
      receipt_sha256: ${{ steps.receipt.outputs.receipt_sha256 }}
    env:
      NATIVE_TAG: ${{ needs.validate-source.outputs.native_tag }}
      NATIVE_VERSION: ${{ needs.validate-source.outputs.native_version }}
      PHONE_AAB_SHA256: ${{ needs.build-internal.outputs.phone_aab_sha256 }}
      PHONE_VERSION_CODE: ${{ needs.validate-source.outputs.phone_version_code }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      WATCH_AAB_SHA256: ${{ needs.build-internal.outputs.watch_aab_sha256 }}
      WATCH_VERSION_CODE: ${{ needs.validate-source.outputs.watch_version_code }}

    steps:
      - name: Require current protected workflow authority before receipt construction
        shell: bash
        env:
          READ_ONLY_GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          LIVE_MASTER_SHA="$(
            curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
              --header 'Accept: application/vnd.github+json' \
              --header 'Cache-Control: no-cache' \
              --header "Authorization: Bearer ${READ_ONLY_GITHUB_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/master" |
              jq --exit-status --raw-output \
                'select(.ref == "refs/heads/master") | .object.sha | select(type == "string" and test("^[0-9a-f]{40}$"))'
          )"
          if [[ "${SOURCE_COMMIT}" != "${WORKFLOW_SHA}" || "${WORKFLOW_SHA}" != "${LIVE_MASTER_SHA}" ]]; then
            echo "Native Play receipt attestation requires source ${SOURCE_COMMIT}, workflow ${WORKFLOW_SHA}, and protected master ${LIVE_MASTER_SHA} to be identical." >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0

      - name: Fetch exact reviewed receipt helper without a source checkout
        shell: bash
        env:
          READ_ONLY_GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          TOOL_ROOT="${RUNNER_TEMP}/native-play-receipt-tool"
          mkdir -p "${TOOL_ROOT}/scripts"
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
            --header 'Accept: application/vnd.github+json' \
            --header 'Cache-Control: no-cache' \
            --header "Authorization: Bearer ${READ_ONLY_GITHUB_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/contents/scripts/native-play-receipt.mjs?ref=${WORKFLOW_SHA}" |
            jq --exit-status --raw-output \
              'select(.type == "file" and .encoding == "base64") | .content' |
            tr -d '\n' | base64 --decode > "${TOOL_ROOT}/scripts/native-play-receipt.mjs"
          test -s "${TOOL_ROOT}/scripts/native-play-receipt.mjs"
          echo "NATIVE_PLAY_RECEIPT_TOOL=${TOOL_ROOT}/scripts/native-play-receipt.mjs" >> "${GITHUB_ENV}"

      - name: Download exact paired native release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: native-play-release-${{ inputs.source_commit }}
          path: ${{ runner.temp }}/native-play-artifacts

      - name: Construct and verify canonical receipt from downloaded AABs
        id: receipt
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_ROOT="${RUNNER_TEMP}/native-play-artifacts"
          PHONE_AAB="${ARTIFACT_ROOT}/mobile/android/app/build/outputs/bundle/release/app-release.aab"
          WATCH_AAB="${ARTIFACT_ROOT}/wear/app/build/outputs/bundle/release/app-release.aab"
          RECEIPT_FILE="${RUNNER_TEMP}/native-play-receipt.json"
          echo "${PHONE_AAB_SHA256}  ${PHONE_AAB}" | sha256sum --check
          echo "${WATCH_AAB_SHA256}  ${WATCH_AAB}" | sha256sum --check
          node "${NATIVE_PLAY_RECEIPT_TOOL}" create \
            --repository "${GITHUB_REPOSITORY}" \
            --application-id app.calibratehealth.mobile \
            --source-commit "${SOURCE_COMMIT}" \
            --native-tag "${NATIVE_TAG}" \
            --native-version "${NATIVE_VERSION}" \
            --phone-track qa \
            --phone-version-code "${PHONE_VERSION_CODE}" \
            --phone-aab-sha256 "${PHONE_AAB_SHA256}" \
            --watch-track wear:qa \
            --watch-version-code "${WATCH_VERSION_CODE}" \
            --watch-aab-sha256 "${WATCH_AAB_SHA256}" > "${RECEIPT_FILE}"
          RECEIPT_SHA256="$(sha256sum "${RECEIPT_FILE}" | awk '{print $1}')"
          [[ "${RECEIPT_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          node "${NATIVE_PLAY_RECEIPT_TOOL}" verify-files \
            --receipt-file "${RECEIPT_FILE}" \
            --expected-receipt-sha256 "${RECEIPT_SHA256}" \
            --phone-aab "${PHONE_AAB}" \
            --watch-aab "${WATCH_AAB}"
          echo "receipt_sha256=${RECEIPT_SHA256}" >> "${GITHUB_OUTPUT}"

      - name: Recheck current protected workflow authority immediately before attestation
        shell: bash
        env:
          READ_ONLY_GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          LIVE_MASTER_SHA="$(
            curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
              --header 'Accept: application/vnd.github+json' \
              --header 'Cache-Control: no-cache' \
              --header "Authorization: Bearer ${READ_ONLY_GITHUB_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/master" |
              jq --exit-status --raw-output \
                'select(.ref == "refs/heads/master") | .object.sha | select(type == "string" and test("^[0-9a-f]{40}$"))'
          )"
          if [[ "${SOURCE_COMMIT}" != "${WORKFLOW_SHA}" || "${WORKFLOW_SHA}" != "${LIVE_MASTER_SHA}" ]]; then
