          path: .release-tooling

      - name: Checkout current native tag trust set
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: master
          fetch-depth: 1
          persist-credentials: false
          path: .release-trust

      - name: Bind current native tag trust set
        id: native-trust
        shell: bash
        run: |
          set -euo pipefail
          TRUST_SET_COMMIT="$(git --no-replace-objects -C .release-trust rev-parse HEAD)"
          [[ "${TRUST_SET_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          test -s .release-trust/.github/native-release-tag-allowed-signers
          echo "commit=${TRUST_SET_COMMIT}" >> "${GITHUB_OUTPUT}"
          printf 'Native tag trust set: `%s` from current `master`.\n' "${TRUST_SET_COMMIT}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0

      - name: Resolve any existing signed native tag
        id: existing
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_COMMIT}"
          REMOTE_TAG="$(git ls-remote --tags --refs origin "refs/tags/${NATIVE_TAG}")"
          if [[ -z "${REMOTE_TAG}" ]]; then
            echo "existing=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [[ "${REMOTE_TAG}" == *$'\n'* ]]; then
            echo "Origin returned more than one exact ref for ${NATIVE_TAG}." >&2
            exit 1
          fi
          read -r REMOTE_OBJECT REMOTE_REF <<< "${REMOTE_TAG}"
          if [[ ! "${REMOTE_OBJECT}" =~ ^[0-9a-f]{40}$ || "${REMOTE_REF}" != "refs/tags/${NATIVE_TAG}" ]]; then
            echo "Origin returned a malformed exact ref for ${NATIVE_TAG}." >&2
            exit 1
          fi
          git fetch --force origin "+refs/tags/${NATIVE_TAG}:refs/tags/${NATIVE_TAG}"
          node .release-tooling/scripts/native-tag-attestation.mjs verify \
            --repository-root "${GITHUB_WORKSPACE}" \
            --tag "${NATIVE_TAG}" \
            --expected-commit "${SOURCE_COMMIT}" \
            --allowed-signers-file .release-trust/.github/native-release-tag-allowed-signers
          echo "existing=true" >> "${GITHUB_OUTPUT}"

      - name: Recheck current protected master immediately before credentials
        shell: bash
        env:
          READ_ONLY_GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          LIVE_MASTER_SHA="$(
            curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
              --header 'Accept: application/vnd.github+json' \
              --header 'Cache-Control: no-cache' \
              --header "Authorization: Bearer ${READ_ONLY_GITHUB_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/master" |
              jq --exit-status --raw-output \
                'select(.ref == "refs/heads/master") | .object.sha | select(type == "string" and test("^[0-9a-f]{40}$"))'
          )"
          if [[ "${WORKFLOW_SHA}" != "${LIVE_MASTER_SHA}" ]]; then
            echo "Master advanced before credentials were admitted; start a new run from current protected master ${LIVE_MASTER_SHA}." >&2
            exit 1
          fi

      - name: Create signed annotated native tag
        if: steps.existing.outputs.existing != 'true'
        shell: bash
        env:
          SIGNING_PRIVATE_KEY_BASE64: ${{ secrets.NATIVE_RELEASE_TAG_SIGNING_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${SIGNING_PRIVATE_KEY_BASE64}" ]]; then
            echo "Configure NATIVE_RELEASE_TAG_SIGNING_PRIVATE_KEY_BASE64 in native-release-attestation." >&2
            exit 1
          fi
          umask 077
          SIGNING_KEY="${RUNNER_TEMP}/native-release-tag-signing-key"
          cleanup_signing_key() {
            rm -f "${SIGNING_KEY}"
          }
          trap cleanup_signing_key EXIT
          printf '%s' "${SIGNING_PRIVATE_KEY_BASE64}" | base64 --decode > "${SIGNING_KEY}"
          test -s "${SIGNING_KEY}"
          chmod 600 "${SIGNING_KEY}"
          git \
            -c gpg.format=ssh \
            -c "user.signingkey=${SIGNING_KEY}" \
            -c user.name=calibrate-native-release \
            -c user.email=release-attestation@calibratehealth.app \
            tag --sign --annotate "${NATIVE_TAG}" "${SOURCE_COMMIT}" \
            --message "Calibrate Android native release ${NATIVE_TAG}"
          cleanup_signing_key
          trap - EXIT
          node .release-tooling/scripts/native-tag-attestation.mjs verify \
            --repository-root "${GITHUB_WORKSPACE}" \
            --tag "${NATIVE_TAG}" \
            --expected-commit "${SOURCE_COMMIT}" \
            --allowed-signers-file .release-trust/.github/native-release-tag-allowed-signers

      - name: Export the verified public tag object
        id: attestation
        shell: bash
        run: |
          set -euo pipefail
          node .release-tooling/scripts/native-tag-attestation.mjs verify \
            --repository-root "${GITHUB_WORKSPACE}" \
            --tag "${NATIVE_TAG}" \
            --expected-commit "${SOURCE_COMMIT}" \
            --allowed-signers-file .release-trust/.github/native-release-tag-allowed-signers
          TAG_OBJECT="$(git --no-replace-objects rev-parse --verify "refs/tags/${NATIVE_TAG}^{tag}")"
          TAG_OBJECT_BASE64="$(git --no-replace-objects cat-file tag "${TAG_OBJECT}" | base64 --wrap=0)"
          test -n "${TAG_OBJECT_BASE64}"
          {
            echo "tag_object=${TAG_OBJECT}"
            echo "tag_object_base64=${TAG_OBJECT_BASE64}"
          } >> "${GITHUB_OUTPUT}"

  tag-native-release:
    name: Publish signed Play-accepted native tag
