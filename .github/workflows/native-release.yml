# Fresh native builds and EAS submissions are owned by Cut release. This entrypoint promotes retained binaries.
name: Native Android Store Release
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: GitHub Release record ID containing the successfully submitted native pair
        required: true
        type: string
      operation:
        required: true
        default: promote-closed
        type: choice
        options: [promote-closed, promote-production]
      confirm_play_console_clean:
        description: Play has no unrelated pending changes and other Console/API edits are paused
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: calibrate-server-release-publication
  queue: max
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.operation == 'promote-production' && 'play-production' || 'play-internal' }}
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ job.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: .release-tooling
          sparse-checkout: |
            scripts
            tools/eas-cli
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0
      - name: Verify current protected workflow before native publication
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          SOURCE_COMMIT: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = refs/heads/master
          ROOT="${RUNNER_TEMP}/native-submit-authority"
          git init --quiet --template='' "${ROOT}"
          git -C "${ROOT}" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          node .release-tooling/scripts/release-config.mjs verify-current-release-workflow --repository-root "${ROOT}" --workflow-sha "${WORKFLOW_SHA}" --release-commit "${SOURCE_COMMIT}"
          git -C .release-tooling fetch --force --no-tags origin '+refs/heads/master:refs/remotes/origin/master'
      - name: Restore and verify the exact attested AABs before Expo authentication
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: >-
          node .release-tooling/scripts/native-release-artifacts.mjs restore
          "${RELEASE_ID}" "${RUNNER_TEMP}/native-build" "${GITHUB_WORKSPACE}/.release-tooling"
      - name: Require completed paired submission and Console coordination
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          CONFIRMED: ${{ inputs.confirm_play_console_clean }}
        run: |
          set -euo pipefail
          test "${CONFIRMED}" = true
          node .release-tooling/scripts/release-orchestrator.mjs require-native-submitted "${RELEASE_ID}"
      - name: Promote exact verified codes with stage-specific Play credentials
        env:
          CONFIRM_PLAY_CONSOLE_CLEAN: ${{ inputs.confirm_play_console_clean }}
          ACCESS_TOKEN: ${{ inputs.operation == 'promote-production' && secrets.GOOGLE_PLAY_PRODUCTION_ACCESS_TOKEN || secrets.GOOGLE_PLAY_TEST_ACCESS_TOKEN }}
          SERVICE_ACCOUNT_JSON_BASE64: ${{ inputs.operation == 'promote-production' && secrets.GOOGLE_PLAY_PRODUCTION_SERVICE_ACCOUNT_JSON_BASE64 || secrets.GOOGLE_PLAY_TEST_SERVICE_ACCOUNT_JSON_BASE64 }}
          DESTINATION: ${{ inputs.operation == 'promote-production' && 'production' || 'closed' }}
        run: >-
          node .release-tooling/scripts/native-eas-promote.mjs
          "${RUNNER_TEMP}/native-build/native-metadata.json" "${DESTINATION}"
