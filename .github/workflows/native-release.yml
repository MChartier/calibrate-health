            echo "The signing job returned malformed tag object metadata." >&2
            exit 1
          fi

          TAG_OBJECT_FILE="${RUNNER_TEMP}/native-release-tag-object"
          printf '%s' "${SIGNED_TAG_OBJECT_BASE64}" | base64 --decode > "${TAG_OBJECT_FILE}"
