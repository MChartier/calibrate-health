name: Build Release Image

on:
  # Manual recovery requests are validated through the default-master request handler before
  # it calls this workflow. Keeping this workflow call-only prevents branch-selected
  # workflow_dispatch code from reaching the publication environment.
  workflow_call:
    inputs:
      release_commit:
        description: Independent full commit SHA recorded for the prepared release
        required: true
        type: string
      release_tag:
        description: Existing vMAJOR.MINOR.PATCH tag created by the validated manifest release
        required: true
        type: string
      publish_latest:
        description: Also publish the moving latest tag after validating the current stable release
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  attestations: write
  contents: read
  id-token: write

concurrency:
  # One cross-version queue makes every queued recovery recheck current-master/latest
  # eligibility after the preceding publication completes.
  group: release-image-publication
  queue: max
  cancel-in-progress: false

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/calibratehealth

jobs:
  build_image:
    name: Build credential-free release image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      image_id: ${{ steps.bundle.outputs.image_id }}
      image_tar_sha256: ${{ steps.bundle.outputs.image_tar_sha256 }}
      metadata_sha256: ${{ steps.bundle.outputs.metadata_sha256 }}
      receipt_sha256: ${{ steps.bundle.outputs.receipt_sha256 }}

    steps:
      - name: Require protected master caller
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/master" ]]; then
            echo "Release image construction must be called from refs/heads/master; received ${GITHUB_REF}." >&2
            exit 1
          fi

      - name: Checkout exact prepared release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false
          path: .release-source

      - name: Checkout reviewed release tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
          path: .release-tooling

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Verify exact prepared release and published tag
        id: release
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.release_commit }}
          PUBLISH_LATEST: ${{ inputs.publish_latest }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          SOURCE_ROOT="${GITHUB_WORKSPACE}/.release-source"
          node .release-tooling/scripts/release-config.mjs verify-prepared \
            --repository-root "${SOURCE_ROOT}" \
            --release-tag "${RELEASE_TAG}" \
            --expected-commit "${EXPECTED_COMMIT}" \
            --publish-latest "${PUBLISH_LATEST}"

          SOURCE_SHA="$(git -C "${SOURCE_ROOT}" --no-replace-objects rev-parse --verify 'HEAD^{commit}')"
          TAG_OBJECT="$(git -C "${SOURCE_ROOT}" --no-replace-objects rev-parse --verify "refs/tags/${RELEASE_TAG}^{object}")"
          if [[ "${SOURCE_SHA}" != "${EXPECTED_COMMIT}" ||
                ! "${TAG_OBJECT}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Prepared release checkout or tag object changed after verification." >&2
            exit 1
          fi

          {
            echo "source_sha=${SOURCE_SHA}"
            echo "tag_object=${TAG_OBJECT}"
            echo "local_image=calibrate-release-candidate:${SOURCE_SHA}"
          } >> "${GITHUB_OUTPUT}"

      - name: Install checksum-verified Buildx CLI plugin
        shell: bash
        env:
          BUILDX_SHA256: 48af8a397ebd60178778bf63611dbcebe5f5e7a9be90eb9147b24b9587455778
          BUILDX_URL: https://github.com/docker/buildx/releases/download/v0.36.1/buildx-v0.36.1.linux-amd64
        run: |
          set -euo pipefail
          BUILDX_DOWNLOAD="${RUNNER_TEMP}/docker-buildx"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "${BUILDX_DOWNLOAD}" \
            "${BUILDX_URL}"
          echo "${BUILDX_SHA256}  ${BUILDX_DOWNLOAD}" | sha256sum --check --strict
          mkdir -p "${HOME}/.docker/cli-plugins"
          install -m 0755 "${BUILDX_DOWNLOAD}" "${HOME}/.docker/cli-plugins/docker-buildx"
          docker buildx version

      - name: Set up digest-pinned BuildKit
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          driver-opts: >-
            image=moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - name: Build AMD64 image without publication credentials
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ./.release-source
          file: ./.release-source/Dockerfile.app
          platforms: linux/amd64
          load: true
          push: false
          github-token: ''
          tags: ${{ steps.release.outputs.local_image }}

      - name: Create verified image transfer bundle
        id: bundle
        shell: bash
        env:
          LOCAL_IMAGE: ${{ steps.release.outputs.local_image }}
          PUBLISH_LATEST: ${{ inputs.publish_latest }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TAG_OBJECT: ${{ steps.release.outputs.tag_object }}
        run: |
          set -euo pipefail
          ARTIFACT_ROOT="${RUNNER_TEMP}/release-image-artifact"
          mkdir -p "${ARTIFACT_ROOT}"
          IMAGE_ID="$(docker image inspect --format '{{.Id}}' "${LOCAL_IMAGE}")"
          if [[ ! "${IMAGE_ID}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Built image returned malformed local identity ${IMAGE_ID}." >&2
            exit 1
          fi

          docker save --output "${ARTIFACT_ROOT}/release-image.tar" "${LOCAL_IMAGE}"
          GHCR_IMAGE="${GHCR_IMAGE,,}"
          jq --sort-keys -n \
            --arg ghcr_image "${GHCR_IMAGE}" \
            --arg image_id "${IMAGE_ID}" \
            --arg local_image "${LOCAL_IMAGE}" \
            --arg release_commit "${RELEASE_COMMIT}" \
            --arg release_tag "${RELEASE_TAG}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg tag_object "${TAG_OBJECT}" \
            --argjson publish_latest "${PUBLISH_LATEST}" \
            '{
              schema_version: 1,
              repository: $repository,
              release_commit: $release_commit,
              release_tag: $release_tag,
              publish_latest: $publish_latest,
              ghcr_image: $ghcr_image,
              local_image: $local_image,
              image_id: $image_id,
              tag_object: $tag_object
            }' > "${ARTIFACT_ROOT}/release-image.json"

          node .release-tooling/scripts/ghcr-release-receipt.mjs create \
            --repository "${GITHUB_REPOSITORY}" \
            --ghcr-image "${GHCR_IMAGE}" \
            --release-tag "${RELEASE_TAG}" \
            --release-commit "${RELEASE_COMMIT}" \
            --image-config-digest "${IMAGE_ID}" \
            > "${ARTIFACT_ROOT}/release-image-receipt.json"

          IMAGE_TAR_SHA256="$(sha256sum "${ARTIFACT_ROOT}/release-image.tar" | cut -d ' ' -f 1)"
          METADATA_SHA256="$(sha256sum "${ARTIFACT_ROOT}/release-image.json" | cut -d ' ' -f 1)"
          RECEIPT_SHA256="$(sha256sum "${ARTIFACT_ROOT}/release-image-receipt.json" | cut -d ' ' -f 1)"
          printf '%s  release-image-receipt.json\n%s  release-image.json\n%s  release-image.tar\n' \
            "${RECEIPT_SHA256}" "${METADATA_SHA256}" "${IMAGE_TAR_SHA256}" \
            > "${ARTIFACT_ROOT}/SHA256SUMS"
          {
            echo "image_id=${IMAGE_ID}"
            echo "image_tar_sha256=${IMAGE_TAR_SHA256}"
            echo "metadata_sha256=${METADATA_SHA256}"
            echo "receipt_sha256=${RECEIPT_SHA256}"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload credential-free image bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-release-image
          path: ${{ runner.temp }}/release-image-artifact
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

  attest_image_receipt:
    name: Attest exact release image receipt without publication credentials
    needs: build_image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: read
      id-token: write
    env:
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_NOSYSTEM: '1'
      GIT_NO_REPLACE_OBJECTS: '1'

    steps:
      - name: Require current protected workflow authority before receipt construction
        shell: bash
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_GLOBAL=/dev/null
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_NO_REPLACE_OBJECTS=1
          if [[ "${GITHUB_REF}" != "refs/heads/master" || ! "${WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Image receipt attestation requires an exact protected-master workflow commit." >&2
            exit 1
          fi
          VERIFY_ROOT="${RUNNER_TEMP}/calibrate-image-attestation-authority"
          TOOL_ROOT="${RUNNER_TEMP}/calibrate-image-attestation-tooling"
          if [[ -e "${VERIFY_ROOT}" || -e "${TOOL_ROOT}" ]]; then
            echo "Image receipt authority directories must not preexist." >&2
            exit 1
          fi
          git init --quiet --template='' "${VERIFY_ROOT}"
          git -C "${VERIFY_ROOT}" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "${VERIFY_ROOT}" --no-replace-objects fetch --force --no-tags origin \
            '+refs/heads/master:refs/remotes/origin/master'
          mkdir -p "${TOOL_ROOT}/scripts"
          for script in release-config.mjs native-tag-attestation.mjs ghcr-release-receipt.mjs; do
            git -C "${VERIFY_ROOT}" --no-replace-objects show \
              "${WORKFLOW_SHA}:scripts/${script}" > "${TOOL_ROOT}/scripts/${script}"
          done
          node "${TOOL_ROOT}/scripts/release-config.mjs" verify-current-release-workflow \
            --repository-root "${VERIFY_ROOT}" \
            --workflow-sha "${WORKFLOW_SHA}" \
            --release-commit "${RELEASE_COMMIT}"

      - name: Construct exact source-free image receipt
        shell: bash
        env:
          EXPECTED_RECEIPT_SHA256: ${{ needs.build_image.outputs.receipt_sha256 }}
          IMAGE_CONFIG_DIGEST: ${{ needs.build_image.outputs.image_id }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          TOOL_ROOT="${RUNNER_TEMP}/calibrate-image-attestation-tooling"
          GHCR_IMAGE="${GHCR_IMAGE,,}"
          RECEIPT_FILE="${RUNNER_TEMP}/release-image-receipt.json"
          node "${TOOL_ROOT}/scripts/ghcr-release-receipt.mjs" create \
            --repository "${GITHUB_REPOSITORY}" \
            --ghcr-image "${GHCR_IMAGE}" \
            --release-tag "${RELEASE_TAG}" \
            --release-commit "${RELEASE_COMMIT}" \
            --image-config-digest "${IMAGE_CONFIG_DIGEST}" \
            > "${RECEIPT_FILE}"
          ACTUAL_RECEIPT_SHA256="$(sha256sum "${RECEIPT_FILE}" | cut -d ' ' -f 1)"
          if [[ ! "${EXPECTED_RECEIPT_SHA256}" =~ ^[0-9a-f]{64}$ ||
                "${ACTUAL_RECEIPT_SHA256}" != "${EXPECTED_RECEIPT_SHA256}" ]]; then
            echo "Source-free image receipt does not match the credential-free build identity." >&2
            exit 1
          fi

      - name: Recheck current protected workflow authority immediately before attestation
        shell: bash
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: >-
          node "${RUNNER_TEMP}/calibrate-image-attestation-tooling/scripts/release-config.mjs"
          verify-current-release-workflow
          --repository-root "${RUNNER_TEMP}/calibrate-image-attestation-authority"
          --workflow-sha "${WORKFLOW_SHA}"
          --release-commit "${RELEASE_COMMIT}"

      - name: Attest exact release image receipt
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ runner.temp }}/release-image-receipt.json
          push-to-registry: false
          create-storage-record: false

  publish_image:
    name: Publish verified image with external package credential
    needs: [build_image, attest_image_receipt]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: server-release-publication
    permissions:
      actions: read
      attestations: read
      contents: read
    env:
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_NOSYSTEM: '1'
      GIT_NO_REPLACE_OBJECTS: '1'

    steps:
      - name: Require current protected workflow authority before image artifact access
        shell: bash
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_GLOBAL=/dev/null
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_NO_REPLACE_OBJECTS=1
          if [[ "${GITHUB_REF}" != "refs/heads/master" || ! "${WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Image publication requires an exact protected-master workflow commit." >&2
            exit 1
          fi
          VERIFY_ROOT="${RUNNER_TEMP}/calibrate-image-workflow-authority"
          TOOL_ROOT="${RUNNER_TEMP}/calibrate-image-authority-tooling"
          if [[ -e "${VERIFY_ROOT}" || -e "${TOOL_ROOT}" ]]; then
            echo "Image workflow authority directories must not preexist." >&2
            exit 1
          fi
          git init --quiet --template='' "${VERIFY_ROOT}"
          git -C "${VERIFY_ROOT}" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "${VERIFY_ROOT}" --no-replace-objects fetch --force --no-tags origin \
            '+refs/heads/master:refs/remotes/origin/master'
          mkdir -p "${TOOL_ROOT}/scripts"
          git -C "${VERIFY_ROOT}" --no-replace-objects show \
            "${WORKFLOW_SHA}:scripts/release-config.mjs" > "${TOOL_ROOT}/scripts/release-config.mjs"
          git -C "${VERIFY_ROOT}" --no-replace-objects show \
            "${WORKFLOW_SHA}:scripts/native-tag-attestation.mjs" > "${TOOL_ROOT}/scripts/native-tag-attestation.mjs"
          node "${TOOL_ROOT}/scripts/release-config.mjs" verify-current-release-workflow \
            --repository-root "${VERIFY_ROOT}" \
            --workflow-sha "${WORKFLOW_SHA}" \
            --release-commit "${RELEASE_COMMIT}"

      - name: Download verified image bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-release-image
          path: ${{ runner.temp }}/release-image-artifact

      - name: Verify exact image bundle
        id: artifact
        shell: bash
        env:
          EXPECTED_METADATA_SHA256: ${{ needs.build_image.outputs.metadata_sha256 }}
          EXPECTED_RECEIPT_SHA256: ${{ needs.build_image.outputs.receipt_sha256 }}
          EXPECTED_TAR_SHA256: ${{ needs.build_image.outputs.image_tar_sha256 }}
          PUBLISH_LATEST: ${{ inputs.publish_latest }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          ARTIFACT_ROOT="${RUNNER_TEMP}/release-image-artifact"
          EXPECTED_FILES=$'SHA256SUMS\nrelease-image-receipt.json\nrelease-image.json\nrelease-image.tar'
          ACTUAL_FILES="$(find "${ARTIFACT_ROOT}" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort)"
          if [[ "${ACTUAL_FILES}" != "${EXPECTED_FILES}" ]] ||
             [[ -n "$(find "${ARTIFACT_ROOT}" -mindepth 1 -maxdepth 1 ! -type f -print -quit)" ]] ||
             [[ -n "$(find "${ARTIFACT_ROOT}" -mindepth 2 -print -quit)" ]]; then
            echo "Downloaded image artifact must contain exactly the four expected regular files." >&2
            exit 1
          fi
          if [[ ! "${EXPECTED_TAR_SHA256}" =~ ^[0-9a-f]{64}$ ||
                ! "${EXPECTED_METADATA_SHA256}" =~ ^[0-9a-f]{64}$ ||
                ! "${EXPECTED_RECEIPT_SHA256}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Build job returned malformed artifact checksums." >&2
            exit 1
          fi

          ACTUAL_TAR_SHA256="$(sha256sum "${ARTIFACT_ROOT}/release-image.tar" | cut -d ' ' -f 1)"
          ACTUAL_METADATA_SHA256="$(sha256sum "${ARTIFACT_ROOT}/release-image.json" | cut -d ' ' -f 1)"
          ACTUAL_RECEIPT_SHA256="$(sha256sum "${ARTIFACT_ROOT}/release-image-receipt.json" | cut -d ' ' -f 1)"
          if [[ "${ACTUAL_TAR_SHA256}" != "${EXPECTED_TAR_SHA256}" ||
                "${ACTUAL_METADATA_SHA256}" != "${EXPECTED_METADATA_SHA256}" ||
                "${ACTUAL_RECEIPT_SHA256}" != "${EXPECTED_RECEIPT_SHA256}" ]]; then
            echo "Downloaded image artifact does not match the build job checksums." >&2
            exit 1
          fi
          printf '%s  release-image-receipt.json\n%s  release-image.json\n%s  release-image.tar\n' \
            "${EXPECTED_RECEIPT_SHA256}" "${EXPECTED_METADATA_SHA256}" "${EXPECTED_TAR_SHA256}" \
            > "${RUNNER_TEMP}/EXPECTED_SHA256SUMS"
          cmp --silent "${RUNNER_TEMP}/EXPECTED_SHA256SUMS" "${ARTIFACT_ROOT}/SHA256SUMS"
          (cd "${ARTIFACT_ROOT}" && sha256sum --check --strict SHA256SUMS)

          GHCR_IMAGE="${GHCR_IMAGE,,}"
          EXPECTED_LOCAL_IMAGE="calibrate-release-candidate:${RELEASE_COMMIT}"
          jq --exit-status \
            --arg ghcr_image "${GHCR_IMAGE}" \
            --arg local_image "${EXPECTED_LOCAL_IMAGE}" \
            --arg publish_latest "${PUBLISH_LATEST}" \
            --arg release_commit "${RELEASE_COMMIT}" \
            --arg release_tag "${RELEASE_TAG}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            '((keys | sort) == ([
                "ghcr_image", "image_id", "local_image", "publish_latest",
                "release_commit", "release_tag", "repository", "schema_version", "tag_object"
              ] | sort)) and
             .schema_version == 1 and
             .repository == $repository and
             .release_commit == $release_commit and
             .release_tag == $release_tag and
             .publish_latest == ($publish_latest == "true") and
             .ghcr_image == $ghcr_image and
             .local_image == $local_image and
             (.image_id | type == "string" and test("^sha256:[0-9a-f]{64}$")) and
             (.tag_object | type == "string" and test("^[0-9a-f]{40}$"))' \
            "${ARTIFACT_ROOT}/release-image.json" > /dev/null

          jq --exit-status \
            --arg ghcr_image "${GHCR_IMAGE}" \
            --arg image_config_digest "$(jq -r '.image_id' "${ARTIFACT_ROOT}/release-image.json")" \
            --arg release_commit "${RELEASE_COMMIT}" \
            --arg release_tag "${RELEASE_TAG}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            '((keys | sort) == ([
                "ghcr_image", "image_config_digest", "release_commit", "release_tag",
                "repository", "schema_version"
              ] | sort)) and
             .schema_version == 1 and
             .repository == $repository and
             .ghcr_image == $ghcr_image and
             .release_tag == $release_tag and
             .release_commit == $release_commit and
             .image_config_digest == $image_config_digest' \
            "${ARTIFACT_ROOT}/release-image-receipt.json" > /dev/null

          {
            echo "image_id=$(jq -r '.image_id' "${ARTIFACT_ROOT}/release-image.json")"
            echo "local_image=${EXPECTED_LOCAL_IMAGE}"
            echo "tag_object=$(jq -r '.tag_object' "${ARTIFACT_ROOT}/release-image.json")"
          } >> "${GITHUB_OUTPUT}"

      - name: Load verified image without registry credentials
        shell: bash
        env:
          EXPECTED_IMAGE_ID: ${{ steps.artifact.outputs.image_id }}
          LOCAL_IMAGE: ${{ steps.artifact.outputs.local_image }}
        run: |
          set -euo pipefail
          docker load --input "${RUNNER_TEMP}/release-image-artifact/release-image.tar"
          ACTUAL_IMAGE_ID="$(docker image inspect --format '{{.Id}}' "${LOCAL_IMAGE}")"
          if [[ "${ACTUAL_IMAGE_ID}" != "${EXPECTED_IMAGE_ID}" ]]; then
            echo "Loaded image ${ACTUAL_IMAGE_ID} does not match the verified bundle identity ${EXPECTED_IMAGE_ID}." >&2
            exit 1
          fi

      - name: Checkout reviewed release tooling only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
          path: .release-tooling

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Initialize isolated release verification repository
        shell: bash
        env:
          EXPECTED_TAG_OBJECT: ${{ steps.artifact.outputs.tag_object }}
          PUBLISH_LATEST: ${{ inputs.publish_latest }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          VERIFY_ROOT="${RUNNER_TEMP}/release-verification"
          git init --quiet --template='' "${VERIFY_ROOT}"
          git -C "${VERIFY_ROOT}" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "${VERIFY_ROOT}" --no-replace-objects fetch \
            --force --no-tags origin \
            '+refs/heads/master:refs/remotes/origin/master'
          git -C "${VERIFY_ROOT}" --no-replace-objects checkout --quiet --detach "${RELEASE_COMMIT}"

          node .release-tooling/scripts/release-config.mjs verify-prepared \
            --repository-root "${VERIFY_ROOT}" \
            --release-tag "${RELEASE_TAG}" \
            --expected-commit "${RELEASE_COMMIT}" \
            --publish-latest "${PUBLISH_LATEST}" > /dev/null
          REMOTE_TAG_OBJECT="$(git -C "${VERIFY_ROOT}" --no-replace-objects ls-remote \
            --tags --refs origin "refs/tags/${RELEASE_TAG}" | cut -f 1)"
          if [[ "${REMOTE_TAG_OBJECT}" != "${EXPECTED_TAG_OBJECT}" ]]; then
            echo "Published release tag object changed between image construction and publication." >&2
            exit 1
          fi

      - name: Install checksum-verified Buildx CLI plugin before authentication
        shell: bash
        env:
          BUILDX_SHA256: 48af8a397ebd60178778bf63611dbcebe5f5e7a9be90eb9147b24b9587455778
          BUILDX_URL: https://github.com/docker/buildx/releases/download/v0.36.1/buildx-v0.36.1.linux-amd64
        run: |
          set -euo pipefail
          BUILDX_DOWNLOAD="${RUNNER_TEMP}/docker-buildx"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "${BUILDX_DOWNLOAD}" \
            "${BUILDX_URL}"
          echo "${BUILDX_SHA256}  ${BUILDX_DOWNLOAD}" | sha256sum --check --strict
          mkdir -p "${HOME}/.docker/cli-plugins"
          install -m 0755 "${BUILDX_DOWNLOAD}" "${HOME}/.docker/cli-plugins/docker-buildx"
          docker buildx version

      - name: Install checksum-verified GitHub CLI attestation verifier
        id: gh_cli
        shell: bash
        env:
          GH_CLI_SHA256: a2c9b8497e1f85b1ad0dfcb78b5a622e098801b8e461e459e88e1ee12f018112
          GH_CLI_URL: https://github.com/cli/cli/releases/download/v2.97.0/gh_2.97.0_linux_amd64.tar.gz
        run: |
          set -euo pipefail
          GH_CLI_ARCHIVE="${RUNNER_TEMP}/gh_2.97.0_linux_amd64.tar.gz"
          GH_CLI_ROOT="${RUNNER_TEMP}/gh-cli"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "${GH_CLI_ARCHIVE}" \
            "${GH_CLI_URL}"
          echo "${GH_CLI_SHA256}  ${GH_CLI_ARCHIVE}" | sha256sum --check --strict
          mkdir -p "${GH_CLI_ROOT}"
          tar --extract --gzip --file "${GH_CLI_ARCHIVE}" \
            --directory "${GH_CLI_ROOT}" --strip-components=2 \
            gh_2.97.0_linux_amd64/bin/gh
          GH_CLI="${GH_CLI_ROOT}/gh"
          chmod 0755 "${GH_CLI}"
          "${GH_CLI}" version
          echo "path=${GH_CLI}" >> "${GITHUB_OUTPUT}"

      - name: Verify exact built image receipt attestation before registry authentication
        shell: bash
        env:
          GH_CLI: ${{ steps.gh_cli.outputs.path }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          GHCR_IMAGE="${GHCR_IMAGE,,}"
          RECEIPT_FILE="${RUNNER_TEMP}/release-image-artifact/release-image-receipt.json"
          node .release-tooling/scripts/ghcr-release-receipt.mjs verify \
            --repository "${GITHUB_REPOSITORY}" \
            --ghcr-image "${GHCR_IMAGE}" \
            --release-tag "${RELEASE_TAG}" \
            --release-commit "${RELEASE_COMMIT}" \
            --image-config-digest "${{ steps.artifact.outputs.image_id }}" \
            --receipt-file "${RECEIPT_FILE}"
          "${GH_CLI}" attestation verify "${RECEIPT_FILE}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/container.yml" \
            --signer-digest "${WORKFLOW_SHA}" \
            --source-digest "${WORKFLOW_SHA}" \
            --source-ref refs/heads/master \
            --predicate-type https://slsa.dev/provenance/v1 \
            --limit 100 \
            --deny-self-hosted-runners

      - name: Verify stable release tag rulesets before registry authentication
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >-
          node .release-tooling/scripts/server-release-tag-protection.mjs verify
          --repository "${GITHUB_REPOSITORY}"
          --tag "${RELEASE_TAG}"

      - name: Recheck current protected workflow authority immediately before GHCR authentication
        shell: bash
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          VERIFY_ROOT="${RUNNER_TEMP}/release-verification"
          TRUST_FILE="${RUNNER_TEMP}/release-image-attestation-trusted-workflow-shas"
          TRUSTED_MASTER_FILE="${RUNNER_TEMP}/release-image-attestation-trusted-master-commit"
          TRUSTED_REVISIONS="${RUNNER_TEMP}/release-image-attestation-trusted-revisions"
          node .release-tooling/scripts/release-config.mjs verify-current-release-workflow \
            --repository-root "${VERIFY_ROOT}" \
            --workflow-sha "${WORKFLOW_SHA}" \
            --release-commit "${RELEASE_COMMIT}"
          TRUST_SET_COMMIT="$(git -C "${VERIFY_ROOT}" --no-replace-objects rev-parse --verify 'refs/remotes/origin/master^{commit}')"
          git -C "${VERIFY_ROOT}" --no-replace-objects show \
            "${TRUST_SET_COMMIT}:.github/release-image-attestation-trusted-workflow-shas" \
            > "${TRUST_FILE}"
          node .release-tooling/scripts/ghcr-release-receipt.mjs trusted-workflows \
            --trust-file "${TRUST_FILE}" \
            --current-workflow-revision "${WORKFLOW_SHA}" \
            > "${TRUSTED_REVISIONS}"
          printf '%s\n' "${TRUST_SET_COMMIT}" > "${TRUSTED_MASTER_FILE}"
          printf 'GHCR receipt signer trust set: `%s` from protected master `%s`.\n' \
            "$(paste -sd, "${TRUSTED_REVISIONS}")" "${TRUST_SET_COMMIT}" \
            >> "${GITHUB_STEP_SUMMARY}"

      - name: Login with isolated GHCR publisher credential
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_PUBLISH_USERNAME }}
          password: ${{ secrets.GHCR_PUBLISH_TOKEN }}

      - name: Publish write-once immutable identities and verified latest
        shell: bash
        env:
          EXPECTED_IMAGE_ID: ${{ steps.artifact.outputs.image_id }}
          EXPECTED_TAG_OBJECT: ${{ steps.artifact.outputs.tag_object }}
          GH_CLI: ${{ steps.gh_cli.outputs.path }}
          GH_TOKEN: ${{ github.token }}
          LOCAL_IMAGE: ${{ steps.artifact.outputs.local_image }}
          PUBLISH_LATEST: ${{ inputs.publish_latest }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          VERIFY_ROOT="${RUNNER_TEMP}/release-verification"
          GHCR_IMAGE="${GHCR_IMAGE,,}"
          RELEASE_IMAGE="${GHCR_IMAGE}:${RELEASE_TAG}"
          SOURCE_IMAGE="${GHCR_IMAGE}:sha-${RELEASE_COMMIT}"
          LATEST_IMAGE="${GHCR_IMAGE}:latest"

          verify_release() {
            local publish_latest remote_line remote_object remote_ref
            publish_latest="$1"
            node .release-tooling/scripts/release-config.mjs verify-prepared \
              --repository-root "${VERIFY_ROOT}" \
              --release-tag "${RELEASE_TAG}" \
              --expected-commit "${RELEASE_COMMIT}" \
              --publish-latest "${publish_latest}" > /dev/null
            remote_line="$(git -C "${VERIFY_ROOT}" --no-replace-objects ls-remote \
              --tags --refs origin "refs/tags/${RELEASE_TAG}")"
            if [[ -z "${remote_line}" || "${remote_line}" == *$'\n'* ]]; then
              echo "Origin no longer has one exact ref for ${RELEASE_TAG}." >&2
              return 1
            fi
            read -r remote_object remote_ref <<< "${remote_line}"
            if [[ "${remote_object}" != "${EXPECTED_TAG_OBJECT}" ||
                  "${remote_ref}" != "refs/tags/${RELEASE_TAG}" ]]; then
              echo "Release tag ${RELEASE_TAG} changed after the image bundle was verified." >&2
              return 1
            fi
          }

          inspect_digest() {
            local config_digest config_file config_record digest digest_ref error_file image_ref raw_file repository
            image_ref="$1"
            raw_file="${RUNNER_TEMP}/registry-manifest.json"
            error_file="${RUNNER_TEMP}/registry-inspect-error"
            if ! digest="$(docker buildx imagetools inspect \
              --format '{{.Manifest.Digest}}' "${image_ref}" 2> "${error_file}")"; then
              # GHCR's explicit missing-manifest response is the only accepted absence.
              # Credential, helper, builder, and generic lookup failures must fail closed.
              if node .release-tooling/scripts/ghcr-release-policy.mjs classify-absence \
                --error-file "${error_file}" \
                --image-ref "${image_ref}"; then
                printf ''
                return 0
              fi
              cat "${error_file}" >&2
              echo "Unable to inspect ${image_ref}; refusing to treat the failure as absence." >&2
              return 1
            fi
            if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Registry returned malformed digest for ${image_ref}: ${digest}" >&2
              return 1
            fi

            # Bind media/config validation to the immutable digest observed for this tag so
            # a concurrent ref move cannot mix fields from different registry objects.
            repository="${image_ref%:*}"
            digest_ref="${repository}@${digest}"
            if ! docker buildx imagetools inspect --raw "${digest_ref}" \
              > "${raw_file}" 2> "${error_file}"; then
              cat "${error_file}" >&2
              echo "Unable to read observed manifest ${digest_ref}; failing closed." >&2
              return 1
            fi

            config_file="${RUNNER_TEMP}/registry-image-config.json"
            if ! docker buildx imagetools inspect \
              --format '{{json .Image}}' "${digest_ref}" \
              > "${config_file}" 2> "${error_file}"; then
              cat "${error_file}" >&2
              echo "Unable to inspect image configuration for ${image_ref}." >&2
              return 1
            fi
            if ! config_digest="$(node .release-tooling/scripts/ghcr-release-policy.mjs validate-manifest \
              --manifest-file "${raw_file}" \
              --image-config-file "${config_file}")"; then
              echo "Registry ref ${image_ref} is not an approved single linux/amd64 image manifest." >&2
              return 1
            fi
            if [[ ! "${config_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Registry ref ${image_ref} returned malformed image config digest ${config_digest}." >&2
              return 1
            fi
            config_record="${RUNNER_TEMP}/registry-config-${digest#sha256:}"
            printf '%s\n' "${config_digest}" > "${config_record}"
            printf '%s' "${digest}"
          }

          config_digest_for_manifest() {
            local config_digest config_record manifest_digest
            manifest_digest="$1"
            if [[ ! "${manifest_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Cannot resolve a config digest for malformed manifest digest ${manifest_digest}." >&2
              return 1
            fi
            config_record="${RUNNER_TEMP}/registry-config-${manifest_digest#sha256:}"
            if [[ ! -f "${config_record}" || -L "${config_record}" ]]; then
              echo "Validated config-digest evidence is missing for manifest ${manifest_digest}." >&2
              return 1
            fi
            config_digest="$(<"${config_record}")"
            if [[ ! "${config_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Validated config-digest evidence is malformed for manifest ${manifest_digest}." >&2
              return 1
            fi
            printf '%s' "${config_digest}"
          }

          verify_receipt_attestation() {
            local authorization candidate_file config_digest discovery_file receipt_directory
            local receipt_file signer_revision trusted_master verified
            config_digest="$1"
            receipt_directory="${RUNNER_TEMP}/registry-receipt-${config_digest#sha256:}"
            receipt_file="${receipt_directory}/release-image-receipt.json"
            discovery_file="${receipt_directory}/verified-attestations.json"
            candidate_file="${receipt_directory}/candidate-workflow-revisions"
            mkdir -p "${receipt_directory}"
            node .release-tooling/scripts/ghcr-release-receipt.mjs create \
              --repository "${GITHUB_REPOSITORY}" \
              --ghcr-image "${GHCR_IMAGE}" \
              --release-tag "${RELEASE_TAG}" \
              --release-commit "${RELEASE_COMMIT}" \
              --image-config-digest "${config_digest}" \
              > "${receipt_file}"
            if ! "${GH_CLI}" attestation verify "${receipt_file}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/container.yml" \
              --source-ref refs/heads/master \
              --predicate-type https://slsa.dev/provenance/v1 \
              --limit 100 \
              --deny-self-hosted-runners \
              --format json > "${discovery_file}"; then
              echo "No cryptographically valid protected-master receipt attestation exists for this registry object." >&2
              return 1
            fi
            node .release-tooling/scripts/ghcr-release-receipt.mjs discover-workflows \
              --repository "${GITHUB_REPOSITORY}" \
              --verification-file "${discovery_file}" \
              > "${candidate_file}"
            trusted_master="$(<"${RUNNER_TEMP}/release-image-attestation-trusted-master-commit")"
            if [[ ! "${trusted_master}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "GHCR receipt trusted-master snapshot is malformed." >&2
              return 1
            fi
            verified=false
            while IFS= read -r signer_revision; do
              if [[ ! "${signer_revision}" =~ ^[0-9a-f]{40}$ ]]; then
                echo "GHCR receipt signer discovery is malformed." >&2
                return 1
              fi
              if ! authorization="$(node .release-tooling/scripts/ghcr-release-receipt.mjs authorize-workflow \
                --repository-root "${VERIFY_ROOT}" \
                --trust-file "${RUNNER_TEMP}/release-image-attestation-trusted-workflow-shas" \
                --candidate-workflow-revision "${signer_revision}" \
                --current-workflow-revision "${WORKFLOW_SHA}" \
                --trusted-master-commit "${trusted_master}" \
                --release-commit "${RELEASE_COMMIT}")"; then
                continue
              fi
              if "${GH_CLI}" attestation verify "${receipt_file}" \
                --repo "${GITHUB_REPOSITORY}" \
                --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/container.yml" \
                --signer-digest "${signer_revision}" \
                --source-digest "${signer_revision}" \
                --source-ref refs/heads/master \
                --predicate-type https://slsa.dev/provenance/v1 \
                --limit 100 \
                --deny-self-hosted-runners > /dev/null; then
                printf 'Accepted GHCR receipt signer policy: `%s`.\n' "${authorization}" \
                  >> "${GITHUB_STEP_SUMMARY}"
                verified=true
                break
              fi
            done < "${candidate_file}"
            if [[ "${verified}" != "true" ]]; then
              echo "Immutable GHCR content lacks the exact trusted release receipt attestation." >&2
              echo "Do not adopt or overwrite this legacy/prepositioned digest. Quarantine or delete its v*/sha-* aliases after an owner review, then rerun a fresh publication." >&2
              return 1
            fi
          }

          require_digest() {
            local actual expected image_ref
            image_ref="$1"
            expected="$2"
            actual="$(inspect_digest "${image_ref}")"
            if [[ "${actual}" != "${expected}" ]]; then
              echo "Image ${image_ref} resolves to ${actual:-no digest}, expected ${expected}." >&2
              return 1
            fi
          }

          ensure_immutable_alias() {
            local authoritative_digest current_digest image_ref
            image_ref="$1"
            authoritative_digest="$2"
            current_digest="$(inspect_digest "${image_ref}")"
            if [[ -n "${current_digest}" ]]; then
              if [[ "${current_digest}" != "${authoritative_digest}" ]]; then
                echo "Immutable image ${image_ref} already resolves to conflicting digest ${current_digest}." >&2
                return 1
              fi
              return 0
            fi

            verify_release false
            current_digest="$(inspect_digest "${image_ref}")"
            if [[ -n "${current_digest}" ]]; then
              if [[ "${current_digest}" != "${authoritative_digest}" ]]; then
                echo "Immutable image ${image_ref} appeared with conflicting digest ${current_digest}." >&2
                return 1
              fi
              return 0
            fi
            docker buildx imagetools create \
              --prefer-index=false \
              --tag "${image_ref}" \
              "${GHCR_IMAGE}@${authoritative_digest}"
            require_digest "${image_ref}" "${authoritative_digest}"
          }

          PUBLISHED_FRESH=false
          RELEASE_DIGEST="$(inspect_digest "${RELEASE_IMAGE}")"
          SOURCE_DIGEST="$(inspect_digest "${SOURCE_IMAGE}")"
          if [[ -z "${RELEASE_DIGEST}" && -z "${SOURCE_DIGEST}" ]]; then
            docker tag "${LOCAL_IMAGE}" "${RELEASE_IMAGE}"
            verify_release false
            RELEASE_DIGEST="$(inspect_digest "${RELEASE_IMAGE}")"
            SOURCE_DIGEST="$(inspect_digest "${SOURCE_IMAGE}")"
            if [[ -z "${RELEASE_DIGEST}" && -z "${SOURCE_DIGEST}" ]]; then
              docker push "${RELEASE_IMAGE}"
              PUBLISHED_FRESH=true
            fi
          fi

          RELEASE_DIGEST="$(inspect_digest "${RELEASE_IMAGE}")"
          SOURCE_DIGEST="$(inspect_digest "${SOURCE_IMAGE}")"
          if [[ -n "${RELEASE_DIGEST}" && -n "${SOURCE_DIGEST}" &&
                "${RELEASE_DIGEST}" != "${SOURCE_DIGEST}" ]]; then
            echo "Immutable image tags disagree: ${RELEASE_IMAGE}=${RELEASE_DIGEST}, ${SOURCE_IMAGE}=${SOURCE_DIGEST}." >&2
            exit 1
          fi
          AUTHORITATIVE_DIGEST="${RELEASE_DIGEST:-${SOURCE_DIGEST}}"
          if [[ -z "${AUTHORITATIVE_DIGEST}" ]]; then
            echo "No immutable image digest exists after canonical publication." >&2
            exit 1
          fi
          AUTHORITATIVE_CONFIG_DIGEST="$(config_digest_for_manifest "${AUTHORITATIVE_DIGEST}")"
          verify_receipt_attestation "${AUTHORITATIVE_CONFIG_DIGEST}"

          if [[ "${PUBLISHED_FRESH}" == "true" ]]; then
            # A first publication must resolve back to the exact image transferred from
            # the credential-free builder. Recovery instead requires a receipt attested
            # before the original publication, even when a later rebuild is byte-different.
            ACTUAL_LOCAL_IMAGE_ID="$(docker image inspect --format '{{.Id}}' "${LOCAL_IMAGE}")"
            docker pull "${GHCR_IMAGE}@${AUTHORITATIVE_DIGEST}"
            PUBLISHED_IMAGE_ID="$(docker image inspect --format '{{.Id}}' "${GHCR_IMAGE}@${AUTHORITATIVE_DIGEST}")"
            if [[ "${AUTHORITATIVE_CONFIG_DIGEST}" != "${EXPECTED_IMAGE_ID}" ||
                  "${ACTUAL_LOCAL_IMAGE_ID}" != "${EXPECTED_IMAGE_ID}" ||
                  "${PUBLISHED_IMAGE_ID}" != "${EXPECTED_IMAGE_ID}" ]]; then
              echo "Freshly published image ${PUBLISHED_IMAGE_ID} differs from verified build ${ACTUAL_LOCAL_IMAGE_ID}." >&2
              exit 1
            fi
          fi

          ensure_immutable_alias "${RELEASE_IMAGE}" "${AUTHORITATIVE_DIGEST}"
          ensure_immutable_alias "${SOURCE_IMAGE}" "${AUTHORITATIVE_DIGEST}"

          if [[ "${PUBLISH_LATEST}" == "true" ]]; then
            LATEST_DIGEST="$(inspect_digest "${LATEST_IMAGE}")"
            if [[ "${LATEST_DIGEST}" != "${AUTHORITATIVE_DIGEST}" ]]; then
              verify_release true
              LATEST_DIGEST="$(inspect_digest "${LATEST_IMAGE}")"
              if [[ "${LATEST_DIGEST}" != "${AUTHORITATIVE_DIGEST}" ]]; then
                docker buildx imagetools create \
                  --prefer-index=false \
                  --tag "${LATEST_IMAGE}" \
                  "${GHCR_IMAGE}@${AUTHORITATIVE_DIGEST}"
              fi
            fi
            require_digest "${LATEST_IMAGE}" "${AUTHORITATIVE_DIGEST}"
          fi
