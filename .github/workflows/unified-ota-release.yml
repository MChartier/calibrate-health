        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unified-ota-environment
          path: ${{ runner.temp }}/ota-environment
      - name: Download unified-ota-export
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unified-ota-export
          path: ${{ runner.temp }}/ota-export
      - name: Publish and verify the inert export with no GitHub writer
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: node scripts/release-ota-worker.mjs publish
      - name: Attest verified source and delivered manifest bytes
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ runner.temp }}/ota-receipt.json
          push-to-registry: false
          create-storage-record: false
      - name: Retain unified-ota-receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unified-ota-receipt
          path: ${{ runner.temp }}/ota-receipt.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7
