name: Publish selected compatible OTA artifact

run-name: Unified OTA ${{ inputs.parent_run_id }} ${{ inputs.stage }} ${{ inputs.plan_digest }}

on:
  workflow_dispatch:
    inputs:
      parent_run_id:
        description: Originating protected unified release handler
        required: true
        type: string
      plan_digest:
        description: Exact retained plan digest
        required: true
        type: string
      source_commit:
        description: Exact verified source
        required: true
        type: string
      profile:
        description: Exact planned build profile
        required: true
        type: choice
        options: [production, internal]
      stage:
        description: Exact planned platform and compatible runtime
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: calibrate-unified-ota
  cancel-in-progress: false
  queue: max

env:
  WORKFLOW_SHA: ${{ github.workflow_sha }}
  EXPO_PUBLIC_EAS_PROJECT_ID: ${{ secrets.CALIBRATE_EAS_PROJECT_ID }}
  EXPO_PUBLIC_CALIBRATE_SERVER_URL: ${{ vars[inputs.profile == 'internal' && 'CALIBRATE_INTERNAL_SERVER_URL' || 'CALIBRATE_NATIVE_SERVER_URL'] }}
  EXPO_UPDATES_CHANNEL: ${{ inputs.profile }}
  EAS_ENVIRONMENT: ${{ inputs.profile == 'production' && 'production' || 'preview' }}

jobs:
  environment:
    name: Resolve the verified public EAS environment
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      attestations: read
    steps:
      - name: Initialize runner-local artifact paths
        shell: bash
        run: |
          set -euo pipefail
          echo "GH_CLI=${RUNNER_TEMP}/gh-cli/gh" >> "${GITHUB_ENV}"
          echo "OTA_ENVIRONMENT_FILE=${RUNNER_TEMP}/ota-environment/environment.json" >> "${GITHUB_ENV}"
          echo "OTA_CHANNEL_FILE=${RUNNER_TEMP}/ota-environment/channel.json" >> "${GITHUB_ENV}"
          echo "OTA_ARTIFACT_DIRECTORY=${RUNNER_TEMP}/ota-export" >> "${GITHUB_ENV}"
          echo "OTA_RECEIPT_FILE=${RUNNER_TEMP}/ota-receipt.json" >> "${GITHUB_ENV}"
      - name: Require protected tooling before checking out privileged code
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = refs/heads/master
          [[ "${WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]]
          master="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/master" --jq .object.sha)"
          [[ "${master}" =~ ^[0-9a-f]{40}$ ]]
          if [[ "${master}" != "${WORKFLOW_SHA}" ]]; then
            for tree in scripts .github; do
              original="$(gh api "repos/${GITHUB_REPOSITORY}/git/trees/${WORKFLOW_SHA}" --jq ".tree[] | select(.path == \"${tree}\" and .type == \"tree\") | .sha")"
              current="$(gh api "repos/${GITHUB_REPOSITORY}/git/trees/${master}" --jq ".tree[] | select(.path == \"${tree}\" and .type == \"tree\") | .sha")"
              [[ "${original}" =~ ^[0-9a-f]{40}$ ]]
              test "${original}" = "${current}"
            done
          fi
      - name: Checkout exact protected source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            /scripts/
            /tools/eas-cli/
            /mobile/eas.json
          sparse-checkout-cone-mode: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
      - name: Install the reviewed read-only attestation client
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gh_2.97.0_linux_amd64.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 --output "${archive}" \
            https://github.com/cli/cli/releases/download/v2.97.0/gh_2.97.0_linux_amd64.tar.gz
          echo "a2c9b8497e1f85b1ad0dfcb78b5a622e098801b8e461e459e88e1ee12f018112  ${archive}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/gh-cli"
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}/gh-cli" --strip-components=2 gh_2.97.0_linux_amd64/bin/gh
          chmod 0755 "${GH_CLI}"
      - name: Install only the locked EAS client without lifecycle hooks
        run: npm ci --prefix tools/eas-cli --ignore-scripts --no-audit --fund=false
      - name: Verify exact manual authority and signed native compatibility before credentials
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-ota-worker.mjs verify
      - name: Prepare public environment output directory
        run: mkdir -p "${RUNNER_TEMP}/ota-environment"
      - name: Resolve the verified public EAS environment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: node scripts/release-ota-worker.mjs environment
      - name: Retain unified-ota-environment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unified-ota-environment
          path: ${{ runner.temp }}/ota-environment
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  export:
    name: Export only the selected runtime without provider credentials
    needs: environment
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      attestations: read
    steps:
      - name: Initialize runner-local artifact paths
        shell: bash
        run: |
          set -euo pipefail
          echo "GH_CLI=${RUNNER_TEMP}/gh-cli/gh" >> "${GITHUB_ENV}"
          echo "OTA_ENVIRONMENT_FILE=${RUNNER_TEMP}/ota-environment/environment.json" >> "${GITHUB_ENV}"
          echo "OTA_CHANNEL_FILE=${RUNNER_TEMP}/ota-environment/channel.json" >> "${GITHUB_ENV}"
          echo "OTA_ARTIFACT_DIRECTORY=${RUNNER_TEMP}/ota-export" >> "${GITHUB_ENV}"
          echo "OTA_RECEIPT_FILE=${RUNNER_TEMP}/ota-receipt.json" >> "${GITHUB_ENV}"
      - name: Require protected tooling before checking out privileged code
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = refs/heads/master
          [[ "${WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]]
          master="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/master" --jq .object.sha)"
          [[ "${master}" =~ ^[0-9a-f]{40}$ ]]
          if [[ "${master}" != "${WORKFLOW_SHA}" ]]; then
            for tree in scripts .github; do
              original="$(gh api "repos/${GITHUB_REPOSITORY}/git/trees/${WORKFLOW_SHA}" --jq ".tree[] | select(.path == \"${tree}\" and .type == \"tree\") | .sha")"
              current="$(gh api "repos/${GITHUB_REPOSITORY}/git/trees/${master}" --jq ".tree[] | select(.path == \"${tree}\" and .type == \"tree\") | .sha")"
              [[ "${original}" =~ ^[0-9a-f]{40}$ ]]
              test "${original}" = "${current}"
            done
          fi
      - name: Checkout exact protected source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
      - name: Install the reviewed read-only attestation client
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gh_2.97.0_linux_amd64.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 --output "${archive}" \
            https://github.com/cli/cli/releases/download/v2.97.0/gh_2.97.0_linux_amd64.tar.gz
          echo "a2c9b8497e1f85b1ad0dfcb78b5a622e098801b8e461e459e88e1ee12f018112  ${archive}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/gh-cli"
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}/gh-cli" --strip-components=2 gh_2.97.0_linux_amd64/bin/gh
          chmod 0755 "${GH_CLI}"
      - name: Install locked export dependencies without lifecycle hooks
        run: npm ci --ignore-scripts --include=dev --include=optional --no-audit --fund=false
      - name: Verify exact manual authority and signed native compatibility before credentials
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-ota-worker.mjs verify
      - name: Download unified-ota-environment
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unified-ota-environment
          path: ${{ runner.temp }}/ota-environment
      - name: Export only the selected runtime without provider credentials
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-ota-worker.mjs export
      - name: Retain unified-ota-export
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unified-ota-export
          path: ${{ runner.temp }}/ota-export
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  intent:
    name: Retain exact publication intent without provider credentials
    needs: export
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
      attestations: read
    steps:
      - name: Initialize runner-local artifact paths
        shell: bash
        run: |
          set -euo pipefail
          echo "GH_CLI=${RUNNER_TEMP}/gh-cli/gh" >> "${GITHUB_ENV}"
          echo "OTA_ENVIRONMENT_FILE=${RUNNER_TEMP}/ota-environment/environment.json" >> "${GITHUB_ENV}"
          echo "OTA_CHANNEL_FILE=${RUNNER_TEMP}/ota-environment/channel.json" >> "${GITHUB_ENV}"
          echo "OTA_ARTIFACT_DIRECTORY=${RUNNER_TEMP}/ota-export" >> "${GITHUB_ENV}"
          echo "OTA_RECEIPT_FILE=${RUNNER_TEMP}/ota-receipt.json" >> "${GITHUB_ENV}"
