              current="$(gh api "repos/${GITHUB_REPOSITORY}/git/trees/${master}" --jq ".tree[] | select(.path == \"${tree}\" and .type == \"tree\") | .sha")"
              [[ "${original}" =~ ^[0-9a-f]{40}$ ]]
              test "${original}" = "${current}"
            done
          fi
      - name: Checkout exact protected source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            /scripts/
            /tools/eas-cli/
            /mobile/eas.json
            /package.json
          sparse-checkout-cone-mode: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
      - name: Install the reviewed read-only attestation client
