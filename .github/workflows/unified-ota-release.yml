          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-ota-worker.mjs verify
      - name: Download unified-ota-environment
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unified-ota-environment
          path: ${{ runner.temp }}/ota-environment
      - name: Download unified-ota-export
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unified-ota-export
          path: ${{ runner.temp }}/ota-export
      - name: Retain exact publication intent without provider credentials
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-ota-worker.mjs intent

  publish:
    name: Publish and verify the inert export with no GitHub writer
    needs: intent
    environment: ${{ inputs.profile == 'production' && 'production' || 'preview' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Initialize runner-local artifact paths
        shell: bash
        run: |
          set -euo pipefail
          echo "GH_CLI=${RUNNER_TEMP}/gh-cli/gh" >> "${GITHUB_ENV}"
          echo "OTA_ENVIRONMENT_FILE=${RUNNER_TEMP}/ota-environment/environment.json" >> "${GITHUB_ENV}"
          echo "OTA_CHANNEL_FILE=${RUNNER_TEMP}/ota-environment/channel.json" >> "${GITHUB_ENV}"
          echo "OTA_ARTIFACT_DIRECTORY=${RUNNER_TEMP}/ota-export" >> "${GITHUB_ENV}"
          echo "OTA_RECEIPT_FILE=${RUNNER_TEMP}/ota-receipt.json" >> "${GITHUB_ENV}"
      - name: Require protected tooling before checking out privileged code
