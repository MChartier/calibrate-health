name: Build Release Image

run-name: Request image ${{ inputs.release_tag }} from ${{ inputs.release_commit }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact immutable vMAJOR.MINOR.PATCH tag to publish
        required: true
        type: string
      release_commit:
        description: Exact release commit the immutable tag must target
        required: true
        type: string
      publish_latest:
        description: Also move latest after proving this is the current stable release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  request:
    name: Submit read-only image request
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require protected master and exact inputs
        shell: bash
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/master" ]]; then
            echo "Release image requests must run from protected master; received ${GITHUB_REF}." >&2
            exit 1
          fi
          [[ "${RELEASE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Create bound request artifact
        shell: bash
        env:
          PUBLISH_LATEST: ${{ inputs.publish_latest }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          REQUEST_RUN_ATTEMPT: ${{ github.run_attempt }}
          REQUEST_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ "${PUBLISH_LATEST}" =~ ^(true|false)$ ]]
          mkdir -p "${RUNNER_TEMP}/calibrate-release-request"
          jq -n \
            --arg head_branch "${GITHUB_REF_NAME}" \
            --arg head_sha "${GITHUB_SHA}" \
            --arg operation build-release-image \
            --argjson publish_latest "${PUBLISH_LATEST}" \
            --arg release_commit "${RELEASE_COMMIT}" \
            --arg release_tag "${RELEASE_TAG}" \
            --arg repository "${REPOSITORY}" \
            --arg repository_id "${REPOSITORY_ID}" \
            --arg request_run_attempt "${REQUEST_RUN_ATTEMPT}" \
            --arg request_run_id "${REQUEST_RUN_ID}" \
            '{schema_version:1, operation:$operation, repository:$repository, repository_id:$repository_id, request_run_id:$request_run_id, request_run_attempt:$request_run_attempt, head_branch:$head_branch, head_sha:$head_sha, inputs:{publish_latest:$publish_latest, release_commit:$release_commit, release_tag:$release_tag}}' \
            > "${RUNNER_TEMP}/calibrate-release-request/request.json"

      - name: Upload fixed image request
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-release-image-request
          path: ${{ runner.temp }}/calibrate-release-request/request.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7
