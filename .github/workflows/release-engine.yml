# Exercise the installed shared contract on Windows and Linux without publication credentials.
name: Release contract
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    uses: MChartier/expo-release-template/.github/workflows/release-contract.yml@fcff5bff477e1ed324bd1efbdb0d576c09af8742
    permissions:
      contents: read
