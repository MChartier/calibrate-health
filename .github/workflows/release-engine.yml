# Exercise the installed shared contract on Windows and Linux without publication credentials.
name: Release contract
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    uses: MChartier/expo-release-template/.github/workflows/release-contract.yml@1303156faa526fc5c51b8863c56a7c25bf00ab3e
    permissions:
      contents: read
