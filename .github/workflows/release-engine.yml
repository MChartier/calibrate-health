# Exercise the installed shared contract on Windows and Linux without publication credentials.
name: Release contract
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    uses: MChartier/expo-release-template/.github/workflows/release-contract.yml@6ae5cf3eaa680ae9911743387a2bd4791349570c
    permissions:
      contents: read
