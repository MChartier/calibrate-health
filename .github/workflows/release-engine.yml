# Exercise the installed shared contract on Windows and Linux without publication credentials.
name: Release contract
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    uses: MChartier/expo-release-template/.github/workflows/release-contract.yml@e3cbcc3ceda336876e8fc8fea6c6076de245bf59
    permissions:
      contents: read
