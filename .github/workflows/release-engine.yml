# Exercise the installed shared contract on Windows and Linux without publication credentials.
name: Release contract
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    uses: MChartier/expo-release-template/.github/workflows/release-contract.yml@86b1beff598cbc5fe5b76f93ed116cf90d5d1006
    permissions:
      contents: read
