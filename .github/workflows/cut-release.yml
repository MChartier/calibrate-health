name: Cut release worker

run-name: Cut ${{ inputs.bump }} release from ${{ github.ref_name }}

on:
  workflow_call:
    inputs:
      bump:
        description: Semantic server/web version component to bump
        required: true
        type: string
      source_sha:
        description: Exact protected master commit authorized by the verified request
        required: true
        type: string

permissions:
  attestations: write
  contents: read
  id-token: write

env:
  GIT_NO_REPLACE_OBJECTS: '1'

concurrency:
  group: cut-release
  queue: max
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare exact release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.release.outputs.artifact_name }}
      producer_run_attempt: ${{ steps.release.outputs.producer_run_attempt }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      release_sha: ${{ steps.release.outputs.release_sha }}
      previous_version: ${{ steps.release.outputs.previous_version }}
      version: ${{ steps.release.outputs.version }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_branch: ${{ steps.release.outputs.release_branch }}

    steps:
      - name: Require protected master caller
        shell: bash
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/master" ]]; then
            echo "Cut release worker must be called from protected master; current ref is ${GITHUB_REF}." >&2
            exit 1
          fi
          if [[ ! "${REQUESTED_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ || ! "${WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Cut release worker requires exact full request and workflow commit SHAs." >&2
            exit 1
          fi
          if [[ "${GITHUB_SHA}" != "${WORKFLOW_SHA}" ]]; then
            echo "Cut release worker must execute from the exact protected handler/workflow commit." >&2
            exit 1
          fi

      - name: Checkout exact protected master source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Prepare synchronized release commit
        id: release
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          if [[ ! "${BUMP}" =~ ^(patch|minor|major)$ ]]; then
            echo "bump must be patch, minor, or major." >&2
            exit 1
          fi

          git --no-replace-objects fetch --force --no-tags origin \
            '+refs/heads/master:refs/remotes/origin/master'
          SOURCE_SHA="$(git --no-replace-objects rev-parse --verify 'HEAD^{commit}')"
          REMOTE_MASTER_SHA="$(git --no-replace-objects rev-parse --verify 'refs/remotes/origin/master^{commit}')"
          if [[ "${SOURCE_SHA}" != "${REQUESTED_SOURCE_SHA}" || "${SOURCE_SHA}" != "${REMOTE_MASTER_SHA}" ]]; then
            echo "The request source is not the exact current protected master commit. Dispatch a new Cut release request." >&2
            exit 1
          fi
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Release preparation requires a clean checkout." >&2
            exit 1
          fi

          BASELINE_TAG="$(node scripts/release-config.mjs tag)"
          if [[ ! "${BASELINE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The protected master manifest does not identify a stable release baseline." >&2
            exit 1
          fi
          BASELINE_REMOTE="$(git --no-replace-objects ls-remote --tags --refs origin "refs/tags/${BASELINE_TAG}")"
          if [[ "$(printf '%s\n' "${BASELINE_REMOTE}" | sed '/^$/d' | wc -l)" -ne 1 ]]; then
            echo "Manifest baseline ${BASELINE_TAG} must have exactly one published tag ref." >&2
            exit 1
          fi
          read -r BASELINE_OBJECT BASELINE_REF <<< "${BASELINE_REMOTE}"
          if [[ ! "${BASELINE_OBJECT}" =~ ^[0-9a-f]{40}$ || "${BASELINE_REF}" != "refs/tags/${BASELINE_TAG}" ]]; then
            echo "Origin returned a malformed manifest baseline tag ref." >&2
            exit 1
          fi
          git --no-replace-objects fetch --force --no-tags origin \
            "+refs/tags/${BASELINE_TAG}:refs/tags/${BASELINE_TAG}"
          if [[ "$(git --no-replace-objects rev-parse --verify "refs/tags/${BASELINE_TAG}^{object}")" != "${BASELINE_OBJECT}" ]]; then
            echo "Fetched baseline tag object does not match origin." >&2
            exit 1
          fi
          if [[ "$(git --no-replace-objects cat-file -t "refs/tags/${BASELINE_TAG}")" != "tag" ]]; then
            echo "Manifest baseline ${BASELINE_TAG} must be an annotated release tag." >&2
            exit 1
          fi
          BASELINE_PAYLOAD="$(git --no-replace-objects cat-file -p "refs/tags/${BASELINE_TAG}")"
          BASELINE_TARGET="$(printf '%s\n' "${BASELINE_PAYLOAD}" | sed -n 's/^object //p' | head -n 1)"
          BASELINE_TYPE="$(printf '%s\n' "${BASELINE_PAYLOAD}" | sed -n 's/^type //p' | head -n 1)"
          BASELINE_NAME="$(printf '%s\n' "${BASELINE_PAYLOAD}" | sed -n 's/^tag //p' | head -n 1)"
          if [[ ! "${BASELINE_TARGET}" =~ ^[0-9a-f]{40}$ || "${BASELINE_TYPE}" != "commit" || "${BASELINE_NAME}" != "${BASELINE_TAG}" ]]; then
            echo "Manifest baseline ${BASELINE_TAG} is not a direct, correctly named annotated commit tag." >&2
            exit 1
          fi
          if [[ "$(git --no-replace-objects rev-parse --verify "refs/tags/${BASELINE_TAG}^{commit}")" != "${BASELINE_TARGET}" ]]; then
            echo "Manifest baseline ${BASELINE_TAG} does not peel to its direct target." >&2
            exit 1
          fi
          if ! git --no-replace-objects merge-base --is-ancestor "${BASELINE_TARGET}" "${SOURCE_SHA}"; then
            echo "Manifest baseline ${BASELINE_TAG} is not on protected master history." >&2
            exit 1
          fi

          VERSION="$(npm run --silent release:prepare -- --bump "${BUMP}")"
          TAG="v${VERSION}"
          BRANCH="release/${TAG}"
          if [[ -n "$(git --no-replace-objects ls-remote --tags --refs origin "refs/tags/${TAG}")" ]]; then
            echo "Release tag ${TAG} already exists." >&2
            exit 1
          fi
          if [[ -n "$(git --no-replace-objects ls-remote --heads origin "refs/heads/${BRANCH}")" ]]; then
            echo "Release branch ${BRANCH} already exists. Resolve that candidate before retrying." >&2
            exit 1
          fi

          EXPECTED_FILES=(
            backend/package-lock.json
            backend/package.json
            docs/openapi/v1.yaml
            package-lock.json
            package.json
            packages/api-client/src/generated/v1.ts
            shared/client-diagnostic-versions.json
            shared/release.json
          )
          mapfile -t CHANGED_FILES < <(git diff --name-only)
          if [[ "${#CHANGED_FILES[@]}" -ne "${#EXPECTED_FILES[@]}" ]]; then
            printf 'Release preparation changed an unexpected number of files:\n%s\n' "${CHANGED_FILES[*]}" >&2
            exit 1
          fi
          for file in "${EXPECTED_FILES[@]}"; do
            if ! printf '%s\n' "${CHANGED_FILES[@]}" | grep -Fxq "${file}"; then
              echo "Release preparation did not update expected mirror ${file}." >&2
              exit 1
            fi
          done

          npm run release:check
          git diff --check
          git switch -c "${BRANCH}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${EXPECTED_FILES[@]}"
          git diff --cached --check
          git commit -m "Prepare release ${TAG}"
          RELEASE_SHA="$(git --no-replace-objects rev-parse --verify 'HEAD^{commit}')"
          if [[ "$(git --no-replace-objects rev-parse --verify 'HEAD^{commit}^')" != "${SOURCE_SHA}" ]]; then
            echo "Prepared release commit does not have the protected caller commit as its sole parent." >&2
            exit 1
          fi

          ARTIFACT_NAME="cut-release-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ARTIFACT_DIR="${RUNNER_TEMP}/cut-release-candidate"
          mkdir -p "${ARTIFACT_DIR}"
          git --no-replace-objects bundle create "${ARTIFACT_DIR}/candidate.bundle" \
            "refs/heads/${BRANCH}" "^${SOURCE_SHA}"
          jq -n \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg repository_id "${GITHUB_REPOSITORY_ID}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg workflow_sha "${WORKFLOW_SHA}" \
            --arg source_sha "${SOURCE_SHA}" \
            --arg release_sha "${RELEASE_SHA}" \
            --arg previous_version "${BASELINE_TAG#v}" \
            --arg version "${VERSION}" \
            --arg release_tag "${TAG}" \
            --arg release_branch "${BRANCH}" \
            '{schema_version: 1, repository: $repository, repository_id: $repository_id,
              run_id: $run_id, run_attempt: $run_attempt, workflow_sha: $workflow_sha,
              source_sha: $source_sha, release_sha: $release_sha,
              previous_version: $previous_version, version: $version,
              release_tag: $release_tag, release_branch: $release_branch}' \
            > "${ARTIFACT_DIR}/metadata.json"
          (
            cd "${ARTIFACT_DIR}"
            sha256sum candidate.bundle metadata.json > SHA256SUMS
          )

          {
            echo "artifact_name=${ARTIFACT_NAME}"
            echo "producer_run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "source_sha=${SOURCE_SHA}"
            echo "release_sha=${RELEASE_SHA}"
            echo "previous_version=${BASELINE_TAG#v}"
            echo "version=${VERSION}"
            echo "release_tag=${TAG}"
            echo "release_branch=${BRANCH}"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload exact release candidate bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.release.outputs.artifact_name }}
          path: ${{ runner.temp }}/cut-release-candidate
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

  publish_candidate:
    name: Publish exact candidate branch
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: server-release-publication
    permissions:
      actions: read
      contents: read

    steps:
      - name: Require current protected master workflow
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          CURRENT_MASTER_SHA="$(curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/master" |
            jq -er '.object.sha | select(test("^[0-9a-f]{40}$"))')"
          if [[ ! "${WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ || "${CURRENT_MASTER_SHA}" != "${WORKFLOW_SHA}" ]]; then
            echo "Cut publication requires the current protected master workflow; found workflow ${WORKFLOW_SHA} and master ${CURRENT_MASTER_SHA}." >&2
            exit 1
          fi

      - name: Checkout exact protected source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout reviewed release tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
          path: .release-tooling

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Download exact release candidate bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.prepare.outputs.artifact_name }}
          path: ${{ runner.temp }}/cut-release-candidate

      - name: Verify candidate artifact and canonical transformation before authentication
        shell: bash
        env:
          ARTIFACT_NAME: ${{ needs.prepare.outputs.artifact_name }}
          PRODUCER_RUN_ATTEMPT: ${{ needs.prepare.outputs.producer_run_attempt }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          PREVIOUS_VERSION: ${{ needs.prepare.outputs.previous_version }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_BRANCH: ${{ needs.prepare.outputs.release_branch }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          ARTIFACT_DIR="${RUNNER_TEMP}/cut-release-candidate"
          EXPECTED_ENTRIES=$'SHA256SUMS:f\ncandidate.bundle:f\nmetadata.json:f'
          ACTUAL_ENTRIES="$(find "${ARTIFACT_DIR}" -mindepth 1 -maxdepth 1 -printf '%f:%y\n' | sort)"
          if [[ "${ACTUAL_ENTRIES}" != "${EXPECTED_ENTRIES}" ]]; then
            printf 'Candidate artifact contains unexpected entries:\n%s\n' "${ACTUAL_ENTRIES}" >&2
            exit 1
          fi
          (
            cd "${ARTIFACT_DIR}"
            sha256sum --check --strict SHA256SUMS
          )
          jq -e \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg repository_id "${GITHUB_REPOSITORY_ID}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg run_attempt "${PRODUCER_RUN_ATTEMPT}" \
            --arg workflow_sha "${WORKFLOW_SHA}" \
            --arg source_sha "${SOURCE_SHA}" \
            --arg release_sha "${RELEASE_SHA}" \
            --arg previous_version "${PREVIOUS_VERSION}" \
            --arg version "${VERSION}" \
            --arg release_tag "${RELEASE_TAG}" \
            --arg release_branch "${RELEASE_BRANCH}" \
            'keys == ["previous_version", "release_branch", "release_sha", "release_tag", "repository", "repository_id", "run_attempt", "run_id", "schema_version", "source_sha", "version", "workflow_sha"] and
             .schema_version == 1 and .repository == $repository and .repository_id == $repository_id and
             .run_id == $run_id and .run_attempt == $run_attempt and .workflow_sha == $workflow_sha and
             .source_sha == $source_sha and .release_sha == $release_sha and
             .previous_version == $previous_version and .version == $version and
             .release_tag == $release_tag and .release_branch == $release_branch' \
            "${ARTIFACT_DIR}/metadata.json" >/dev/null

          if [[ ! "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ || ! "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Candidate artifact requires exact full commit SHAs." >&2
            exit 1
          fi
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ || "${RELEASE_BRANCH}" != "release/${RELEASE_TAG}" ]]; then
            echo "Candidate artifact has an invalid release identity." >&2
            exit 1
          fi
          if [[ ! "${PRODUCER_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ || "${ARTIFACT_NAME}" != "cut-release-candidate-${GITHUB_RUN_ID}-${PRODUCER_RUN_ATTEMPT}" ]]; then
            echo "Candidate artifact name is not bound to its exact producer workflow attempt." >&2
            exit 1
          fi

          BUNDLE_HEADS="$(git --no-replace-objects bundle list-heads "${ARTIFACT_DIR}/candidate.bundle")"
          if [[ "${BUNDLE_HEADS}" != "${RELEASE_SHA} refs/heads/${RELEASE_BRANCH}" ]]; then
            echo "Candidate bundle does not expose exactly the expected release branch and commit." >&2
            exit 1
          fi
          git --no-replace-objects bundle verify "${ARTIFACT_DIR}/candidate.bundle"
          git --no-replace-objects fetch --no-tags "${ARTIFACT_DIR}/candidate.bundle" \
            "refs/heads/${RELEASE_BRANCH}:refs/cut-release/candidate"
          if [[ "$(git --no-replace-objects rev-parse --verify 'refs/cut-release/candidate^{commit}')" != "${RELEASE_SHA}" ]]; then
            echo "Imported candidate ref does not match the expected release commit." >&2
            exit 1
          fi
          git checkout --detach "${RELEASE_SHA}"
          if [[ "$(git --no-replace-objects rev-parse --verify 'HEAD^{commit}^')" != "${SOURCE_SHA}" ]]; then
            echo "Candidate does not have the protected source as its sole parent." >&2
            exit 1
          fi
          node .release-tooling/scripts/release-config.mjs verify-prepared-candidate \
            --repository-root "${GITHUB_WORKSPACE}" \
            --release-tag "${RELEASE_TAG}" \
            --expected-commit "${RELEASE_SHA}" \
            --publish-latest true \
            --candidate-parent-current-master true
          node .release-tooling/scripts/release-config.mjs check \
            --repository-root "${GITHUB_WORKSPACE}"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Require dedicated server release App configuration
        shell: bash
        env:
          SERVER_RELEASE_APP_ID: ${{ vars.SERVER_RELEASE_APP_ID }}
        run: |
          set -euo pipefail
          if [[ ! "${SERVER_RELEASE_APP_ID}" =~ ^[0-9]+$ ]]; then
            echo "SERVER_RELEASE_APP_ID must be configured in the protected server-release-publication environment." >&2
            exit 1
          fi

      - name: Recheck current protected master immediately before App token
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          CURRENT_MASTER_SHA="$(curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/master" |
            jq -er '.object.sha | select(test("^[0-9a-f]{40}$"))')"
          if [[ ! "${WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ || "${CURRENT_MASTER_SHA}" != "${WORKFLOW_SHA}" ]]; then
            echo "Protected master advanced before the Server Release App was admitted; start a new Cut release run." >&2
            exit 1
          fi

      - name: Mint restricted server release branch token
        id: release-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.SERVER_RELEASE_APP_ID }}
          private-key: ${{ secrets.SERVER_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Publish only the exact verified candidate branch
        shell: bash
        env:
          APP_TOKEN: ${{ steps.release-token.outputs.token }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_BRANCH: ${{ needs.prepare.outputs.release_branch }}
        run: |
          set -euo pipefail
          AUTH_HEADER="$(printf 'x-access-token:%s' "${APP_TOKEN}" | base64 | tr -d '\n')"
          readonly AUTH_HEADER
          REMOTE_MASTER="$(git -c http.extraheader="AUTHORIZATION: basic ${AUTH_HEADER}" \
            ls-remote --heads origin refs/heads/master | awk '{print $1}')"
          if [[ "${REMOTE_MASTER}" != "${SOURCE_SHA}" ]]; then
            echo "Protected master advanced before candidate publication. Rerun Cut release." >&2
            exit 1
          fi
          if [[ -n "$(git -c http.extraheader="AUTHORIZATION: basic ${AUTH_HEADER}" \
            ls-remote --tags --refs origin "refs/tags/${RELEASE_TAG}")" ]]; then
            echo "Release tag ${RELEASE_TAG} already exists." >&2
            exit 1
          fi
          REMOTE_BRANCH="$(git -c http.extraheader="AUTHORIZATION: basic ${AUTH_HEADER}" \
            ls-remote --heads origin "refs/heads/${RELEASE_BRANCH}" | awk '{print $1}')"
          if [[ -n "${REMOTE_BRANCH}" ]]; then
            if [[ "${REMOTE_BRANCH}" != "${RELEASE_SHA}" ]]; then
              echo "Release branch ${RELEASE_BRANCH} moved to ${REMOTE_BRANCH}; refusing to overwrite it." >&2
              exit 1
            fi
            echo "Release branch ${RELEASE_BRANCH} already points to the exact verified candidate."
            exit 0
          fi
          git -c http.extraheader="AUTHORIZATION: basic ${AUTH_HEADER}" push \
            --force-with-lease="refs/heads/${RELEASE_BRANCH}:" \
            origin \
            "${RELEASE_SHA}:refs/heads/${RELEASE_BRANCH}"

  release-validation:
    name: Validate release metadata and production smoke
    needs: [prepare, publish_candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: calibrate_release_ci
          POSTGRES_PASSWORD: calibrate_release_ci
          POSTGRES_DB: calibrate_release_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U calibrate_release_ci -d calibrate_release_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout exact published candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout reviewed release tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
          path: .release-tooling

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Validate exact canonical release candidate
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_BRANCH: ${{ needs.prepare.outputs.release_branch }}
        run: |
          set -euo pipefail
          test "$(git --no-replace-objects rev-parse --verify 'HEAD^{commit}')" = "${RELEASE_SHA}"
          test "$(git --no-replace-objects rev-parse --verify 'HEAD^{commit}^')" = "${SOURCE_SHA}"
          REMOTE_BRANCH="$(git --no-replace-objects ls-remote --heads origin "refs/heads/${RELEASE_BRANCH}" | awk '{print $1}')"
          if [[ "${RELEASE_BRANCH}" != "release/${RELEASE_TAG}" || "${REMOTE_BRANCH}" != "${RELEASE_SHA}" ]]; then
            echo "Release validation is not bound to the exact published candidate branch." >&2
            exit 1
          fi
          node .release-tooling/scripts/release-config.mjs verify-prepared-candidate \
            --repository-root "${GITHUB_WORKSPACE}" \
            --release-tag "${RELEASE_TAG}" \
            --expected-commit "${RELEASE_SHA}" \
            --publish-latest true \
            --candidate-parent-current-master true
          node .release-tooling/scripts/release-config.mjs check \
            --repository-root "${GITHUB_WORKSPACE}"
          test "$(node -p "require('./shared/release.json').server.version")" = "${VERSION}"
          git diff --check "${SOURCE_SHA}" "${RELEASE_SHA}"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Build production image
        run: docker build --file Dockerfile.app --tag calibrate:release-candidate .

      - name: Smoke production startup and readiness
        run: |
          docker run --detach --name calibrate-release-smoke --network host \
            --env DATABASE_URL='postgresql://calibrate_release_ci:calibrate_release_ci@127.0.0.1:5432/calibrate_release_ci?schema=public' \
            --env SESSION_SECRET='release-smoke-session-secret-at-least-32' \
            --env PUBLIC_APP_ORIGIN='http://127.0.0.1:3000' \
            --env MIGRATION_MAX_ATTEMPTS=3 \
            calibrate:release-candidate
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/v1/readyz; then
              npm run test:container:web -- http://127.0.0.1:3000
              exit 0
            fi
            sleep 1
          done
          docker logs calibrate-release-smoke
          exit 1

      - name: Remove runtime smoke container
        if: always()
        run: docker rm --force calibrate-release-smoke || true

  finalize:
    name: Merge validated release PR
    needs: [prepare, publish_candidate, release-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: server-release-publication
    permissions:
      contents: read
    outputs:
      merge_commit: ${{ steps.merge.outputs.merge_commit }}
      pull_request_url: ${{ steps.pr.outputs.pull_request_url }}

    steps:
      - name: Require current protected master workflow
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          CURRENT_MASTER_SHA="$(curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/master" |
            jq -er '.object.sha | select(test("^[0-9a-f]{40}$"))')"
          if [[ ! "${WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ || "${CURRENT_MASTER_SHA}" != "${WORKFLOW_SHA}" ]]; then
            echo "Cut finalization requires the current protected master workflow; found workflow ${WORKFLOW_SHA} and master ${CURRENT_MASTER_SHA}." >&2
            exit 1
          fi

      - name: Checkout exact release candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout reviewed release tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
          path: .release-tooling

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Reverify exact branch and candidate before authentication
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_BRANCH: ${{ needs.prepare.outputs.release_branch }}
        run: |
          set -euo pipefail
          if [[ ! "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ || ! "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Finalization requires exact full source and release commit SHAs." >&2
            exit 1
          fi
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ || "${RELEASE_BRANCH}" != "release/${RELEASE_TAG}" ]]; then
            echo "Finalization received an invalid release identity." >&2
            exit 1
          fi
          git --no-replace-objects fetch --force --no-tags origin \
            '+refs/heads/master:refs/remotes/origin/master' \
            "+refs/heads/${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}"
          if [[ "$(git --no-replace-objects rev-parse --verify 'refs/remotes/origin/master^{commit}')" != "${SOURCE_SHA}" ]]; then
            echo "Protected master advanced after release validation. Rerun Cut release." >&2
            exit 1
          fi
          if [[ "$(git --no-replace-objects rev-parse --verify "refs/remotes/origin/${RELEASE_BRANCH}^{commit}")" != "${RELEASE_SHA}" ]]; then
            echo "Release branch no longer points to the validated candidate." >&2
            exit 1
          fi
          node .release-tooling/scripts/release-config.mjs verify-prepared-candidate \
            --repository-root "${GITHUB_WORKSPACE}" \
            --release-tag "${RELEASE_TAG}" \
            --expected-commit "${RELEASE_SHA}" \
            --publish-latest true \
            --candidate-parent-current-master true
          node .release-tooling/scripts/release-config.mjs check \
            --repository-root "${GITHUB_WORKSPACE}"

      - name: Require dedicated server release App configuration
        shell: bash
        env:
          SERVER_RELEASE_APP_ID: ${{ vars.SERVER_RELEASE_APP_ID }}
        run: |
          set -euo pipefail
          if [[ ! "${SERVER_RELEASE_APP_ID}" =~ ^[0-9]+$ ]]; then
            echo "SERVER_RELEASE_APP_ID must be configured in the protected server-release-publication environment." >&2
            exit 1
          fi

      - name: Recheck current protected master immediately before App token
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          CURRENT_MASTER_SHA="$(curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/master" |
            jq -er '.object.sha | select(test("^[0-9a-f]{40}$"))')"
          if [[ ! "${WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ || "${CURRENT_MASTER_SHA}" != "${WORKFLOW_SHA}" ]]; then
            echo "Protected master advanced before the Server Release App was admitted; start a new Cut release run." >&2
            exit 1
          fi

      - name: Mint restricted server release merge token
        id: release-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.SERVER_RELEASE_APP_ID }}
          private-key: ${{ secrets.SERVER_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open or reuse the exact release pull request
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.release_tag }}
          BRANCH: ${{ needs.prepare.outputs.release_branch }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        with:
          github-token: ${{ steps.release-token.outputs.token }}
          script: |
            const { VERSION: version, TAG: tag, BRANCH: branch } = process.env;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const releaseSha = process.env.RELEASE_SHA;
            const { data: candidates } = await github.rest.pulls.list({
              owner,
              repo,
              head: owner + ':' + branch,
              base: 'master',
              state: 'all',
              per_page: 100,
            });
            const moved = candidates.find((pull) => pull.head.sha !== releaseSha && pull.state === 'open');
            if (moved) {
              throw new Error('Release branch has open PR #' + moved.number + ' at unexpected ' + moved.head.sha + '.');
            }
            const existing = candidates.find((pull) => pull.head.sha === releaseSha && pull.state === 'open');
            if (existing) {
              core.setOutput('pull_request_number', existing.number);
              core.setOutput('pull_request_url', existing.html_url);
              return;
            }
            const body = [
              '## Summary',
              '',
              `- synchronize the server and web release mirrors at ${version}`,
              `- prepare immutable source tag ${tag}`,
              '- leave Android phone and Wear release identities unchanged',
              '',
              '## Validation',
              '',
              '- exact candidate identity and synchronized release mirrors',
              '- production image build, readiness, and served-Web smoke',
              '- full tests, dependency scans, and migration checks already completed on affected pull requests',
              '',
              'Cut release validated this exact candidate before creating the PR. After merge it will publish the image and start the gated OTA rollout when the native tag is ready.',
            ].join('\n');
            const { data: pull } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: branch,
              base: 'master',
              title: `Release ${tag}`,
              body,
            });
            core.setOutput('pull_request_number', pull.number);
            core.setOutput('pull_request_url', pull.html_url);

      - name: Atomically merge the exact release pull request
        id: merge
        shell: bash
        env:
          APP_TOKEN: ${{ steps.release-token.outputs.token }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          RELEASE_BRANCH: ${{ needs.prepare.outputs.release_branch }}
          PULL_REQUEST_NUMBER: ${{ steps.pr.outputs.pull_request_number }}
        run: |
          set -euo pipefail
          AUTH_HEADER="$(printf 'x-access-token:%s' "${APP_TOKEN}" | base64 | tr -d '\n')"
          readonly AUTH_HEADER
          REMOTE_MASTER="$(git -c http.extraheader="AUTHORIZATION: basic ${AUTH_HEADER}" \
            ls-remote --heads origin refs/heads/master | awk '{print $1}')"
          REMOTE_BRANCH="$(git -c http.extraheader="AUTHORIZATION: basic ${AUTH_HEADER}" \
            ls-remote --heads origin "refs/heads/${RELEASE_BRANCH}" | awk '{print $1}')"
          if [[ "${REMOTE_MASTER}" != "${SOURCE_SHA}" || "${REMOTE_BRANCH}" != "${RELEASE_SHA}" ]]; then
            echo "Master or the release branch moved before the atomic merge. Rerun Cut release." >&2
            exit 1
          fi

          MERGE_REF="refs/remotes/origin/release-pr-${PULL_REQUEST_NUMBER}-merge"
          for attempt in {1..30}; do
            if git -c http.extraheader="AUTHORIZATION: basic ${AUTH_HEADER}" fetch --force --no-tags origin \
              "refs/pull/${PULL_REQUEST_NUMBER}/merge:${MERGE_REF}"; then
              break
            fi
            if [[ "${attempt}" -eq 30 ]]; then
              echo "GitHub did not prepare a merge commit for release PR #${PULL_REQUEST_NUMBER}." >&2
              exit 1
            fi
            sleep 2
          done

          MERGE_SHA="$(git --no-replace-objects rev-parse --verify "${MERGE_REF}^{commit}")"
          if [[ "$(git --no-replace-objects rev-parse --verify "${MERGE_SHA}^1")" != "${SOURCE_SHA}" ]]; then
            echo "Release PR base moved from validated source ${SOURCE_SHA}; rerun Cut release." >&2
            exit 1
          fi
          if [[ "$(git --no-replace-objects rev-parse --verify "${MERGE_SHA}^2")" != "${RELEASE_SHA}" ]]; then
            echo "Release PR merge head is not validated candidate ${RELEASE_SHA}." >&2
            exit 1
          fi
          if [[ "$(git --no-replace-objects rev-parse --verify "${MERGE_SHA}^{tree}")" != "$(git --no-replace-objects rev-parse --verify "${RELEASE_SHA}^{tree}")" ]]; then
            echo "Release PR merge tree differs from validated candidate ${RELEASE_SHA}." >&2
            exit 1
          fi

          git -c http.extraheader="AUTHORIZATION: basic ${AUTH_HEADER}" push \
            --force-with-lease="refs/heads/master:${SOURCE_SHA}" \
            origin \
            "${MERGE_SHA}:refs/heads/master"
          echo "merge_commit=${MERGE_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Verify exact release ancestry
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          MERGE_SHA: ${{ steps.merge.outputs.merge_commit }}
        run: |
          set -euo pipefail
          git --no-replace-objects fetch --force --no-tags origin \
            '+refs/heads/master:refs/remotes/origin/master'
          test "$(git --no-replace-objects rev-parse --verify 'refs/remotes/origin/master^{commit}')" = "${MERGE_SHA}"
          git --no-replace-objects merge-base --is-ancestor "${RELEASE_SHA}" "${MERGE_SHA}"
          test "$(git --no-replace-objects rev-parse --verify "${MERGE_SHA}^1")" = "${SOURCE_SHA}"
          test "$(git --no-replace-objects rev-parse --verify "${MERGE_SHA}^{tree}")" = \
            "$(git --no-replace-objects rev-parse --verify "${RELEASE_SHA}^{tree}")"

      - name: Summarize prepared release
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.release_tag }}
          PR_URL: ${{ steps.pr.outputs.pull_request_url }}
        run: |
          {
            echo "## Prepared ${TAG}"
            echo
            echo "- Version: \`${{ needs.prepare.outputs.previous_version }}\` -> \`${VERSION}\`"
            echo "- Source: \`${SOURCE_SHA}\`"
            echo "- Validated release commit: \`${RELEASE_SHA}\`"
            echo "- Release PR: ${PR_URL}"
            echo "- Next: tag and publish \`ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/calibratehealth:${TAG}\`; publish OTA internal when the native tag is ready"
            echo
            echo "If tag or image publishing fails, rerun Publish prepared release with commit \`${RELEASE_SHA}\` and branch \`${{ needs.prepare.outputs.release_branch }}\`. OTA resumes only when that prepared manifest already records a compatible protected native tag; otherwise use the release runbook's manual OTA path."
          } >> "${GITHUB_STEP_SUMMARY}"

  inspect_cleanup:
    name: Inspect unmerged candidate cleanup
    if: ${{ always() && needs.prepare.result == 'success' && needs.finalize.result != 'success' }}
    needs: [prepare, publish_candidate, release-validation, finalize]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      needs_write: ${{ steps.inspect.outputs.needs_write }}

    steps:
      - name: Checkout protected release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Inspect exact candidate without write credentials
        id: inspect
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_BRANCH: ${{ needs.prepare.outputs.release_branch }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ || ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ || "${RELEASE_BRANCH}" != "release/${RELEASE_TAG}" ]]; then
            echo "Candidate cleanup received an invalid release identity." >&2
            exit 1
          fi
          git --no-replace-objects fetch --force --no-tags origin \
            '+refs/heads/master:refs/remotes/origin/master'
          if git --no-replace-objects cat-file -e "${RELEASE_SHA}^{commit}" 2>/dev/null && \
            git --no-replace-objects merge-base --is-ancestor "${RELEASE_SHA}" refs/remotes/origin/master; then
            echo "Release commit is already on master; preserve it for Publish prepared release."
            echo "needs_write=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          REMOTE_SHA="$(git --no-replace-objects ls-remote --heads origin "refs/heads/${RELEASE_BRANCH}" | awk '{print $1}')"
          if [[ -n "${REMOTE_SHA}" && "${REMOTE_SHA}" != "${RELEASE_SHA}" ]]; then
            echo "Refusing cleanup because ${RELEASE_BRANCH} moved to ${REMOTE_SHA}." >&2
            exit 1
          fi
          if [[ -n "${REMOTE_SHA}" ]]; then
            echo "needs_write=true" >> "${GITHUB_OUTPUT}"
          else
            echo "needs_write=false" >> "${GITHUB_OUTPUT}"
          fi

  cleanup-candidate:
    name: Clean up exact unmerged candidate
    if: ${{ always() && needs.inspect_cleanup.result == 'success' && needs.inspect_cleanup.outputs.needs_write == 'true' }}
    needs: [prepare, inspect_cleanup]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: server-release-publication
    permissions:
      contents: read

    steps:
      - name: Require current protected master workflow
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          CURRENT_MASTER_SHA="$(curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/master" |
            jq -er '.object.sha | select(test("^[0-9a-f]{40}$"))')"
          if [[ ! "${WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ || "${CURRENT_MASTER_SHA}" != "${WORKFLOW_SHA}" ]]; then
            echo "Cut cleanup requires the current protected master workflow; found workflow ${WORKFLOW_SHA} and master ${CURRENT_MASTER_SHA}." >&2
            exit 1
          fi

      - name: Checkout protected release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Reverify exact cleanup target before authentication
        id: recheck
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_BRANCH: ${{ needs.prepare.outputs.release_branch }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ || ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ || "${RELEASE_BRANCH}" != "release/${RELEASE_TAG}" ]]; then
            echo "Candidate cleanup received an invalid release identity." >&2
            exit 1
          fi
          git --no-replace-objects fetch --force --no-tags origin \
            '+refs/heads/master:refs/remotes/origin/master'
          if git --no-replace-objects cat-file -e "${RELEASE_SHA}^{commit}" 2>/dev/null && \
            git --no-replace-objects merge-base --is-ancestor "${RELEASE_SHA}" refs/remotes/origin/master; then
            echo "Release commit is already on master; preserve it for Publish prepared release."
            echo "needs_write=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          REMOTE_SHA="$(git --no-replace-objects ls-remote --heads origin "refs/heads/${RELEASE_BRANCH}" | awk '{print $1}')"
          if [[ -z "${REMOTE_SHA}" ]]; then
            echo "Release candidate branch is already absent."
            echo "needs_write=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [[ "${REMOTE_SHA}" != "${RELEASE_SHA}" ]]; then
            echo "Refusing cleanup because ${RELEASE_BRANCH} moved to ${REMOTE_SHA}." >&2
            exit 1
          fi
          echo "needs_write=true" >> "${GITHUB_OUTPUT}"

      - name: Require dedicated server release App configuration
        if: ${{ steps.recheck.outputs.needs_write == 'true' }}
        shell: bash
        env:
          SERVER_RELEASE_APP_ID: ${{ vars.SERVER_RELEASE_APP_ID }}
        run: |
          set -euo pipefail
          if [[ ! "${SERVER_RELEASE_APP_ID}" =~ ^[0-9]+$ ]]; then
            echo "Candidate cleanup requires the protected server release App configuration." >&2
            exit 1
          fi

      - name: Recheck current protected master immediately before App token
        if: ${{ steps.recheck.outputs.needs_write == 'true' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          CURRENT_MASTER_SHA="$(curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/master" |
            jq -er '.object.sha | select(test("^[0-9a-f]{40}$"))')"
          if [[ ! "${WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ || "${CURRENT_MASTER_SHA}" != "${WORKFLOW_SHA}" ]]; then
            echo "Protected master advanced before the Server Release App was admitted; start a new Cut release run." >&2
            exit 1
          fi

      - name: Mint restricted server release cleanup token
        if: ${{ steps.recheck.outputs.needs_write == 'true' }}
        id: release-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.SERVER_RELEASE_APP_ID }}
          private-key: ${{ secrets.SERVER_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Find only the exact open candidate pull request
        if: ${{ steps.recheck.outputs.needs_write == 'true' }}
        id: candidate-pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          RELEASE_BRANCH: ${{ needs.prepare.outputs.release_branch }}
        with:
          github-token: ${{ steps.release-token.outputs.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const releaseSha = process.env.RELEASE_SHA;
            const branch = process.env.RELEASE_BRANCH;
            const { data: pulls } = await github.rest.pulls.list({
              owner,
              repo,
              head: owner + ':' + branch,
              base: 'master',
              state: 'open',
              per_page: 100,
            });
            const moved = pulls.find((pull) => pull.head.sha !== releaseSha);
            if (moved) {
              throw new Error('Open release PR #' + moved.number + ' points to unexpected ' + moved.head.sha + '.');
            }
            const exact = pulls.find((pull) => pull.head.sha === releaseSha);
            core.setOutput('pull_request_number', exact ? String(exact.number) : '');

      - name: Close only the exact abandoned candidate pull request
        if: ${{ steps.candidate-pr.outputs.pull_request_number != '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PULL_REQUEST_NUMBER: ${{ steps.candidate-pr.outputs.pull_request_number }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        with:
          github-token: ${{ steps.release-token.outputs.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = Number(process.env.PULL_REQUEST_NUMBER);
            const { data: pull } = await github.rest.pulls.get({ owner, repo, pull_number });
            if (pull.state !== 'open' || pull.head.sha !== process.env.RELEASE_SHA) {
              throw new Error('Refusing to close PR #' + pull_number + '; its state or head changed.');
            }
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pull_number,
              body: 'Cut release did not merge this exact candidate. Rerun the action from current master.',
            });
            await github.rest.pulls.update({ owner, repo, pull_number, state: 'closed' });

      - name: Delete only the exact abandoned candidate branch
        if: ${{ steps.recheck.outputs.needs_write == 'true' }}
        shell: bash
        env:
          APP_TOKEN: ${{ steps.release-token.outputs.token }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          RELEASE_BRANCH: ${{ needs.prepare.outputs.release_branch }}
        run: |
          set -euo pipefail
          AUTH_HEADER="$(printf 'x-access-token:%s' "${APP_TOKEN}" | base64 | tr -d '\n')"
          readonly AUTH_HEADER
          REMOTE_SHA="$(git -c http.extraheader="AUTHORIZATION: basic ${AUTH_HEADER}" \
            ls-remote --heads origin "refs/heads/${RELEASE_BRANCH}" | awk '{print $1}')"
          if [[ -z "${REMOTE_SHA}" ]]; then
            echo "Release candidate branch is already absent."
            exit 0
          fi
          if [[ "${REMOTE_SHA}" != "${RELEASE_SHA}" ]]; then
            echo "Refusing to delete ${RELEASE_BRANCH}; it moved to ${REMOTE_SHA}." >&2
            exit 1
          fi
          git -c http.extraheader="AUTHORIZATION: basic ${AUTH_HEADER}" push \
            --force-with-lease="refs/heads/${RELEASE_BRANCH}:${RELEASE_SHA}" \
            origin \
            ":refs/heads/${RELEASE_BRANCH}"

  publish:
    name: Tag and publish validated release
    needs: [prepare, finalize]
    permissions:
      attestations: write
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-release.yml
    with:
      release_commit: ${{ needs.prepare.outputs.release_sha }}
      release_branch: ${{ needs.prepare.outputs.release_branch }}
