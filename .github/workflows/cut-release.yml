name: Cut release

run-name: Cut ${{ inputs.bump }} release from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic server/web version component to bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write
  pull-requests: write

concurrency:
  group: cut-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare exact release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.release.outputs.source_sha }}
      release_sha: ${{ steps.release.outputs.release_sha }}
      previous_version: ${{ steps.release.outputs.previous_version }}
      version: ${{ steps.release.outputs.version }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_branch: ${{ steps.release.outputs.release_branch }}

    steps:
      - name: Require master
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/master" ]]; then
            echo "Run Cut release from master; current ref is ${GITHUB_REF}." >&2
            exit 1
          fi

      - name: Checkout exact master source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare synchronized release commit
        id: release
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          git fetch origin master --tags

          SOURCE_SHA="$(git rev-parse HEAD)"
          REMOTE_MASTER_SHA="$(git rev-parse origin/master)"
          if [[ "${SOURCE_SHA}" != "${REMOTE_MASTER_SHA}" ]]; then
            echo "master advanced from ${SOURCE_SHA} to ${REMOTE_MASTER_SHA} before preparation. Rerun Cut release." >&2
            exit 1
          fi
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Release preparation requires a clean checkout." >&2
            exit 1
          fi

          LATEST_TAG="$(git tag --list --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          if [[ -z "${LATEST_TAG}" ]]; then
            echo "Cannot prepare a release without an existing stable release tag." >&2
            exit 1
          fi
          MANIFEST_TAG="$(node scripts/release-config.mjs tag)"
          if [[ "${MANIFEST_TAG}" != "${LATEST_TAG}" ]]; then
            echo "Manifest ${MANIFEST_TAG} does not match latest release ${LATEST_TAG}. Publish or repair the pending release first." >&2
            exit 1
          fi

          VERSION="$(npm run --silent release:prepare -- --bump "${BUMP}")"
          TAG="v${VERSION}"
          BRANCH="release/${TAG}"
          if git show-ref --tags --verify --quiet "refs/tags/${TAG}"; then
            echo "Release tag ${TAG} already exists." >&2
            exit 1
          fi
          if git ls-remote --exit-code --heads origin "${BRANCH}" >/dev/null 2>&1; then
            echo "Release branch ${BRANCH} already exists. Resolve that candidate before retrying." >&2
            exit 1
          fi

          EXPECTED_FILES=(
            backend/package-lock.json
            backend/package.json
            docs/openapi/v1.yaml
            package-lock.json
            package.json
            packages/api-client/src/generated/v1.ts
            shared/client-diagnostic-versions.json
            shared/release.json
          )
          mapfile -t CHANGED_FILES < <(git diff --name-only)
          if [[ "${#CHANGED_FILES[@]}" -ne "${#EXPECTED_FILES[@]}" ]]; then
            printf 'Release preparation changed an unexpected number of files:\n%s\n' "${CHANGED_FILES[*]}" >&2
            exit 1
          fi
          for file in "${EXPECTED_FILES[@]}"; do
            if ! printf '%s\n' "${CHANGED_FILES[@]}" | grep -Fxq "${file}"; then
              echo "Release preparation did not update expected mirror ${file}." >&2
              exit 1
            fi
          done

          npm run release:check
          git diff --check
          git switch -c "${BRANCH}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${EXPECTED_FILES[@]}"
          git diff --cached --check
          git commit -m "Prepare release ${TAG}"
          RELEASE_SHA="$(git rev-parse HEAD)"
          git push --set-upstream origin "${BRANCH}"

          {
            echo "source_sha=${SOURCE_SHA}"
            echo "release_sha=${RELEASE_SHA}"
            echo "previous_version=${LATEST_TAG#v}"
            echo "version=${VERSION}"
            echo "release_tag=${TAG}"
            echo "release_branch=${BRANCH}"
          } >> "${GITHUB_OUTPUT}"

  release-validation:
    name: Validate release configuration and container gates
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact release candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install release dependencies
        run: |
          npm ci --no-audit --fund=false
          npm --prefix backend ci --no-audit --fund=false

      - name: Validate prepared release
        run: |
          test "$(git rev-parse HEAD)" = "${{ needs.prepare.outputs.release_sha }}"
          npm run release:check:container
          npm run test:release
          npm run test:expo-web:release
          npm run test:deploy
          npm run api:contract:check
          git diff --exit-code
          git diff --check

  ux-regression:
    name: Release UX Accessibility and Visual Regression
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact release candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Setup reviewed UX Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Initialize sanitized UX evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force '.codex-screenshots/expo-web-ux-results' | Out-Null
          Set-Content -LiteralPath '.codex-screenshots/expo-web-ux-results/workflow-started.json' -Encoding utf8 -Value '{"schema_version":1,"scope":"release-ux-regression"}'

      - name: Install dependencies
        run: npm.cmd ci --no-audit --fund=false

      - name: Install pinned Playwright Chromium
        run: node node_modules/@playwright/test/cli.js install chromium

      - name: Enforce accessibility and visual regression gates
        id: release_ux_gate
        run: npm.cmd run test:ux

      - name: Record sanitized release-source UX result
        if: always()
        run: >-
          node scripts/release-acceptance.mjs hosted-result
          --workflow cut-release
          --gate hosted-ux-regression
          --candidate "${{ needs.prepare.outputs.release_sha }}"
          --outcome "${{ steps.release_ux_gate.outcome }}"
          --output .codex-screenshots/expo-web-ux-results/release-acceptance.json

      - name: Upload sanitized UX evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-ux-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: .codex-screenshots/expo-web-ux-results
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  database-rollback:
    name: Release v0.14.0 Upgrade and Encrypted Rollback
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CALIBRATE_SOURCE_COMMIT: ${{ needs.prepare.outputs.release_sha }}

    steps:
      - name: Checkout exact release candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci --no-audit --fund=false

      - name: Validate rollback rehearsal helpers
        run: npm run test:db:rollback:unit

      - name: Upgrade from v0.14.0, restore, and re-upgrade
        run: npm run test:db:rollback

      - name: Upload sanitized rollback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-postgres-rollback-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: .codex-screenshots/postgres-rollback-smoke/result.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  finalize:
    name: Merge validated release PR
    needs: [prepare, release-validation, ux-regression, database-rollback]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      merge_commit: ${{ steps.merge.outputs.merge_commit }}
      pull_request_url: ${{ steps.pr.outputs.pull_request_url }}

    steps:
      - name: Checkout exact release candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          fetch-depth: 0

      - name: Refuse master drift
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          RELEASE_BRANCH: ${{ needs.prepare.outputs.release_branch }}
        run: |
          set -euo pipefail
          git fetch origin master "${RELEASE_BRANCH}"
          if [[ "$(git rev-parse origin/master)" != "${SOURCE_SHA}" ]]; then
            echo "master advanced after release validation. This candidate will not be merged; rerun Cut release." >&2
            exit 1
          fi
          if [[ "$(git rev-parse "origin/${RELEASE_BRANCH}")" != "${RELEASE_SHA}" ]]; then
            echo "Release branch ${RELEASE_BRANCH} no longer points to validated commit ${RELEASE_SHA}." >&2
            exit 1
          fi

      - name: Open release pull request
        id: pr
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9.0.0
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.release_tag }}
          BRANCH: ${{ needs.prepare.outputs.release_branch }}
        with:
          script: |
            const { VERSION: version, TAG: tag, BRANCH: branch } = process.env;
            const body = [
              '## Summary',
              '',
              `- synchronize the server and web release mirrors at ${version}`,
              `- prepare immutable source tag ${tag}`,
              '- leave Android phone and Wear release identities unchanged',
              '',
              '## Validation',
              '',
              '- container release checks and release contract tests',
              '- Expo web release and generated API contract checks',
              '- Windows UX accessibility and visual regression gate',
              '- encrypted database rollback rehearsal',
              '',
              'Cut release validated this exact candidate before creating the PR and will publish it after merge.',
            ].join('\n');
            const { data: pull } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: branch,
              base: 'master',
              title: `Release ${tag}`,
              body,
            });
            core.setOutput('pull_request_number', pull.number);
            core.setOutput('pull_request_url', pull.html_url);

      - name: Atomically merge the exact release pull request
        id: merge
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          PULL_REQUEST_NUMBER: ${{ steps.pr.outputs.pull_request_number }}
        run: |
          set -euo pipefail
          MERGE_REF="refs/remotes/origin/release-pr-${PULL_REQUEST_NUMBER}-merge"
          for attempt in {1..30}; do
            if git fetch origin "refs/pull/${PULL_REQUEST_NUMBER}/merge:${MERGE_REF}"; then
              break
            fi
            if [[ "${attempt}" -eq 30 ]]; then
              echo "GitHub did not prepare a merge commit for release PR #${PULL_REQUEST_NUMBER}." >&2
              exit 1
            fi
            sleep 2
          done

          MERGE_SHA="$(git rev-parse "${MERGE_REF}")"
          if [[ "$(git rev-parse "${MERGE_SHA}^1")" != "${SOURCE_SHA}" ]]; then
            echo "Release PR base moved from validated source ${SOURCE_SHA}; rerun Cut release." >&2
            exit 1
          fi
          if [[ "$(git rev-parse "${MERGE_SHA}^2")" != "${RELEASE_SHA}" ]]; then
            echo "Release PR merge head is not validated candidate ${RELEASE_SHA}." >&2
            exit 1
          fi
          if [[ "$(git rev-parse "${MERGE_SHA}^{tree}")" != "$(git rev-parse "${RELEASE_SHA}^{tree}")" ]]; then
            echo "Release PR merge tree differs from validated candidate ${RELEASE_SHA}." >&2
            exit 1
          fi

          git fetch origin master
          if [[ "$(git rev-parse origin/master)" != "${SOURCE_SHA}" ]]; then
            echo "master advanced before the atomic release merge; rerun Cut release." >&2
            exit 1
          fi
          if ! git push origin "${MERGE_SHA}:refs/heads/master"; then
            echo "Atomic release merge failed because master moved or repository rules rejected the exact PR merge commit." >&2
            exit 1
          fi
          echo "merge_commit=${MERGE_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Verify exact release ancestry
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          MERGE_SHA: ${{ steps.merge.outputs.merge_commit }}
        run: |
          set -euo pipefail
          git fetch origin master
          git merge-base --is-ancestor "${RELEASE_SHA}" origin/master
          git merge-base --is-ancestor "${MERGE_SHA}" origin/master
          if [[ "$(git rev-parse "${MERGE_SHA}^1")" != "${SOURCE_SHA}" ]]; then
            echo "Release PR merged after master advanced; refusing to publish an unvalidated merge." >&2
            exit 1
          fi
          if [[ "$(git rev-parse "${MERGE_SHA}^{tree}")" != "$(git rev-parse "${RELEASE_SHA}^{tree}")" ]]; then
            echo "Merged release tree differs from validated candidate ${RELEASE_SHA}." >&2
            exit 1
          fi

      - name: Summarize prepared release
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.release_tag }}
          PR_URL: ${{ steps.pr.outputs.pull_request_url }}
        run: |
          {
            echo "## Prepared ${TAG}"
            echo
            echo "- Version: \`${{ needs.prepare.outputs.previous_version }}\` -> \`${VERSION}\`"
            echo "- Source: \`${SOURCE_SHA}\`"
            echo "- Validated release commit: \`${RELEASE_SHA}\`"
            echo "- Release PR: ${PR_URL}"
            echo "- Next: tag and publish \`ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/calibratehealth:${TAG}\`"
            echo
            echo "If publishing fails, rerun Publish prepared release with commit \`${RELEASE_SHA}\` and branch \`${{ needs.prepare.outputs.release_branch }}\`."
          } >> "${GITHUB_STEP_SUMMARY}"

  cleanup-candidate:
    name: Clean up unmerged candidate
    if: ${{ always() && needs.prepare.result == 'success' && needs.finalize.result != 'success' }}
    needs: [prepare, release-validation, ux-regression, database-rollback, finalize]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0

      - name: Delete only an abandoned action-owned branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          RELEASE_BRANCH: ${{ needs.prepare.outputs.release_branch }}
        run: |
          set -euo pipefail
          git fetch origin master
          if git merge-base --is-ancestor "${RELEASE_SHA}" origin/master; then
            echo "Release commit is already on master; preserve it for Publish prepared release."
            exit 0
          fi
          OPEN_PR_NUMBER="$(gh pr list --state open --base master --head "${RELEASE_BRANCH}" --json number,headRefOid --jq ".[] | select(.headRefOid == \"${RELEASE_SHA}\") | .number" | head -n 1)"
          if [[ -n "${OPEN_PR_NUMBER}" ]]; then
            gh pr close "${OPEN_PR_NUMBER}" --comment "Cut release did not merge this exact candidate. Rerun the action from current master."
          fi
          REMOTE_SHA="$(git ls-remote origin "refs/heads/${RELEASE_BRANCH}" | awk '{print $1}')"
          if [[ -z "${REMOTE_SHA}" ]]; then
            echo "Release candidate branch is already absent."
            exit 0
          fi
          if [[ "${REMOTE_SHA}" != "${RELEASE_SHA}" ]]; then
            echo "Refusing to delete ${RELEASE_BRANCH}; it moved from action-owned commit ${RELEASE_SHA} to ${REMOTE_SHA}." >&2
            exit 1
          fi
          git push origin --delete "${RELEASE_BRANCH}"

  publish:
    name: Tag and publish validated release
    needs: [prepare, finalize]
    uses: ./.github/workflows/publish-release.yml
    with:
      release_commit: ${{ needs.prepare.outputs.release_sha }}
      release_branch: ${{ needs.prepare.outputs.release_branch }}