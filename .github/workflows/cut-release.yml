name: Publish Manifest Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-manifest-release
  cancel-in-progress: false

jobs:
  ux-regression:
    name: Release UX Accessibility and Visual Regression
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup reviewed UX Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Initialize sanitized UX evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force '.codex-screenshots/expo-web-ux-results' | Out-Null
          Set-Content -LiteralPath '.codex-screenshots/expo-web-ux-results/workflow-started.json' -Encoding utf8 -Value '{"schema_version":1,"scope":"release-ux-regression"}'

      - name: Install dependencies
        run: npm.cmd ci --no-audit --fund=false

      - name: Install pinned Playwright Chromium
        run: node node_modules/@playwright/test/cli.js install chromium

      - name: Enforce accessibility and visual regression gates
        id: release_ux_gate
        run: npm.cmd run test:ux

      - name: Record sanitized release-source UX result
        if: always()
        run: >-
          node scripts/release-acceptance.mjs hosted-result
          --gate hosted-ux-regression
          --candidate "${{ github.sha }}"
          --outcome "${{ steps.release_ux_gate.outcome }}"
          --output .codex-screenshots/expo-web-ux-results/release-acceptance.json

      - name: Upload sanitized UX evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-ux-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: .codex-screenshots/expo-web-ux-results
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  database-rollback:
    name: Release v0.14.0 Upgrade and Encrypted Rollback
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CALIBRATE_SOURCE_COMMIT: ${{ github.sha }}

    steps:
      - name: Checkout full release history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci --no-audit --fund=false

      - name: Validate rollback rehearsal helpers
        run: npm run test:db:rollback:unit

      - name: Upgrade from v0.14.0, restore, and re-upgrade
        run: npm run test:db:rollback

      - name: Upload sanitized rollback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-postgres-rollback-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: .codex-screenshots/postgres-rollback-smoke/result.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: [ux-regression, database-rollback]
    name: Tag Validated Manifest Version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      release_tag: ${{ steps.version.outputs.new_tag }}

    steps:
      - name: Require master
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/master" ]]; then
            echo "This workflow publishes only from master; current ref is ${GITHUB_REF}." >&2
            exit 1
          fi

      - name: Checkout full release history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Plan manifest release
        id: version
        shell: bash
        run: |
          set -euo pipefail
          LATEST_TAG="$(git tag --list --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          if [[ -n "${LATEST_TAG}" ]]; then
            node scripts/release-config.mjs plan --latest-tag "${LATEST_TAG}" >> "$GITHUB_OUTPUT"
          else
            node scripts/release-config.mjs plan >> "$GITHUB_OUTPUT"
          fi

      - name: Validate container release
        if: steps.version.outputs.should_release == 'true'
        run: |
          npm run release:check:container
          npm run test:release
          npm run test:expo-web:release
          npm run test:deploy

      - name: Configure release tag identity
        if: steps.version.outputs.should_release == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push release tag
        if: steps.version.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          NEW_TAG="${{ steps.version.outputs.new_tag }}"
          if git show-ref --tags --verify --quiet "refs/tags/${NEW_TAG}"; then
            echo "Tag ${NEW_TAG} already exists." >&2
            exit 1
          fi
          git tag -a "${NEW_TAG}" -m "Release ${NEW_TAG}" "${GITHUB_SHA}"
          git push origin "${NEW_TAG}"

      - name: Report no-op release check
        if: steps.version.outputs.should_release != 'true'
        run: echo "No release published because ${{ steps.version.outputs.new_tag }} is already the latest manifest release."

  build_release_image:
    name: Build Validated Release Image
    needs: publish
    if: needs.publish.outputs.should_release == 'true'
    uses: ./.github/workflows/container.yml
    with:
      release_tag: ${{ needs.publish.outputs.release_tag }}
      publish_latest: true
