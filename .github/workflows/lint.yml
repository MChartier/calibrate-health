name: Lint

on:
  pull_request:
    paths:
      - '.github/workflows/lint.yml'
      - 'backend/**'
      - 'knip.json'
      - 'mobile/**'
      - 'package.json'
      - 'package-lock.json'
      - 'packages/**'
      - 'scripts/**'
      - 'shared/**'

permissions:
  contents: read

concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Backend, Shared, API Client, and Mobile Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install workspace deps
        run: npm ci --no-audit --fund=false

      - name: Install backend deps
        run: npm ci --prefix backend --no-audit --fund=false

      - name: Type-check all TypeScript surfaces
        run: npm run lint

      - name: Check for dead code
        run: npm run test:dead-code
