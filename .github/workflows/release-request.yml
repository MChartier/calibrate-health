name: Release request
on:
  workflow_dispatch:
    inputs:
      request: { description: 'Prepared expo-release request JSON', required: true, type: string }
permissions: { contents: read }
jobs:
  request:
    uses: MChartier/expo-release-template/.github/workflows/release-request.yml@8ee459cadf0eaacea913e0ea5e42b67a9845144c
    with: { request: '${{ inputs.request }}' }
