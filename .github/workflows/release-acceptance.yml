# Read-only exact-source application release contract; dependency audits use maintenance.
name: Optional Release Confidence
on:
  workflow_dispatch:
    inputs:
      candidate_commit: { description: Exact commit to inspect, required: true, type: string }
permissions: { contents: read }
jobs:
  contract:
    uses: MChartier/expo-release-template/.github/workflows/release-contract.yml@1303156faa526fc5c51b8863c56a7c25bf00ab3e
    with:
      source_sha: ${{ inputs.candidate_commit }}
    permissions: { contents: read }
