openapi: 3.1.0
info:
  title: Calibrate API
  version: 1.0.0
  description: Stable wire contract shared by the self-hosted web, Android, and future Wear OS clients.
servers:
  - url: /
paths:
  /api/v1/client-config:
    get:
      operationId: getClientConfig
      security: []
      responses:
        '200':
          description: Server compatibility and capability document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientConfigResponse'
  /api/v1/calorie-plan/options:
    post:
      operationId: getCaloriePlanOptions
      description: Evaluate all calorie-plan choices for a display-unit draft without persisting it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CaloriePlanOptionsRequest' }
      responses:
        '200':
          description: Eligibility, calorie estimates, safety floor, and all nine signed options.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaloriePlanOptionsResponse' }
        '400':
          description: Invalid draft shape.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/onboarding/complete:
    post:
      operationId: completeOnboarding
      description: Atomically persist onboarding data and replay the exact durable receipt for the same operation ID.
      parameters:
        - $ref: '#/components/parameters/RequiredClientOperationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OnboardingCompleteRequest' }
      responses:
        '200':
          description: Durable completion receipt and current authenticated user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardingCompleteResponse' }
        '400':
          description: Invalid or incomplete onboarding data.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Completed setup, operation reuse, or operation in progress.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/user/profile:
    get:
      operationId: getUserProfile
      responses:
        '200':
          description: Current profile and fail-closed calorie-planning summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfileResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      operationId: updateUserProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserProfileUpdateRequest' }
      responses:
        '200':
          description: Updated profile values.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/UserClientPayload' }
        '400':
          description: Invalid profile field or unsafe date-of-birth value.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/goals:
    get:
      operationId: getGoal
      responses:
        '200':
          description: Latest goal with additive calorie-plan and projection status, or null when absent.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/GoalEntry' }
                  - type: 'null'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createGoal
      parameters:
        - $ref: '#/components/parameters/ClientOperationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoalCreateRequest' }
      responses:
        '200':
          description: Newly appended safe goal.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GoalEntry' }
        '400':
          description: Profile data, weights, direction, or selected calorie option is invalid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Operation-id conflict.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /auth/register:
    post:
      operationId: registerBrowser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BrowserRegistrationRequest' }
      responses:
        '200':
          description: Registered browser session with email verification required.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrowserAuthResponse' }
        '400':
          description: Invalid credentials or missing/current legal acceptance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '503':
          description: Hosted registration is unavailable because email delivery is not configured.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /auth/email-verification/resend:
    post:
      operationId: resendEmailVerification
      security: []
      description: Always returns a generic response to avoid disclosing whether an account exists.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailVerificationResendRequest' }
      responses:
        '202':
          description: A verification message will be sent when an eligible account exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '429':
          description: Verification resend rate limit reached.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /auth/email-verification/confirm:
    post:
      operationId: confirmEmailVerification
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenConfirmRequest' }
      responses:
        '200':
          description: The single-use verification token was accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailVerificationConfirmResponse' }
        '400':
          description: Token is invalid, expired, already used, or bound to another purpose.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      security: []
      description: Always returns a generic response to avoid disclosing whether an account exists.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequest' }
      responses:
        '202':
          description: Reset instructions will be sent when an eligible account exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '429':
          description: Password reset request rate limit reached.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetConfirmRequest' }
      responses:
        '200':
          description: Password changed and all browser, Android, and Wear sessions revoked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '400':
          description: Token or replacement password is invalid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/legal/status:
    get:
      operationId: getLegalStatus
      responses:
        '200':
          description: Required and accepted legal versions plus the effective account-access state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegalAcceptanceStatus' }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/legal/acceptance:
    post:
      operationId: acceptLegalDocuments
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LegalAcceptanceRequest' }
      responses:
        '200':
          description: Current legal documents were accepted and account access was recalculated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegalAcceptanceStatus' }
        '400':
          description: Submitted versions do not match the currently required documents.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/mobile/login:
    post:
      operationId: loginMobile
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileAuthRequest'
      responses:
        '200':
          description: Authenticated native session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileAuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/mobile/register:
    post:
      operationId: registerMobile
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileRegistrationRequest'
      responses:
        '200':
          description: Registered Android phone session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileAuthResponse'
        '400':
          description: Invalid registration or Android phone device metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '503':
          description: Hosted registration is unavailable because email delivery is not configured.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /auth/mobile/refresh:
    post:
      operationId: refreshMobile
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Rotated native session credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileRefreshResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/mobile/sessions:
    get:
      operationId: listMobileSessions
      responses:
        '200':
          description: Active native sessions owned by the account.
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/MobileSessionSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/mobile/wear/pairing-credential:
    post:
      operationId: issueWearPairingCredential
      description: Issue a short-lived one-time credential from the current Android phone session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WearPairingCredentialRequest'
      responses:
        '201':
          description: Credential and exact self-hosted server origin to transfer to the paired watch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WearPairingCredentialResponse'
        '400':
          description: Invalid server origin, watch identity, protocol, or public key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is not an active Android phone session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /auth/mobile/wear/pair:
    post:
      operationId: exchangeWearPairingCredential
      security: []
      description: Consume a server-bound one-time credential and create a revocable Wear OS session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WearPairingExchangeRequest'
      responses:
        '200':
          description: Authenticated Wear OS session credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WearMobileAuthResponse'
        '400':
          description: Invalid exchange payload.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401':
          description: Credential or challenge signature is invalid, or the issuing phone session is inactive.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: Credential was already used, its binding differs, or a same-exchange UUID retry within the credential TTL revoked the orphaned session and requires fresh pairing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '410':
          description: Credential expired.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/watch:
    get:
      operationId: getWatchSnapshot
      description: Return one bounded account-local snapshot for the authenticated Wear OS session.
      responses:
        '200':
          description: Current watch snapshot. The weak ETag tracks semantic snapshot revisions.
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WatchSnapshot' }
        '304':
          description: Snapshot semantics are unchanged for the supplied If-None-Match value.
        '403':
          description: Caller is not an authenticated Wear OS session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: Account no longer exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: The stored account timezone is missing or invalid, so local-day data cannot be read safely.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '500':
          description: Snapshot generation failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/food-days:
    get:
      operationId: getFoodLogDay
      parameters:
        - in: query
          name: date
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Effective resolution for one account-local food day.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FoodLogDay' }
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      operationId: setFoodLogDayStatus
      parameters:
        - in: header
          name: X-Client-Operation-Id
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [date, status]
                  properties:
                    date: { type: string, format: date }
                    status: { type: string, enum: [OPEN, COMPLETE, INCOMPLETE] }
                - type: object
                  description: Legacy completion mutation retained for queued clients.
                  required: [date, is_complete]
                  properties:
                    date: { type: string, format: date }
                    is_complete: { type: boolean }
      responses:
        '200':
          description: Stored day resolution.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FoodLogDay' }
  /api/v1/food-days/range:
    get:
      operationId: getFoodLogDayRange
      parameters:
        - in: query
          name: start
          required: true
          schema: { type: string, format: date }
        - in: query
          name: end
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Inclusive bounded effective day resolutions.
          content:
            application/json:
              schema:
                type: object
                required: [start_date, end_date, days]
                properties:
                  start_date: { type: string, format: date }
                  end_date: { type: string, format: date }
                  days:
                    type: array
                    maxItems: 366
                    items: { $ref: '#/components/schemas/FoodLogDay' }
  /api/v1/food-days/pause:
    get:
      operationId: getFoodTrackingPause
      responses:
        '200':
          description: Current pause state and foreground confirmation status.
          content:
            application/json:
              schema:
                type: object
                required: [pause]
                properties:
                  pause: { $ref: '#/components/schemas/FoodTrackingPause' }
    post:
      operationId: startFoodTrackingPause
      parameters:
        - in: header
          name: X-Client-Operation-Id
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [starts_on, expected_resume_on]
              properties:
                starts_on: { type: string, format: date }
                expected_resume_on: { type: [string, 'null'], format: date }
      responses:
        '201':
          description: Tracking pause started.
          content:
            application/json:
              schema:
                type: object
                required: [pause]
                properties:
                  pause: { $ref: '#/components/schemas/FoodTrackingPause' }
    patch:
      operationId: updateFoodTrackingPause
      parameters:
        - in: header
          name: X-Client-Operation-Id
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_resume_on]
              properties:
                expected_resume_on: { type: [string, 'null'], format: date }
      responses:
        '200':
          description: Expected resume date updated without resuming.
          content:
            application/json:
              schema:
                type: object
                required: [pause]
                properties:
                  pause: { $ref: '#/components/schemas/FoodTrackingPause' }
  /api/v1/food-days/resume:
    post:
      operationId: resumeFoodTracking
      parameters:
        - in: header
          name: X-Client-Operation-Id
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resumed_on]
              properties:
                resumed_on: { type: string, format: date }
      responses:
        '200':
          description: Pause closed and resume day reopened.
          content:
            application/json:
              schema:
                type: object
                required: [pause, day]
                properties:
                  pause: { $ref: '#/components/schemas/FoodTrackingPause' }
                  day: { $ref: '#/components/schemas/FoodLogDay' }
  /api/v1/user/tracking-history:
    get:
      operationId: getTrackingHistory
      responses:
        '200':
          description: Earliest account or imported tracking date.
          content:
            application/json:
              schema:
                type: object
                required: [tracking_start_date]
                properties:
                  tracking_start_date: { type: string, format: date }
        '404':
          description: Account no longer exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '500':
          description: Tracking history lookup failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/watch/mutations:
    post:
      operationId: executeWatchMutation
      description: Execute and exactly replay one restricted Wear mutation.
      parameters:
        - in: header
          name: x-client-operation-id
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WatchMutationRequest' }
      responses:
        '200':
          description: Mutation result or exact replay of its committed result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WatchMutationResponse' }
        '400':
          description: Invalid operation ID or mutation payload.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '403':
          description: Caller is not an authenticated Wear OS session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: Operation conflict or current-session undo restriction.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: Referenced My Food or entity no longer exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '500':
          description: Mutation execution failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/food/copy:
    post:
      operationId: copyFoodLogs
      description: Atomically copy owned immutable food-log snapshots to another local date, with exact operation replay.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FoodLogCopyRequest' }
      responses:
        '200':
          description: Copy result or exact replay of its committed result. An empty source is a successful zero-count result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FoodLogCopyResponse' }
        '400':
          description: Invalid operation ID, local date, timezone, or meal mapping.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The target day is not open, or the operation is in progress or reused for another payload.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '500':
          description: Copy transaction failed without committing target entries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/food/{foodLogId}:
    delete:
      operationId: deleteFoodLog
      parameters:
        - $ref: '#/components/parameters/FoodLogId'
        - $ref: '#/components/parameters/ClientOperationId'
      responses:
        '204':
          description: Food log deleted; response has no body.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/metrics:
    get:
      operationId: listMetrics
      description: >-
        List account-local body metrics. With include_trend=true, returns the
        forward-only weight-trend model and an as-of-scoped v2 summary. The 95%
        bounds describe uncertainty in underlying weight, not the expected range
        of the next scale reading.
      parameters:
        - name: start
          in: query
          schema: { type: string, format: date }
        - name: end
          in: query
          description: An explicit historical end date also scopes trend fitting and freshness.
          schema: { type: string, format: date }
        - name: range
          in: query
          schema: { type: string, enum: [week, month, year, all] }
        - name: include_trend
          in: query
          schema: { type: boolean, default: false }
        - name: smoothing
          in: query
          description: Legacy rolling-average window used only when include_trend is false.
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Newest-first measurements or a trend-augmented response in the account weight unit.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { $ref: '#/components/schemas/MetricEntry' }
                  - $ref: '#/components/schemas/TrendMetricsResponse'
        '400':
          description: Invalid range, date, smoothing, or trend option.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: addMetric
      description: Upsert one account-local body metric and optionally return a transactional weight-progress receipt.
      parameters:
        - $ref: '#/components/parameters/ClientOperationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
                - type: object
                  required: [weight]
                  properties:
                    date: { type: string, format: date }
                    weight: { type: number, exclusiveMinimum: 0 }
                    body_fat_percent: { type: [number, 'null'], minimum: 0, maximum: 100 }
                - type: object
                  required: [body_fat_percent]
                  properties:
                    date: { type: string, format: date }
                    weight: { type: number, exclusiveMinimum: 0 }
                    body_fat_percent: { type: [number, 'null'], minimum: 0, maximum: 100 }
      responses:
        '200':
          description: Saved metric. Weight writes from newer servers include progress_update; older servers omit it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricSaveResponse' }
        '400':
          description: Invalid date, weight, body-fat value, operation ID, or empty update.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The client operation is still running or was reused for another payload.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/metrics/{metricId}:
    delete:
      operationId: deleteMetric
      parameters:
        - $ref: '#/components/parameters/MetricId'
        - $ref: '#/components/parameters/ClientOperationId'
      responses:
        '204':
          description: Weight metric deleted; response has no body.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/sync/changes:
    get:
      operationId: getSyncChanges
      parameters:
        - name: after
          in: query
          schema:
            type: string
            pattern: '^\d+$'
            default: '0'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
      responses:
        '200':
          description: Ordered account changes after the supplied cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncChangesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/activity/days:
    get:
      operationId: getActivityDays
      parameters:
        - name: start
          in: query
          schema: { type: string, format: date }
        - name: end
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Observational Health Connect summaries and provenance records grouped by account-local day.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityDaysResponse'
        '400':
          description: Invalid or excessive local-date range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/activity/health-connect/sync:
    post:
      operationId: syncHealthConnect
      description: Atomically reconcile one record-type change page and advance its trusted mobile-device checkpoint.
      parameters:
        - name: x-client-operation-id
          in: header
          required: true
          description: Stable client-generated identifier used to safely replay this sync page.
          schema:
            type: string
            minLength: 8
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HealthConnectSyncRequest'
      responses:
        '200':
          description: Source changes, summaries, and next checkpoint committed together.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthConnectSyncResponse'
        '400':
          description: Invalid Health Connect change page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: A bearer-authenticated Android installation is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Operation-id or Health Connect checkpoint conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/calibration/status:
    get:
      operationId: getCalibrationStatus
      description: Lazily evaluate bounded food and weight history and materialize any current actionable suggestion.
      responses:
        '200':
          description: Current deterministic calibration status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalibrationStatusResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/calibration/recommendations/{recommendationId}/apply:
    post:
      operationId: applyCalibrationRecommendation
      description: Revalidate and accept a current recommendation as a next-local-day target revision.
      parameters:
        - name: recommendationId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - $ref: '#/components/parameters/ClientOperationId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '200':
          description: Accepted target revision and its effective local date.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduledCalibrationChange' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Recommendation is stale, already applied, or conflicts with another operation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/calibration/recommendations/{recommendationId}/cancel:
    post:
      operationId: cancelCalibrationRecommendation
      description: Cancel a calibration revision before its effective local date and restore the recommendation for review.
      parameters:
        - name: recommendationId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - $ref: '#/components/parameters/ClientOperationId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '200':
          description: Current calibration status after the scheduled revision is canceled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalibrationStatusResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The revision is no longer scheduled, has already started, or conflicts with another operation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/user/account/export:
    get:
      operationId: exportAccount
      responses:
        '200':
          description: Canonical versioned export of user-authored account and tracking data.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountExport'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/user/account:
    delete:
      operationId: deleteAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password]
              properties:
                current_password:
                  type: string
                  minLength: 1
      responses:
        '204':
          description: Account, sessions, and all user-owned data were deleted.
        '400':
          description: Current password is missing or incorrect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    mobileBearer:
      type: http
      scheme: bearer
  parameters:
    FoodLogId:
      name: foodLogId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    MetricId:
      name: metricId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ClientOperationId:
      name: x-client-operation-id
      in: header
      required: false
      description: Stable client-generated identifier used to safely replay a mutation.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    RequiredClientOperationId:
      name: x-client-operation-id
      in: header
      required: true
      description: Stable client-generated identifier required to replay an atomic mutation safely.
      schema:
        type: string
        minLength: 8
        maxLength: 128
  responses:
    Unauthorized:
      description: Authentication is missing, expired, or rejected.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    EligibilityStatus:
      type: string
      enum: [unknown, eligible, invalid]
    CaloriePlanStatus:
      type: string
      enum: [unavailable, available, requires_review]
    CaloriePlanReasonCode:
      type: string
      enum:
        - DATE_OF_BIRTH_REQUIRED
        - DATE_OF_BIRTH_INVALID
        - DATE_OF_BIRTH_IN_FUTURE
        - AGE_OVER_120
        - TIMEZONE_INVALID
        - SEX_REQUIRED
        - ACTIVITY_LEVEL_REQUIRED
        - HEIGHT_REQUIRED
        - HEIGHT_OUT_OF_RANGE
        - LATEST_WEIGHT_REQUIRED
        - WEIGHT_OUT_OF_RANGE
        - GOAL_REQUIRED
        - GOAL_WEIGHTS_OUT_OF_RANGE
        - GOAL_DIRECTION_INVALID
        - DAILY_DEFICIT_INVALID
        - TARGET_BELOW_MINIMUM
        - PLAN_REVISION_UNSAFE
        - HISTORICAL_PLAN_REQUIRES_REVIEW
        - SERVER_POLICY_UNAVAILABLE
    CalorieEligibility:
      type: object
      additionalProperties: false
      required: [status, reasonCode, ageYears, localDate]
      properties:
        status: { $ref: '#/components/schemas/EligibilityStatus' }
        reasonCode:
          oneOf: [{ $ref: '#/components/schemas/CaloriePlanReasonCode' }, { type: 'null' }]
        ageYears: { type: [integer, 'null'], minimum: 0 }
        localDate: { type: [string, 'null'], format: date }
    CaloriePlanOption:
      type: object
      additionalProperties: false
      required: [dailyDeficit, available, dailyCalorieTarget, reasonCode]
      properties:
        dailyDeficit: { type: integer, enum: [-1000, -750, -500, -250, 0, 250, 500, 750, 1000] }
        available: { type: boolean }
        dailyCalorieTarget: { type: [integer, 'null'], minimum: 1000 }
        reasonCode:
          oneOf: [{ $ref: '#/components/schemas/CaloriePlanReasonCode' }, { type: 'null' }]
    CaloriePlanOptionsRequest:
      type: object
      additionalProperties: false
      required: [timezone, date_of_birth, sex, activity_level, height, weight]
      properties:
        timezone: { type: string }
        date_of_birth: { type: [string, 'null'], format: date }
        sex: { type: [string, 'null'], enum: [MALE, FEMALE, null] }
        activity_level: { type: [string, 'null'], enum: [SEDENTARY, LIGHT, MODERATE, ACTIVE, VERY_ACTIVE, null] }
        height:
          oneOf:
            - type: object
              additionalProperties: false
              required: [unit, centimeters]
              properties:
                unit: { type: string, const: CM }
                centimeters: { type: number }
            - type: object
              additionalProperties: false
              required: [unit, feet, inches]
              properties:
                unit: { type: string, const: FT_IN }
                feet: { type: number }
                inches: { type: number }
        weight:
          type: object
          additionalProperties: false
          required: [unit, value]
          properties:
            unit: { type: string, enum: [KG, LB] }
            value: { type: number }
    CaloriePlanOptionsResponse:
      type: object
      additionalProperties: false
      required: [eligibility, bmr, tdee, minimumDailyCalorieTarget, planOptions]
      properties:
        eligibility: { $ref: '#/components/schemas/CalorieEligibility' }
        bmr: { type: [number, 'null'] }
        tdee: { type: [number, 'null'] }
        minimumDailyCalorieTarget: { type: [integer, 'null'], minimum: 1000 }
        planOptions:
          type: array
          minItems: 9
          maxItems: 9
          items: { $ref: '#/components/schemas/CaloriePlanOption' }
    UserProfile:
      type: object
      required: [timezone, date_of_birth, sex, height_mm, activity_level, weight_unit, height_unit]
      properties:
        timezone: { type: string }
        date_of_birth: { type: [string, 'null'], format: date }
        sex: { type: [string, 'null'], enum: [MALE, FEMALE, null] }
        height_mm: { type: [integer, 'null'] }
        activity_level: { type: [string, 'null'], enum: [SEDENTARY, LIGHT, MODERATE, ACTIVE, VERY_ACTIVE, null] }
        weight_unit: { type: string, enum: [KG, LB] }
        height_unit: { type: string, enum: [CM, FT_IN] }
    CalorieSummary:
      type: object
      required: [missing, eligibility, planStatus, planReasonCode, planOptions, minimumDailyCalorieTarget]
      properties:
        baseDailyCalorieTarget: { type: integer }
        dailyCalorieTarget: { type: integer }
        tdee: { type: number }
        bmr: { type: number }
        deficit: { type: [integer, 'null'] }
        targetAdjustment: { type: integer }
        sourceWeightKg: { type: number }
        missing: { type: array, items: { type: string } }
        eligibility: { $ref: '#/components/schemas/CalorieEligibility' }
        planStatus: { $ref: '#/components/schemas/CaloriePlanStatus' }
        planReasonCode:
          oneOf: [{ $ref: '#/components/schemas/CaloriePlanReasonCode' }, { type: 'null' }]
        planOptions: { type: array, items: { $ref: '#/components/schemas/CaloriePlanOption' } }
        minimumDailyCalorieTarget: { type: [integer, 'null'], minimum: 1000 }
    UserProfileResponse:
      type: object
      required: [profile, latest_weight_grams, goal_daily_deficit, calorie_target_adjustment, calorieSummary]
      properties:
        profile: { $ref: '#/components/schemas/UserProfile' }
        latest_weight_grams: { type: [integer, 'null'] }
        goal_daily_deficit: { type: [integer, 'null'] }
        calorie_target_adjustment: { type: integer }
        calorieSummary: { $ref: '#/components/schemas/CalorieSummary' }
    UserProfileUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        timezone: { type: [string, 'null'] }
        date_of_birth: { type: [string, 'null'], format: date }
        sex: { type: [string, 'null'], enum: [MALE, FEMALE, null] }
        height_mm: { type: [number, string, 'null'] }
        height_cm: { type: [number, string, 'null'] }
        height_feet: { type: [number, string, 'null'] }
        height_inches: { type: [number, string, 'null'] }
        activity_level: { type: [string, 'null'], enum: [SEDENTARY, LIGHT, MODERATE, ACTIVE, VERY_ACTIVE, null] }
    GoalProjection:
      type: object
      additionalProperties: false
      required: [status, projected_end_date, reason_code]
      properties:
        status: { type: string, enum: [projected, maintenance, reached, unavailable] }
        projected_end_date: { type: [string, 'null'], format: date }
        reason_code:
          oneOf: [{ $ref: '#/components/schemas/CaloriePlanReasonCode' }, { type: 'null' }]
    GoalEntry:
      type: object
      required: [id, user_id, start_weight, target_weight, target_date, daily_deficit, calorie_plan_review_status, calorie_plan_review_reason, created_at, plan_status, plan_reason_code, projection]
      properties:
        id: { type: integer }
        user_id: { type: integer }
        start_weight: { type: number }
        target_weight: { type: number }
        target_date: { type: [string, 'null'], format: date-time }
        daily_deficit: { type: integer }
        calorie_plan_review_status: { type: string, enum: [CLEAR, REQUIRES_REVIEW] }
        calorie_plan_review_reason: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        plan_status: { $ref: '#/components/schemas/CaloriePlanStatus' }
        plan_reason_code:
          oneOf: [{ $ref: '#/components/schemas/CaloriePlanReasonCode' }, { type: 'null' }]
        projection: { $ref: '#/components/schemas/GoalProjection' }
    GoalCreateRequest:
      type: object
      additionalProperties: false
      required: [start_weight, target_weight, daily_deficit]
      properties:
        start_weight: { type: number }
        target_weight: { type: number }
        target_date: { type: [string, 'null'], format: date-time }
        daily_deficit: { type: integer, enum: [-1000, -750, -500, -250, 0, 250, 500, 750, 1000] }
    MetricEntry:
      type: object
      required: [id, date, weight]
      properties:
        id: { type: integer }
        user_id: { type: integer }
        date: { type: string, format: date-time }
        weight: { type: number, exclusiveMinimum: 0 }
        body_fat_percent: { type: [number, 'null'] }
    TrendMetricEntry:
      allOf:
        - $ref: '#/components/schemas/MetricEntry'
        - type: object
          required: [user_id, body_fat_percent, trend_weight, trend_ci_lower, trend_ci_upper, trend_std]
          properties:
            trend_is_materialized:
              type: boolean
              description: False for raw context outside the recent modeled window.
            trend_segment_start:
              type: boolean
              description: True where a new independent trend segment begins.
            trend_weight: { type: number }
            trend_ci_lower: { type: number }
            trend_ci_upper: { type: number }
            trend_std: { type: number, minimum: 0 }
    WeightTrendLatestEstimate:
      type: object
      required: [weight, lower, upper]
      properties:
        weight: { type: number }
        lower: { type: number }
        upper: { type: number }
    WeightTrendWeeklyRate:
      type: object
      description: Latest local-velocity state estimate and its model uncertainty, scaled to the user's display unit per week.
      required: [estimate, std, lower, upper, point_count, span_days, evidence, interval_kind]
      properties:
        estimate: { type: number }
        std: { type: number, minimum: 0 }
        lower: { type: number }
        upper: { type: number }
        point_count: { type: integer, minimum: 0 }
        span_days: { type: number, minimum: 0 }
        evidence: { type: string, enum: [insufficient, provisional, sufficient] }
        interval_kind:
          type: string
          const: local_velocity_state_model_uncertainty
    WeightTrendReadingVariation:
      type: object
      description: Robust short-term scale-reading variation, separate from the graphed trend interval.
      required: [standard_deviation, central_80_half_width]
      properties:
        standard_deviation: { type: number, minimum: 0 }
        central_80_half_width: { type: number, minimum: 0 }
    WeightTrendSummary:
      type: object
      required:
        - model_version
        - as_of_date
        - scope_start_date
        - scope_end_date
        - latest_observation_date
        - days_since_latest
        - modeled_points
        - modeled_observations
        - returned_modeled_points
        - modeled_start_date
        - returned_points
        - observation_span_days
        - segment_start_date
        - interval_kind
        - confidence_level
        - status
        - evidence
        - freshness
        - latest_trend
        - weekly_rate
        - short_term_variation
      properties:
        model_version:
          type: [integer, 'null']
          enum: [1, 2, null]
          description: Null when trend fitting or refresh is unavailable and only raw measurements are returned.
        status:
          type: string
          enum: [insufficient, provisional, sufficient, stale, unavailable]
          deprecated: true
          description: Compatibility field; use evidence and freshness independently.
        as_of_date: { type: string, format: date }
        scope_start_date: { type: [string, 'null'], format: date }
        scope_end_date: { type: [string, 'null'], format: date }
        latest_observation_date: { type: [string, 'null'], format: date }
        days_since_latest: { type: [integer, 'null'], minimum: 0 }
        modeled_start_date: { type: [string, 'null'], format: date }
        returned_points:
          type: integer
          minimum: 0
          description: All measurements returned for the requested display scope.
        modeled_observations:
          type: integer
          minimum: 0
          description: Source observations included in the coherent bounded model pass; zero when unavailable.
        returned_modeled_points:
          type: integer
          minimum: 0
          description: Returned measurements that also have a modeled trend point.
        modeled_points:
          type: integer
          minimum: 0
          deprecated: true
          description: Legacy alias of returned_modeled_points.
        observation_span_days: { type: number, minimum: 0 }
        segment_start_date: { type: [string, 'null'], format: date }
        interval_kind:
          type: string
          const: latent_weight_model_uncertainty
        confidence_level: { type: number, const: 0.95 }
        evidence: { type: string, enum: [insufficient, provisional, sufficient] }
        freshness: { type: string, enum: [current, stale, outdated, unavailable] }
        latest_trend:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/WeightTrendLatestEstimate'
        weekly_rate:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/WeightTrendWeeklyRate'
        short_term_variation:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/WeightTrendReadingVariation'
    TrendMetricsResponse:
      type: object
      required: [metrics, meta]
      properties:
        metrics:
          type: array
          description: Newest-first measurements; entries outside the modeled window are raw context.
          items: { $ref: '#/components/schemas/TrendMetricEntry' }
        meta:
          type: object
          required: [weekly_rate, volatility, total_points, total_span_days, trend_summary]
          properties:
            weekly_rate:
              type: number
              deprecated: true
              description: Legacy compatibility estimate from the latest uninterrupted segment. On unavailable refreshes, a safe last-known-good value is used or the established zero fallback.
            volatility:
              type: string
              enum: [low, medium, high]
              deprecated: true
              description: Legacy compatibility label. On unavailable refreshes, a safe last-known-good value is used or the established low fallback; use trend_summary.short_term_variation for availability.
            total_points: { type: integer, minimum: 0 }
            total_span_days: { type: number, minimum: 0 }
            trend_summary: { $ref: '#/components/schemas/WeightTrendSummary' }
    MetricSaveResponse:
      type: object
      required: [id, date, weight]
      properties:
        id: { type: integer }
        user_id: { type: integer }
        date: { type: string, format: date }
        body_fat_percent: { type: [number, 'null'] }
        weight: { type: number, exclusiveMinimum: 0 }
        progress_update: { $ref: '#/components/schemas/MetricProgressUpdate' }
    MetricProgressUpdate:
      type: object
      additionalProperties: false
      required: [save_kind, local_date, is_current_day, current_weight_grams, goal, recognitions]
      properties:
        save_kind: { type: string, enum: [created, updated, unchanged] }
        local_date: { type: string, format: date }
        is_current_day: { type: boolean }
        current_weight_grams: { type: integer, minimum: 1 }
        goal:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/MetricGoalProgressUpdate'
        recognitions:
          type: array
          items: { $ref: '#/components/schemas/MetricProgressRecognition' }
    MetricGoalProgressUpdate:
      type: object
      additionalProperties: false
      required: [id, mode, previous_progress_percent, current_progress_percent, remaining_weight_grams, is_complete, reached_local_date]
      properties:
        id: { type: integer }
        mode: { type: string, enum: [lose, gain, maintain] }
        previous_progress_percent: { type: [number, 'null'], minimum: 0, maximum: 100 }
        current_progress_percent: { type: [number, 'null'], minimum: 0, maximum: 100 }
        remaining_weight_grams: { type: integer, minimum: 0 }
        is_complete: { type: boolean }
        reached_local_date: { type: [string, 'null'], format: date }
    MetricProgressRecognition:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type]
          properties:
            type: { type: string, const: goal_reached }
        - type: object
          additionalProperties: false
          required: [type, threshold_percent]
          properties:
            type: { type: string, const: goal_percent }
            threshold_percent: { type: integer, enum: [25, 50, 75] }
        - type: object
          additionalProperties: false
          required: [type, threshold_grams]
          properties:
            type: { type: string, const: goal_weight }
            threshold_grams: { type: integer, minimum: 1 }
        - type: object
          additionalProperties: false
          required: [type, improvement_grams]
          properties:
            type: { type: string, const: meaningful_best }
            improvement_grams: { type: integer, minimum: 1 }
        - type: object
          additionalProperties: false
          required: [type]
          properties:
            type: { type: string, const: baseline_recorded }
    AccountExport:
      type: object
      additionalProperties: false
      required: [format, version, exported_at, account, legal_acceptances, goals, body_metrics, food_logs, food_log_days, food_tracking_pauses, my_foods, in_app_notifications, activity_records, activity_day_summaries, calibration_recommendations, calorie_plan_revisions]
      properties:
        format:
          type: string
          const: calibrate-account-export
        version:
          type: integer
          const: 7
        exported_at:
          type: string
          format: date-time
        account:
          $ref: '#/components/schemas/AccountExportProfile'
        legal_acceptances:
          type: array
          items:
            $ref: '#/components/schemas/AccountExportLegalAcceptance'
        goals:
          type: array
          items:
            $ref: '#/components/schemas/AccountExportGoal'
        body_metrics:
          type: array
          items:
            $ref: '#/components/schemas/AccountExportBodyMetric'
        food_logs:
          type: array
          items:
            $ref: '#/components/schemas/AccountExportFoodLog'
        food_log_days:
          type: array
          items:
            $ref: '#/components/schemas/AccountExportFoodLogDay'
        food_tracking_pauses:
          type: array
          items:
            $ref: '#/components/schemas/AccountExportFoodTrackingPause'
        my_foods:
          type: array
          items:
            $ref: '#/components/schemas/AccountExportMyFood'
        in_app_notifications:
          type: array
          items:
            $ref: '#/components/schemas/AccountExportNotification'
        activity_records:
          type: array
          items:
            $ref: '#/components/schemas/AccountExportActivityRecord'
        activity_day_summaries:
          type: array
          items:
            $ref: '#/components/schemas/AccountExportActivityDaySummary'
        calibration_recommendations:
          type: array
          items:
            $ref: '#/components/schemas/AccountExportCalibrationRecommendation'
        calorie_plan_revisions:
          type: array
          items:
            $ref: '#/components/schemas/AccountExportCaloriePlanRevision'
    AccountExportProfile:
      type: object
      required: [id, email, email_verified_at, created_at, weight_unit, height_unit, timezone, language, reminder_log_weight_enabled, reminder_log_food_enabled, haptics_enabled, date_of_birth, sex, height_mm, activity_level, profile_image]
      properties:
        id: { type: integer }
