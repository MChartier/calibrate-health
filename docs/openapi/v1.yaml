              additionalProperties: false
              required: [start_weight_grams, target_weight_grams, current_weight_grams, daily_deficit, progress_percent, remaining_weight_grams, is_complete, projection]
              properties:
                start_weight_grams: { type: integer, minimum: 25000, maximum: 400000 }
