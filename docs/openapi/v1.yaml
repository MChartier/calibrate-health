            payload:
              type: object
              additionalProperties: false
              required: [local_date, weight_grams, expected_revision]
              properties:
                local_date: { type: string, format: date }
                weight_grams: { type: integer, minimum: 25000, maximum: 400000 }
                expected_revision: { type: [string, 'null'] }
        - type: object
          additionalProperties: false
          required: [type, payload]
          properties:
            type: { const: food_day.set_complete }
            payload:
              type: object
              additionalProperties: false
              required: [local_date, is_complete, expected_revision]
              properties:
                local_date: { type: string, format: date }
                is_complete: { type: boolean }
                expected_revision: { type: [string, 'null'] }
    WatchFoodLog:
      type: object
      additionalProperties: false
      required: [id, date, local_date, meal_period, name, calories, my_food_id, servings_consumed, created_at]
      properties:
        id: { type: integer }
        date: { type: string, format: date-time }
        local_date: { type: string, format: date }
        meal_period:
          type: string
          enum: [BREAKFAST, MORNING_SNACK, LUNCH, AFTERNOON_SNACK, DINNER, EVENING_SNACK]
        name: { type: string }
        calories: { type: integer }
        my_food_id: { type: [integer, 'null'] }
        servings_consumed: { type: [number, 'null'] }
        serving_size_quantity_snapshot: { type: [number, 'null'] }
        serving_unit_label_snapshot: { type: [string, 'null'] }
        calories_per_serving_snapshot: { type: [number, 'null'] }
        external_source: { type: [string, 'null'] }
        external_id: { type: [string, 'null'] }
        brand_snapshot: { type: [string, 'null'] }
        locale_snapshot: { type: [string, 'null'] }
        barcode_snapshot: { type: [string, 'null'] }
        measure_label_snapshot: { type: [string, 'null'] }
        grams_per_measure_snapshot: { type: [number, 'null'] }
        measure_quantity_snapshot: { type: [number, 'null'] }
        grams_total_snapshot: { type: [number, 'null'] }
        created_at: { type: string, format: date-time }
    WatchMutationResponse:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, food_log]
          properties:
            type: { const: food.create }
            food_log: { $ref: '#/components/schemas/WatchFoodLog' }
        - type: object
          additionalProperties: false
          required: [type, food_log_id, deleted]
          properties:
            type: { const: food.delete }
            food_log_id: { type: integer }
            deleted: { const: true }
        - type: object
          additionalProperties: false
          required: [type, metric]
          properties:
            type: { const: metric.upsert }
            metric:
              type: object
              additionalProperties: false
              required: [id, local_date, weight_grams, revision]
              properties:
                id: { type: integer }
                local_date: { type: string, format: date }
                weight_grams: { type: integer }
                revision: { type: string }
        - type: object
          additionalProperties: false
          required: [type, food_day]
          properties:
            type: { const: food_day.set_complete }
            food_day:
              type: object
              additionalProperties: false
              required: [date, status, source, is_representative, is_complete, completed_at, revision]
              properties:
                date: { type: string, format: date }
                status: { type: string, enum: [OPEN, COMPLETE, INCOMPLETE, PAUSED] }
                source: { type: [string, 'null'], enum: [USER, PAUSE, IMPORT, null] }
                is_representative: { type: boolean }
                is_complete: { type: boolean }
                completed_at: { type: [string, 'null'], format: date-time }
                revision: { type: string }
    MobileDevicePlatform:
      type: string
      enum: [android_phone, wear_os]
    SyncChange:
      type: object
      required: [cursor, entity_type, entity_id, action, operation_id, payload, created_at]
      properties:
        cursor:
          type: string
          pattern: '^\d+$'
        entity_type:
          type: string
        entity_id:
          type: string
        action:
          type: string
          enum: [upsert, delete]
        operation_id:
          type: [string, 'null']
        payload: {}
        created_at:
          type: string
          format: date-time
    SyncChangesResponse:
      type: object
      required: [changes, next_cursor, has_more]
      properties:
        changes:
          type: array
          items:
            $ref: '#/components/schemas/SyncChange'
        next_cursor:
          type: string
          pattern: '^\d+$'
        has_more:
          type: boolean
    UserClientPayload:
      type: object
      required:
        - id
        - email
        - created_at
        - weight_unit
        - height_unit
        - timezone
        - language
        - reminder_log_weight_enabled
        - reminder_log_food_enabled
        - haptics_enabled
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
        weight_unit:
          type: string
          enum: [KG, LB]
        height_unit:
          type: string
          enum: [CM, FT_IN]
        timezone:
          type: string
        language:
          type: string
        reminder_log_weight_enabled:
          type: boolean
        reminder_log_food_enabled:
          type: boolean
        haptics_enabled:
          type: boolean
        date_of_birth:
          type: [string, 'null']
          format: date
        sex:
          type: [string, 'null']
          enum: [MALE, FEMALE, null]
        height_mm:
          type: [integer, 'null']
        activity_level:
          type: [string, 'null']
          enum: [SEDENTARY, LIGHT, MODERATE, ACTIVE, VERY_ACTIVE, null]
        profile_image_url:
          type: [string, 'null']
        onboarding_completed_at:
          type: [string, 'null']
          format: date-time
        account_access:
          $ref: '#/components/schemas/AccountAccess'
security:
  - mobileBearer: []
